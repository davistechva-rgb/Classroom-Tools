<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Volcano Challenge</title>
<style>.dice-pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:55;background:#fff;border:5px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:10px 24px;text-align:center;font-weight:800;pointer-events:none}
.dice-pop .d{font-size:4rem;line-height:1}
.mtn{position:relative;border:5px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;background:linear-gradient(#FFB570,#FFE8CC 40%);height:min(64vh,600px)}
.mtn .peak{position:absolute;left:50%;top:-2%;transform:translateX(-50%);font-size:3rem}
.mtn .heli{position:absolute;right:6%;top:4%;font-size:2.4rem;animation:hover 1.4s ease-in-out infinite alternate}@keyframes hover{to{transform:translateY(-8px)}}
.cols{position:absolute;inset:10% 4% 0 4%;display:flex;gap:10px;align-items:stretch}
.col{flex:1;position:relative;background:linear-gradient(90deg,#8D6E63,#A1887F 50%,#8D6E63);border:3px solid #5D4037;border-bottom:0;border-radius:30px 30px 0 0;overflow:hidden}
.col .ledge{position:absolute;left:0;right:0;height:3px;background:#5D403755}
.col .gem{position:absolute;left:50%;transform:translate(-50%,50%);font-size:1.1rem}
.col .nm{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-weight:800;font-size:.75rem;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 6px;white-space:nowrap;z-index:3}
.climber{position:absolute;left:50%;transform:translate(-50%,50%);font-size:clamp(1.6rem,4.4vh,2.4rem);transition:bottom .8s cubic-bezier(.3,1.3,.5,1);z-index:2}
.climber.slip{animation:slip .6s}@keyframes slip{30%{transform:translate(-30%,50%) rotate(25deg)}}
.lava{position:absolute;left:0;right:0;bottom:0;z-index:4;background:linear-gradient(#FF922B,#E03131 40%,#C92A2A);transition:height 1s ease;box-shadow:0 -10px 30px #FF922B}
.lava::before{content:"";position:absolute;left:0;right:0;top:-10px;height:14px;background:radial-gradient(circle at 10px 14px,#FF922B 10px,transparent 11px) 0 0/28px 14px;animation:bub 1.2s linear infinite}@keyframes bub{to{background-position:28px 0}}
.lvlbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}.lvlbar span{border:3px solid var(--ink);border-radius:99px;padding:2px 12px;font-weight:700;background:#fff}
.moves{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}.moves .btn small{display:block;font-size:.72rem;font-weight:600}</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="play.js"></script>
<script>
Kit.mount("🌋", "Volcano Challenge");
async function rollDie(lo,hi,label){const box=document.createElement('div');box.className='dice-pop';box.innerHTML=`<div>${label||'Rolling…'}</div><div class="d">🎲</div>`;document.body.appendChild(box);
 const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];let v;for(let k=0;k<12;k++){v=Kit.rand(lo,hi);box.querySelector('.d').textContent=faces[v-1]||v;Kit.tick();await Kit.sleep(55+k*8)}
 Kit.ding();await Kit.sleep(650);box.remove();return v}
Play.setup({defTeams:3,how:'The volcano is erupting and the lava is rising! Climb to the 🚁 helicopter at the top. Every right answer lets you climb. 🧗 Safe climb rolls 1–3, and 🪢 the risky route rolls 3–5 but you might slip back 2. Stop exactly on a ledge with a 💎 crystal for 2 bonus points. The lava rises every round (faster later). If it rises above your ledge, you\'re rescued from where you are. Watch out for falling rocks! Points: your height, plus crystals, plus 10 for making it to the top.',
start({teams,game}){
 const $=id=>document.getElementById(id);const TOP=20,GEMS=[4,8,12,16];let lava=-1,roundNo=1;
 const V=teams.map(()=>({h:0,gems:new Set(),done:false,top:false,slips:0,caught:false}));
 game.innerHTML=`<div class="mtn"><div class="peak">🌋</div><div class="heli">🚁</div><div class="cols">${teams.map((t,i)=>`<div class="col" id="col${i}"><span class="nm" style="background:${t.color}">${Kit.esc(t.name)}</span>
  ${Array.from({length:TOP},(_,k)=>`<div class="ledge" style="bottom:${(k+1)/(TOP+1)*100}%"></div>`).join('')}${GEMS.map(g=>`<span class="gem" id="gm${i}-${g}" style="bottom:${g/(TOP+1)*100}%">💎</span>`).join('')}
  <div class="climber" id="cl${i}">🧗</div></div>`).join('')}</div><div class="lava" id="lava"></div></div>
  <div class="lvlbar" id="lb"></div><div class="pl-msg" id="msg"></div><div id="act"></div><div id="ask"></div>`;
 const put=i=>$('cl'+i).style.bottom=`${(V[i].h)/(TOP+1)*100}%`;
 function draw(){teams.forEach((_,i)=>put(i));$('lava').style.height=`calc(${Math.max(0,lava)/(TOP+1)*90}% + 4px)`;
  $('lb').innerHTML=teams.map((t,i)=>`<span style="border-color:${t.color}">${Kit.esc(t.name)} · ⛰️ ${V[i].h}/${TOP} · 💎 ${V[i].gems.size}${V[i].top?' · 🚁 safe!':V[i].caught?' · 🔥 rescued':''}</span>`).join('')+`<span>🌋 Lava level ${Math.max(0,lava)}</span>`}
 draw();
 const active=()=>V.map((v,i)=>v.done?-1:i).filter(i=>i>=0);
 const choose=i=>new Promise(res=>{$('act').innerHTML=`<div class="card center"><span class="pl-turn" style="background:${teams[i].color}">${Kit.esc(teams[i].name)}</span> how will you climb? (ledge ${V[i].h}, lava ${Math.max(0,lava)})
  <div class="moves"><button class="btn green" data-m="safe">🧗 Safe climb<small>roll 1–3</small></button><button class="btn red" data-m="risk">🪢 Risky route<small>roll 3–5 · 35% slip −2</small></button></div></div>`;
  $('act').onclick=e=>{const b=e.target.closest('[data-m]');if(b){$('act').onclick=null;$('act').innerHTML='';res(b.dataset.m)}}});
 async function climb(i){const v=V[i];const m=await choose(i);let r=m==='safe'?await rollDie(1,3,'🧗 Safe climb'):await rollDie(3,5,'🪢 Risky route');
  if(m==='risk'&&Math.random()<.35){v.slips++;v.h=Math.max(0,v.h-2);draw();const el=$('cl'+i);el.classList.add('slip');setTimeout(()=>el.classList.remove('slip'),700);Play.banner(`😱 ${teams[i].name} slipped!`);Kit.tone(140,.5,'sawtooth',.2);return}
  v.h=Math.min(TOP,v.h+r);Kit.tone(500,.1,'triangle',.15);
  if(GEMS.includes(v.h)&&!v.gems.has(v.h)){v.gems.add(v.h);const g=$(`gm${i}-${v.h}`);g&&g.remove();Play.pop('+2 💎',$('cl'+i),'#99E9F2');Kit.ding()}
  if(v.h>=TOP){v.top=true;v.done=true;Play.banner(`🚁 ${teams[i].name} reached the helicopter!`);Kit.tada()}draw();await Kit.sleep(700)}
 async function round(){$('msg').textContent=`Round ${roundNo}`;const right=await Play.ask($('ask'),active(),{goWord:'Climb!'});
  for(const i of right)if(!V[i].done)await climb(i);
  // the volcano acts
  lava+=roundNo>=6?2:1;if(roundNo%3===0){const a=active().filter(i=>V[i].h>0);if(a.length){const i=Kit.pick(a);V[i].h=Math.max(0,V[i].h-1);Play.banner(`🪨 Falling rocks hit ${teams[i].name}!`);Kit.tone(90,.4,'sawtooth',.2)}}
  Kit.tone(120,.8,'sine',.1);draw();await Kit.sleep(1000);
  for(const i of active()){if(V[i].h<lava){V[i].done=true;V[i].caught=true;Play.banner(`🔥 Lava! 🚁 rescues ${teams[i].name} from ledge ${V[i].h}`);draw();await Kit.sleep(900)}}
  if(!active().length){const sc=V.map(v=>v.h+v.gems.size*2+(v.top?10:0));
   return Play.podium('🌋','Everyone is off the volcano!',sc,{'⛰️ Height':V.map(v=>v.h),'💎 Crystals':V.map(v=>v.gems.size),'🚁 Top':V.map(v=>v.top?'yes':'no')})}
  roundNo++;setTimeout(round,1100)}
 round()}});

</script>
</body></html>
