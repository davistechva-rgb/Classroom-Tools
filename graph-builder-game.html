<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Graph Builder Game</title>
<style>
main{max-width:1500px}
.gb-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
.gb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
@media (max-width:960px){.gb{grid-template-columns:minmax(0,1fr)}}
.gb-p{background:#fff;border:5px solid var(--ink);border-radius:22px;padding:12px;display:grid;gap:10px;box-shadow:6px 6px 0 var(--ink)}
.gb-crowd{display:flex;flex-wrap:wrap;gap:4px;font-size:clamp(1.6rem,3.6vw,2.2rem);background:#F4FAFF;border-radius:14px;padding:8px;min-height:80px}
.gb-crowd span{cursor:pointer;transition:transform .15s,opacity .2s}.gb-crowd span.ct{opacity:.25;transform:scale(.8)}
.gb-tally{display:grid;gap:4px}.gb-tally div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;font-weight:900}
.gb-chart{position:relative;height:340px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px}
.gb-y{position:relative}.gb-y span{position:absolute;right:4px;transform:translateY(50%);font-weight:900;font-size:.85rem}
.gb-plot{position:relative;border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);display:flex;justify-content:space-around;align-items:flex-end;gap:6px;padding:0 6px;background:repeating-linear-gradient(to top,transparent 0,transparent calc(var(--u) - 1px),#DDE4F0 calc(var(--u) - 1px),#DDE4F0 var(--u))}
.gb-col{flex:1;max-width:110px;height:100%;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:ns-resize;touch-action:none}
.gb-bar{width:100%;background:var(--c);border:4px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;transition:height .15s;position:relative;min-height:0}
.gb-bar .h{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:44px;height:18px;border:3px solid var(--ink);border-radius:9px;background:#fff}
.gb-col.ok .gb-bar{box-shadow:0 0 0 4px #5DC66E}.gb-col.no .gb-bar{box-shadow:0 0 0 4px #E5533F}
.gb-pic{display:flex;flex-direction:column-reverse;align-items:center;font-size:1.6rem;line-height:1.1;gap:1px}
.gb-x{display:flex;justify-content:space-around;margin-left:48px;padding:4px 6px 0;gap:6px}.gb-x span{flex:1;max-width:110px;text-align:center;font-weight:900;font-size:.9rem}.gb-x span b{display:block;font-size:1.6rem}
.gb-val{position:absolute;bottom:calc(var(--h) + 14px);font-weight:900;background:var(--ink);color:#fff;border-radius:8px;padding:0 6px;font-size:.9rem}
.gb-q{display:grid;gap:8px}.gb-q div{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:800;font-size:1.05rem}
.gb-q input,.gb-q select{font:inherit;font-weight:800;width:90px;padding:3px 6px;border:3px solid var(--ink);border-radius:10px}.gb-q select{width:auto}
.gb-q .r{font-size:1.3rem}
.gb-msg{font-weight:900;font-size:1.2rem;min-height:1.4em}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("📊", "Graph Builder Game");
const $=id=>document.getElementById(id);
const SETS={fruit:['Favorite fruit',[['🍎','Apple'],['🍌','Banana'],['🍇','Grapes'],['🍓','Strawberry']]],pets:['Pets at home',[['🐶','Dog'],['🐱','Cat'],['🐟','Fish'],['🐹','Hamster'],['🐦','Bird']]],weather:['Weather this month',[['☀️','Sunny'],['☁️','Cloudy'],['🌧️','Rainy'],['❄️','Snowy']]],sport:['Favorite sport',[['⚽','Soccer'],['🏀','Basketball'],['⚾','Baseball'],['🏊','Swimming']]],travel:['How we get to school',[['🚌','Bus'],['🚗','Car'],['🚶','Walk'],['🚲','Bike']]]};
const COL=['#FF6B5B','#FFC93C','#5DC66E','#22C3E6','#9B6BF2','#FF9F43'];
let set=Kit.get('gb-set','fruit'),mode=Kit.get('gb-mode','bar'),data=[],built=[],max=10,step=1,vote=false,checked=false,qs=[];
function cats(){return SETS[set][1]}
function newData(){const C=cats();step=mode==='pic2'?2:1;max=step===2?20:10;data=C.map(()=>Kit.rand(1,max/step)*step);if(new Set(data).size<C.length-1)return newData();built=C.map(()=>0);checked=false;crowd=Kit.shuffle(C.flatMap((c,i)=>Array(data[i]).fill(i)));counted=new Set();makeQs();draw()}
let crowd=[],counted=new Set();
function makeQs(){const C=cats(),hi=data.indexOf(Math.max(...data)),lo=data.indexOf(Math.min(...data));const P=[];C.forEach((_,x)=>C.forEach((_,y)=>{if(data[x]>data[y])P.push([x,y])}));const [a,b]=P.length?Kit.pick(P):[0,1];
 qs=[{t:'Which got the MOST?',k:'pick',a:hi},{t:'Which got the FEWEST?',k:'pick',a:lo},{t:`How many more ${C[a][0]} ${C[a][1]} than ${C[b][0]} ${C[b][1]}?`,k:'num',a:data[a]-data[b]},{t:'How many in all?',k:'num',a:data.reduce((s,x)=>s+x,0)}].map(q=>({...q,v:'',r:null}))}
document.querySelector('main').innerHTML=`<div class="gb-top"><select id="st" style="width:auto">${Object.entries(SETS).map(([k,v])=>`<option value="${k}">${v[1][0][0]} ${v[0]}</option>`).join('')}</select><select id="md" style="width:auto"><option value="bar">📊 Bar graph</option><option value="pic">😀 Picture graph (1 each)</option><option value="pic2">😀 Picture graph (each = 2)</option></select><button class="btn green" id="nw">🎲 New data</button><button class="btn white small" id="vt">🙋 Class vote</button></div>
<div class="gb"><div class="gb-p"><b id="tt"></b><div class="muted" style="font-weight:700" id="hp"></div><div class="gb-crowd" id="cr"></div><div class="gb-tally" id="tl"></div></div>
<div class="gb-p"><b>📊 Build the graph</b><div class="muted" style="font-weight:700" id="ins"></div><div class="gb-chart"><div class="gb-y" id="ya"></div><div class="gb-plot" id="pl"></div></div><div class="gb-x" id="xa"></div><div class="row" style="gap:8px"><button class="btn green" id="ck">✅ Check my graph</button><span class="gb-msg" id="mg"></span></div>
<div id="qq" hidden><b>🤔 Read your graph</b><div class="gb-q" id="qs"></div><button class="btn green small" id="qa">✅ Check answers</button></div></div></div>`;
function draw(){const C=cats();$('st').value=set;$('md').value=mode;$('tt').textContent=`📋 ${SETS[set][0]}`;$('vt').className='btn small '+(vote?'':'white');$('vt').textContent=vote?'🙋 Voting on: tap + to add votes':'🙋 Class vote';
 $('hp').textContent=vote?'Tap + for each vote in the class.':'Tap each picture as you count it so you don\'t count twice!';
 $('cr').innerHTML=vote?'':crowd.map((c,i)=>`<span data-c="${i}" class="${counted.has(i)?'ct':''}">${C[c][0]}</span>`).join('');$('cr').hidden=vote;
 $('tl').innerHTML=vote?C.map((c,i)=>`<div><span>${c[0]} ${c[1]}</span><span style="display:flex;gap:6px;align-items:center"><button class="btn green small" data-v="${i}">+</button><button class="btn white small" data-v="${i}" data-m="1">−</button> ${data[i]}</span></div>`).join(''):'';
 const u=340/max;$('pl').style.setProperty('--u',(u*step)+'px');
 $('ya').innerHTML=Array.from({length:max/step+1},(_,k)=>`<span style="bottom:${k*step*u}px">${k*step}</span>`).join('');
 $('ins').textContent=mode==='bar'?'Drag each bar up or down to the right number.':`Tap a column to add a picture, tap the top picture to take one away.${mode==='pic2'?' Each picture means 2!':''}`;
 $('pl').innerHTML=C.map((c,i)=>{const h=built[i]*u;const cls=checked?(built[i]===data[i]?'ok':'no'):'';return mode==='bar'?`<div class="gb-col ${cls}" data-i="${i}"><span class="gb-val" style="--h:${h}px">${built[i]}</span><div class="gb-bar" style="height:${h}px;--c:${COL[i%6]}"><span class="h"></span></div></div>`:`<div class="gb-col ${cls}" data-i="${i}" style="cursor:pointer"><div class="gb-pic" style="height:${h}px">${Array(built[i]/step).fill(`<span style="height:${u*step}px;display:grid;place-items:center">${c[0]}</span>`).join('')}</div></div>`}).join('');
 $('xa').innerHTML=C.map(c=>`<span><b>${c[0]}</b>${c[1]}</span>`).join('');
 $('qq').hidden=!checked||!data.every((d,i)=>built[i]===d);
 $('qs').innerHTML=qs.map((q,i)=>`<div><span>${q.t}</span>${q.k==='pick'?`<select data-q="${i}"><option value="">choose…</option>${C.map((c,k)=>`<option value="${k}" ${q.v===String(k)?'selected':''}>${c[0]} ${c[1]}</option>`).join('')}</select>`:`<input data-q="${i}" type="number" value="${q.v}">`}<span class="r">${q.r==null?'':q.r?'✅':'❌'}</span></div>`).join('');
 window.__t={data:[...data],built:[...built],checked,ok:data.every((d,i)=>built[i]===d),qok:qs.filter(q=>q.r).length,max}}
$('cr').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const i=+b.dataset.c;counted.has(i)?counted.delete(i):counted.add(i);Kit.tick();b.classList.toggle('ct',counted.has(i))};
$('tl').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const i=+b.dataset.v;data[i]=Math.max(0,Math.min(max,data[i]+(b.dataset.m?-step:step)));checked=false;makeQs();Kit.tick();draw()};
// bars: drag to set height, snapping to whole steps
let drag=null;
function setFrom(e,col){const r=col.getBoundingClientRect();const v=Math.round(Math.max(0,Math.min(1,(r.bottom-e.clientY)/r.height))*max/step)*step;const i=+col.dataset.i;if(built[i]!==v){built[i]=v;checked=false;Kit.tone(400+v*40,.04,'triangle',.05);draw()}}
$('pl').onpointerdown=e=>{const col=e.target.closest('[data-i]');if(!col)return;if(mode==='bar'){drag=+col.dataset.i;setFrom(e,col)}else{const i=+col.dataset.i;const top=e.target.closest('.gb-pic span');const r=col.getBoundingClientRect();
  if(top&&top===col.querySelector('.gb-pic').lastElementChild)built[i]=Math.max(0,built[i]-step);else if(built[i]<max)built[i]+=step;checked=false;Kit.tick();draw()}};
window.addEventListener('pointermove',e=>{if(drag==null)return;const col=$('pl').querySelector(`[data-i="${drag}"]`);if(col)setFrom(e,col)});window.addEventListener('pointerup',()=>drag=null);
$('ck').onclick=()=>{checked=true;const ok=data.every((d,i)=>built[i]===d);$('mg').textContent=ok?'🎉 Perfect graph! Now answer the questions.':`${data.filter((d,i)=>built[i]===d).length} of ${data.length} are right. Fix the red ones!`;ok?Kit.tada():Kit.tone(200,.2,'triangle',.1);draw()};
$('qs').oninput=e=>{const i=e.target.dataset.q;if(i!=null)qs[+i].v=e.target.value};$('qs').onchange=$('qs').oninput;
$('qa').onclick=()=>{qs.forEach(q=>q.r=q.v!==''&&+q.v===q.a);const n=qs.filter(q=>q.r).length;if(n===qs.length){Kit.tada();Kit.confetti(120)}else Kit.tone(200,.2,'triangle',.1);draw()};
$('nw').onclick=()=>{vote=false;newData()};$('st').onchange=()=>{set=$('st').value;Kit.set('gb-set',set);vote=false;newData()};$('md').onchange=()=>{mode=$('md').value;Kit.set('gb-mode',mode);newData()};
$('vt').onclick=()=>{vote=!vote;if(vote){data=cats().map(()=>0);built=data.map(()=>0);checked=false;makeQs()}else newData();draw()};
newData();
</script>
</body></html>
