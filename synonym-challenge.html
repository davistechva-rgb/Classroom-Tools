<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Synonym Challenge</title>
<style>
main{max-width:1200px}
.sy-top{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sy-word{text-align:center;background:#fff;border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:10px 16px;margin-bottom:14px}
.sy-word small{font-weight:800;letter-spacing:.1em;color:#6B7695}
.sy-word b{display:block;font-size:clamp(2.2rem,7vw,4.4rem);line-height:1.1}
.sy-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.sy-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sy-c{font:inherit;font-weight:800;font-size:clamp(1.1rem,2.6vw,1.6rem);border:5px solid var(--ink);border-radius:18px;padding:18px 6px;background:#fff;cursor:pointer;box-shadow:0 6px 0 var(--ink);color:var(--ink)}
.sy-c.ok{background:#8BE09A;transform:scale(.96)}.sy-c.bad{background:#FFB3AA;opacity:.6}.sy-c.miss{outline:5px dashed #1E8E3E}
.sy-time{height:18px;border:4px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;flex:1;min-width:160px;max-width:420px}.sy-time b{display:block;height:100%;background:var(--sun)}
.sy-msg{text-align:center;font-weight:800;font-size:1.3rem;color:#fff;text-shadow:2px 2px 0 var(--ink);min-height:1.5em;margin:12px 0}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🔁", "Synonym Challenge");
const $=id=>document.getElementById(id);
const S0=[['big',['large','huge','giant','enormous'],['tiny','small','short','quick']],['happy',['glad','joyful','cheerful','pleased'],['sad','grumpy','tired','angry']],['fast',['quick','speedy','rapid','swift'],['slow','late','lazy','calm']],['small',['tiny','little','mini','wee'],['huge','tall','wide','heavy']],['sad',['unhappy','gloomy','upset','blue'],['glad','silly','proud','brave']],['smart',['clever','bright','wise','brainy'],['silly','loud','messy','sleepy']],['cold',['chilly','icy','frosty','freezing'],['warm','hot','sunny','dry']],['pretty',['lovely','beautiful','cute','gorgeous'],['ugly','plain','messy','rough']],['scared',['afraid','frightened','nervous','fearful'],['brave','bold','calm','proud']],['angry',['mad','furious','cross','upset'],['calm','happy','gentle','kind']],['funny',['silly','hilarious','goofy','comical'],['serious','boring','sad','quiet']],['tired',['sleepy','weary','drowsy','worn out'],['awake','lively','fresh','busy']],['loud',['noisy','booming','roaring','rowdy'],['quiet','silent','soft','still']],['look',['see','watch','stare','glance'],['hear','touch','taste','smell']],['say',['tell','speak','state','shout'],['listen','write','hear','think']],['begin',['start','open','launch','kick off'],['end','finish','stop','close']],['easy',['simple','basic','plain','effortless'],['hard','tricky','tough','difficult']],['nice',['kind','friendly','sweet','caring'],['mean','rude','grumpy','bossy']],['shiny',['bright','glossy','sparkly','gleaming'],['dull','dark','dusty','muddy']],['walk',['stroll','march','hike','wander'],['run','sit','fly','swim']]];
let S=[];const parseS=t=>{const L=Kit.lines(t).map(l=>{const [w,y,n]=l.split('|').map(x=>x.trim());return w&&y&&n?[w,y.split(',').map(x=>x.trim()).filter(Boolean).slice(0,4),n.split(',').map(x=>x.trim()).filter(Boolean).slice(0,4)]:null}).filter(r=>r&&r[1].length>=2&&r[2].length>=2);S=L.length?L:S0};
parseS(Kit.editable({key:'synonyms',title:'Synonym rounds',help:'(one per line: word | same-meaning words, with commas | other words, with commas. Up to 4 of each.)',def:S0.map(r=>`${r[0]} | ${r[1].join(', ')} | ${r[2].join(', ')}`).join('\n'),onSave:t=>{parseS(t);bag=[]}}));
const TIME=25,GOAL=8;let cur,found=0,bad=0,sc=0,t=0,timer=null,bag=[],rn=0;
document.querySelector('main').innerHTML=`<div class="sy-top"><span class="ln-pill">Round <b id="rn">0</b>/${GOAL}</span><span class="ln-pill">⭐ <b id="sc">0</b></span><div class="sy-time"><b id="tb"></b></div><span class="ln-pill">⏱️ <b id="tt">${TIME}</b></span></div>
<div class="sy-word"><small>TAP EVERY WORD THAT MEANS THE SAME AS</small><b id="wd">Ready?</b></div><div class="sy-grid" id="gr"></div><div class="sy-msg" id="msg"></div><div class="row" style="justify-content:center"><button class="btn big green" id="go">▶ Start</button></div>`;
function round(){if(rn>=GOAL)return end();rn++;if(!bag.length)bag=Kit.shuffle(S);cur=bag.pop();found=0;bad=0;t=TIME;$('rn').textContent=rn;$('wd').textContent=cur[0].toUpperCase();$('msg').textContent=`Find all ${cur[1].length}!`;$('go').hidden=true;
 const cards=Kit.shuffle([...cur[1].map(w=>[w,1]),...cur[2].map(w=>[w,0])]);$('gr').innerHTML=cards.map(([w,g])=>`<button class="sy-c" data-g="${g}">${w}</button>`).join('');
 clearInterval(timer);timer=setInterval(()=>{t-=.1;$('tb').style.width=Math.max(0,t/TIME*100)+'%';$('tt').textContent=Math.ceil(Math.max(0,t));if(t<=0){clearInterval(timer);reveal('⏰ Time! Here are the ones you missed.')}},100);window.__t={syn:cur[1]}}
function reveal(m){clearInterval(timer);$('gr').querySelectorAll('[data-g="1"]:not(.ok)').forEach(b=>b.classList.add('miss'));$('gr').querySelectorAll('.sy-c').forEach(b=>b.disabled=true);$('msg').textContent=m;setTimeout(round,2400)}
$('gr').onclick=e=>{const b=e.target.closest('.sy-c');if(!b||b.disabled||b.classList.contains('ok')||b.classList.contains('bad'))return;
 if(b.dataset.g==='1'){b.classList.add('ok');found++;sc+=1+Math.ceil(t/10);Kit.tone(500+found*120,.12,'triangle',.25);if(found===cur[1].length){Kit.ding();reveal(bad?'✅ Got them all!':'🌟 Perfect! No mistakes!');if(!bad)sc+=3}}
 else{b.classList.add('bad');bad++;sc=Math.max(0,sc-1);Learn.flash(b,false);$('msg').textContent=`"${b.textContent}" doesn't mean ${cur[0]}.`}
 $('sc').textContent=sc};
function end(){clearInterval(timer);rn=0;Learn.finish('🔁','Challenge complete!',`You scored ${sc} points!`,()=>{sc=0;$('sc').textContent=0;round()})}
$('go').onclick=()=>{sc=0;$('sc').textContent=0;round()};
</script>
</body></html>
