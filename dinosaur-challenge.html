<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Dinosaur Challenge</title>
<style>
.dig{border:5px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:14px;background:#C49A6C}
.site{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:820px;margin:0 auto}
.sq{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:clamp(.9rem,2.6vh,1.5rem);background:linear-gradient(135deg,#A47148,#8B5A2B);position:relative;border:0;padding:0;font-family:inherit}
.sq:nth-child(3n){background:linear-gradient(135deg,#B07D4F,#94622F)}
.sq.open{background:#E8D3B0}.dig.brush .sq:not(.open){cursor:pointer}.dig.brush .sq:not(.open):hover{filter:brightness(1.3)}
.sq.dust{animation:dust .5s}@keyframes dust{50%{transform:scale(.85);filter:brightness(1.6)}}
.museums{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.mus{background:#FFF8E7;border:4px solid var(--ink);border-radius:18px;padding:8px}
.mus h3{margin:0 0 4px;text-align:center}.sets{display:grid;gap:4px}
.set{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 6px}
.set .pcs{flex:1;letter-spacing:.1em}.set.done{background:#D3F9D8}
.set .dn{font-size:1.4rem}</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="play.js"></script>
<script>
Kit.mount("🦖", "Dinosaur Challenge");

Play.setup({defTeams:3,how:'Dig up dinosaurs! Under the dirt are fossil pieces from 3 dinosaurs: 🦖 T. rex, 🦕 Brachiosaurus, and 🦴 Triceratops. Each has a 💀 skull, 🦴 ribs, 🦵 legs, and a 〰️ tail. Every right answer lets your team brush away one square (two on a streak). Each piece you find goes to your museum. Complete a whole skeleton for a big +10 bonus! 💛 Amber is worth 3, and 🪨 rocks are worth nothing. Most museum points when the site is dug out (or after 10 rounds) wins.',
start({teams,game}){
 const $=id=>document.getElementById(id);const C=10,R=6,N=C*R;
 const DINOS=[['trex','🦖','T. rex'],['brach','🦕','Brachiosaurus'],['trike','🦴','Triceratops']];const PARTS=[['skull','💀'],['ribs','🦴'],['legs','🦵'],['tail','〰️']];
 const content=[];DINOS.forEach(d=>PARTS.forEach(p=>{for(let k=0;k<2;k++)content.push({t:'fossil',d:d[0],p:p[0]})}));for(let k=0;k<5;k++)content.push({t:'amber'});for(let k=0;k<8;k++)content.push({t:'rock'});
 while(content.length<N)content.push({t:'dirt'});const site=Kit.shuffle(content);const open=new Set();
 const M=teams.map(()=>({sets:{trex:new Set(),brach:new Set(),trike:new Set()},amber:0,done:[],digs:0}));let roundNo=1;const ROUNDS=10;
 const pts=m=>Object.values(m.sets).reduce((s,x)=>s+x.size*2,0)+m.amber*3+m.done.length*10;
 game.innerHTML=`<div class="pl-score" id="sc"></div><div class="dig" id="dig"><div class="site" id="site">${site.map((c,k)=>`<button class="sq" data-k="${k}" aria-label="Dig square ${k+1}"></button>`).join('')}</div></div>
  <div class="museums" id="mus"></div><div class="pl-msg" id="msg"></div><div id="ask"></div>`;
 function draw(){$('sc').innerHTML=teams.map((t,i)=>`<span style="border-color:${t.color}">${Kit.esc(t.name)}: ${pts(M[i])}</span>`).join('')+`<span>Round ${Math.min(roundNo,ROUNDS)} of ${ROUNDS}</span>`;
  $('mus').innerHTML=teams.map((t,i)=>`<div class="mus" style="border-color:${t.color}"><h3>🏛️ ${Kit.esc(t.name)}'s Museum ${M[i].amber?'💛'.repeat(M[i].amber):''}</h3><div class="sets">${DINOS.map(d=>{const s=M[i].sets[d[0]];const done=M[i].done.includes(d[0]);
   return `<div class="set ${done?'done':''}"><span class="dn">${d[1]}</span><span class="pcs">${PARTS.map(p=>s.has(p[0])?p[1]:'▫️').join(' ')}</span>${done?'✅ +10':''}</div>`}).join('')}</div></div>`).join('')}
 draw();
 async function brush(i){$('dig').classList.add('brush');$('msg').innerHTML=`🖌️ <span class="pl-turn" style="background:${teams[i].color}">${Kit.esc(teams[i].name)}</span> pick a square to brush`;
  const k=await new Promise(res=>{$('site').onclick=e=>{const b=e.target.closest('.sq:not(.open)');if(b){$('site').onclick=null;res(+b.dataset.k)}}});
  $('dig').classList.remove('brush');open.add(k);const b=$('site').children[k];b.classList.add('open','dust');M[i].digs++;for(let n=0;n<3;n++)Kit.tone(1800-n*300,.05,'triangle',.06,n*.07);
  const c=site[k];const m=M[i];
  if(c.t==='fossil'){const d=DINOS.find(x=>x[0]===c.d),p=PARTS.find(x=>x[0]===c.p);b.textContent=p[1];b.style.background='#FFF3BF';
   if(m.sets[c.d].has(c.p)){$('msg').textContent=`A ${d[2]} ${c.p}, but your museum already has one.`;Kit.tick()}
   else{m.sets[c.d].add(c.p);Play.pop(`${d[1]} ${p[1]} +2`,b,'#FFE066');Kit.ding();$('msg').textContent=`Found a ${d[2]} ${c.p}!`;
    if(m.sets[c.d].size===4&&!m.done.includes(c.d)){m.done.push(c.d);Kit.tada();Kit.confetti(60);Play.banner(`${d[1]} ${teams[i].name} completed a ${d[2]}! +10`)}}}
  else if(c.t==='amber'){m.amber++;b.textContent='💛';b.style.background='#FFE066';Play.pop('+3 💛',b,'#FFE066');Kit.ding();$('msg').textContent='Ancient amber! +3'}
  else if(c.t==='rock'){b.textContent='🪨';Kit.tone(160,.15,'square',.1);$('msg').textContent='Just a rock.'}
  else{b.textContent='';$('msg').textContent='Only dirt…'}
  draw();await Kit.sleep(500)}
 let turn=0;
 async function round(){const order=teams.map((t,k)=>(turn+k)%teams.length);const right=await Play.ask($('ask'),teams.map(t=>t.i),{goWord:'Start digging!'});
  for(const i of order.filter(x=>right.includes(x))){for(let n=0;n<(Play.streak[i]>=3?2:1);n++){if(open.size>=N)break;await brush(i)}}
  turn=(turn+1)%teams.length;
  if(open.size>=N||roundNo>=ROUNDS)return Play.podium('🦖','Museum opening day!',M.map(pts),{'🦴 Skeletons':M.map(m=>m.done.length),'💛 Amber':M.map(m=>m.amber),'🖌️ Digs':M.map(m=>m.digs)});
  roundNo++;setTimeout(round,900)}
 round()}});

</script>
</body></html>
