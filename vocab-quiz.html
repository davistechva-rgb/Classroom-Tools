<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Vocabulary Quiz</title>
<style>summary{cursor:pointer}</style></head>
<body>
<main>
<details class="card noprint setup" style="margin-bottom:20px"><summary><b>Your vocabulary list</b> <span class="muted">(tap to edit)</span></summary>
<p class="muted">One per line: word | meaning. You need at least 4.</p><textarea id="list"></textarea></details></main>
<script src="kit.js"></script>
<script src="quiz.js"></script>
<script>
Kit.mount('📚', 'Vocabulary Quiz');

const $=id=>document.getElementById(id);
$('list').value=Kit.get('vq-list',`enormous | Very, very big
tiny | Very small
brave | Not afraid to do something scary
curious | Wanting to learn or know more
ancient | Very, very old
fragile | Easy to break
gigantic | Huge
grateful | Feeling thankful
exhausted | Very tired
furious | Very angry
cautious | Careful to avoid danger
generous | Happy to give and share`);
$('list').oninput=()=>Kit.set('vq-list',$('list').value);
const L=()=>Kit.lines($('list').value).map(l=>l.split('|').map(s=>s.trim())).filter(p=>p[0]&&p[1]);
Quiz.init({levels:['See the word, pick the meaning','See the meaning, pick the word'],levelLabel:'Mode',makeQ(lv){const l=L();
 if(l.length<4)return{q:'Add at least 4 words with meanings to your list.',answer:'-',options:[]};
 const [w,m]=Kit.pick(l);return lv===0?{q:`What does "${w}" mean?`,answer:m,options:[m,...Quiz.wrong(l.map(x=>x[1]),m)]}:{q:m,answer:w,options:[w,...Quiz.wrong(l.map(x=>x[0]),w)]}}});

</script>
</body></html>
