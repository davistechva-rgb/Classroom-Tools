<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Story Plot Map</title>
<style>
main{max-width:1500px}
.pm-graph{position:relative;height:clamp(260px,40vh,380px);border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);background:linear-gradient(#FFE3DF,#FFF6C9 45%,#E3F2FF);overflow:hidden;touch-action:none}
.pm-graph svg{position:absolute;inset:0;width:100%;height:100%}
.pm-ylab{position:absolute;left:8px;font-weight:800;font-size:.85rem;color:#55607E}
.pm-dot{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--dc);border:4px solid var(--ink);display:grid;place-items:center;font-weight:800;color:#fff;cursor:ns-resize;z-index:2;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.pm-dot.peak{width:48px;height:48px;background:#FF5A4E}
.pm-dot.peak::after{content:"⭐ CLIMAX";position:absolute;top:-30px;white-space:nowrap;background:var(--ink);color:#fff;border-radius:99px;padding:1px 8px;font-size:.75rem}
.pm-evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:16px}
.pm-ev{background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px;display:grid;gap:4px}
.pm-ev .h{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.pm-ev .h span{width:30px;height:30px;border-radius:50%;background:var(--dc);border:3px solid var(--ink);display:grid;place-items:center;color:#fff}
.pm-ev textarea{min-height:70px;font-size:1rem!important}
.pm-ev.peak{outline:5px solid #FF5A4E}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🗺️", "Story Plot Map");
const $=id=>document.getElementById(id);const DC=['#5DC66E','#22C3E6','#9B6BF2','#FF9F43','#FF8FC7','#2BC4B0','#FFB020','#1D2B53'];
const EX=[{t:'Three pigs leave home to build their own houses.',v:10},{t:'The first pig builds a house of straw. The wolf blows it down!',v:35},{t:'The second pig builds a house of sticks. The wolf blows it down too!',v:58},{t:'The wolf tries to blow down the brick house, but he can\'t.',v:75},{t:'The wolf climbs down the chimney and falls into a pot of hot water!',v:95},{t:'The wolf runs away and never comes back.',v:40},{t:'The three pigs live happily and safely in the brick house.',v:12}];
const st=Kit.get('pm-state',{title:'The Three Little Pigs',ev:EX});const save=()=>Kit.set('pm-state',st);
document.querySelector('main').innerHTML=`<input type="text" id="ti" style="font-size:1.5rem!important;font-weight:800;text-align:center;margin-bottom:12px;border-width:5px" placeholder="Story title">
<div class="pm-graph" id="g"><svg id="sv" preserveAspectRatio="none"></svg><span class="pm-ylab" style="top:8px">😱 Most exciting</span><span class="pm-ylab" style="bottom:8px">😌 Calm</span></div>
<p class="muted" style="text-align:center;color:#fff;font-weight:700">Drag each dot up or down to show how exciting that part of the story is. The highest dot is the climax.</p>
<div class="row" style="justify-content:center"><button class="btn green" id="add">＋ Add an event</button><button class="btn white" id="ex">🐷 Three Little Pigs example</button><button class="btn white small" id="clr">🧽 Start over</button></div><div class="pm-evs" id="evs"></div>`;
function peak(){let m=-1,k=-1;st.ev.forEach((e,i)=>{if(e.v>m){m=e.v;k=i}});return k}
function graph(){const g=$('g'),W=g.clientWidth,H=g.clientHeight,n=st.ev.length,pk=peak();g.querySelectorAll('.pm-dot').forEach(d=>d.remove());
 const P=st.ev.map((e,i)=>[n>1?6+i*88/(n-1):50,90-e.v*.8]);
 const path=P.map((p,i)=>`${i?'L':'M'}${p[0]*W/100} ${p[1]*H/100}`).join(' ');
 $('sv').setAttribute('viewBox',`0 0 ${W} ${H}`);$('sv').innerHTML=n?`<path d="${path} L ${P[n-1][0]*W/100} ${H} L ${P[0][0]*W/100} ${H} Z" fill="rgba(155,107,242,.15)"/><path d="${path}" fill="none" stroke="#1D2B53" stroke-width="5" stroke-linejoin="round"/>`:'';
 P.forEach((p,i)=>g.insertAdjacentHTML('beforeend',`<span class="pm-dot ${i===pk?'peak':''}" data-i="${i}" style="left:${p[0]}%;top:${p[1]}%;--dc:${DC[i%8]}">${i+1}</span>`));window.__t={n,peak:pk}}
function evs(){const pk=peak();$('evs').innerHTML=st.ev.map((e,i)=>`<div class="pm-ev ${i===pk?'peak':''}" style="--dc:${DC[i%8]}"><div class="h"><span>${i+1}</span>${i===pk?'⭐ Climax':i===0?'🏁 Beginning':i===st.ev.length-1?'🏡 Ending':i<pk?'⬆️ Rising':'⬇️ Falling'}<button class="btn white small" data-del="${i}">✕</button></div><textarea data-i="${i}" placeholder="What happens?">${Kit.esc(e.t)}</textarea></div>`).join('')}
function draw(){graph();evs()}
let dr=null;
$('g').addEventListener('pointerdown',e=>{const d=e.target.closest('.pm-dot');if(!d)return;e.preventDefault();dr={i:+d.dataset.i,r:$('g').getBoundingClientRect()};d.setPointerCapture(e.pointerId)});
$('g').addEventListener('pointermove',e=>{if(!dr)return;const y=(e.clientY-dr.r.top)/dr.r.height*100;st.ev[dr.i].v=Math.max(0,Math.min(100,Math.round((90-y)/.8)));graph()});
$('g').addEventListener('pointerup',()=>{if(dr){dr=null;save();evs()}});
$('evs').addEventListener('input',e=>{const t=e.target.closest('[data-i]');if(t){st.ev[+t.dataset.i].t=t.value;save()}});
$('evs').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b&&confirm('Remove this event?')){st.ev.splice(+b.dataset.del,1);save();draw()}});
$('add').onclick=()=>{st.ev.push({t:'',v:30});save();draw();const t=$('evs').querySelector(`[data-i="${st.ev.length-1}"]`);t&&t.focus()};
$('ex').onclick=()=>{if(confirm('Load the example? Your plot map will be replaced.')){st.ev=JSON.parse(JSON.stringify(EX));st.title='The Three Little Pigs';$('ti').value=st.title;save();draw()}};
$('clr').onclick=()=>{if(confirm('Start a new plot map?')){st.ev=[{t:'',v:10},{t:'',v:40},{t:'',v:80},{t:'',v:20}];st.title='';$('ti').value='';save();draw()}};
$('ti').value=st.title;$('ti').oninput=()=>{st.title=$('ti').value;save()};addEventListener('resize',graph);
draw();
</script>
</body></html>
