const S={"Living things": [["What do plants need to make their own food?", "Sunlight, water, and air", "Soil only", "Moonlight", "Sugar"], ["What part of a plant takes in water from the soil?", "Roots", "Leaves", "Flowers", "Seeds"], ["An animal that eats only plants is called a...", "Herbivore", "Carnivore", "Omnivore", "Predator"], ["An animal that eats both plants and meat is called a...", "Omnivore", "Herbivore", "Carnivore", "Producer"], ["A caterpillar turns into a...", "Butterfly", "Beetle", "Bee", "Spider"], ["Which animal is a mammal?", "Dolphin", "Shark", "Salmon", "Frog"], ["Frogs start life as...", "Tadpoles", "Chicks", "Pups", "Larvae"], ["What is it called when animals sleep through the winter?", "Hibernation", "Migration", "Camouflage", "Adaptation"], ["What do we call animals that travel to a new place when seasons change?", "Migration", "Hibernation", "Pollination", "Evaporation"], ["Which is a producer in a food chain?", "Grass", "Rabbit", "Hawk", "Fox"], ["Bees help flowers by spreading...", "Pollen", "Water", "Seeds", "Leaves"], ["How many legs does an insect have?", "6", "8", "4", "10"], ["How many legs does a spider have?", "8", "6", "10", "4"], ["What helps a polar bear stay warm?", "Thick fur and fat", "Scales", "Feathers", "Long tail"]], "Earth and space": [["What is the closest star to Earth?", "The sun", "The moon", "Polaris", "Mars"], ["Which planet is known as the red planet?", "Mars", "Venus", "Jupiter", "Saturn"], ["What is the largest planet?", "Jupiter", "Saturn", "Earth", "Neptune"], ["How long does it take Earth to go around the sun?", "1 year", "1 day", "1 month", "1 week"], ["What causes day and night?", "Earth spinning", "The moon moving", "Clouds", "The sun turning off"], ["Which planet has the most famous rings?", "Saturn", "Mars", "Mercury", "Earth"], ["What is water falling from clouds called?", "Precipitation", "Evaporation", "Condensation", "Erosion"], ["When water turns into a gas, it is called...", "Evaporation", "Condensation", "Freezing", "Melting"], ["Which tool measures temperature?", "Thermometer", "Ruler", "Scale", "Compass"], ["What is the hot, melted rock inside a volcano called?", "Magma", "Ice", "Sand", "Fossil"], ["What do we call the remains of a plant or animal from long ago preserved in rock?", "Fossil", "Mineral", "Crystal", "Magma"], ["Wearing away of rock and soil by wind or water is called...", "Erosion", "Evaporation", "Pollution", "Photosynthesis"], ["Which planet is closest to the sun?", "Mercury", "Venus", "Earth", "Mars"], ["What does the moon reflect?", "Sunlight", "Starlight", "Earth's heat", "Nothing"]], "Matter and energy": [["What are the three common states of matter?", "Solid, liquid, gas", "Hot, warm, cold", "Rock, water, air", "Big, medium, small"], ["Ice is water in which state?", "Solid", "Liquid", "Gas", "Plasma"], ["What is it called when a liquid becomes a solid?", "Freezing", "Melting", "Boiling", "Evaporating"], ["Which is a good conductor of electricity?", "Copper", "Rubber", "Wood", "Plastic"], ["A magnet will pick up a...", "Paper clip", "Penny", "Plastic spoon", "Crayon"], ["What force pulls things down toward Earth?", "Gravity", "Magnetism", "Friction", "Wind"], ["What force slows down a rolling ball?", "Friction", "Gravity", "Magnetism", "Electricity"], ["Sound is made when things...", "Vibrate", "Freeze", "Melt", "Shine"], ["What kind of energy does the sun give us?", "Light and heat", "Sound", "Wind only", "Electricity only"], ["A push or a pull is called a...", "Force", "Mass", "Volume", "Liquid"], ["What does a simple machine help us do?", "Make work easier", "Make noise", "Make light", "Make water"], ["Which is an example of a lever?", "Seesaw", "Ball", "Book", "Pillow"]], "Human body": [["What organ pumps blood through your body?", "Heart", "Lungs", "Brain", "Stomach"], ["What organ helps you breathe?", "Lungs", "Heart", "Liver", "Kidneys"], ["What organ controls your whole body?", "Brain", "Heart", "Stomach", "Skin"], ["How many bones does an adult have?", "206", "100", "52", "365"], ["What is the largest organ of the body?", "Skin", "Heart", "Brain", "Liver"], ["Which sense uses your nose?", "Smell", "Taste", "Touch", "Hearing"], ["What connects your muscles to your bones?", "Tendons", "Veins", "Nerves", "Hair"], ["What protects your brain?", "Skull", "Ribs", "Spine", "Kneecap"], ["Which food group helps build strong bones?", "Dairy", "Candy", "Soda", "Chips"], ["What do your teeth start to do to food?", "Break it down", "Store it", "Clean it", "Cool it"], ["What protects your heart and lungs?", "Rib cage", "Skull", "Backbone", "Hips"], ["Why should you wash your hands?", "To remove germs", "To make them bigger", "To warm them up", "To grow nails"]]};const K=Object.keys(S);
Quiz.init({levels:['Mix of everything',...K],levelLabel:'Topic',makeQ(lv){const [q,a,...w]=Kit.pick(lv?S[K[lv-1]]:Object.values(S).flat());return{q,answer:a,options:[a,...w]}}});
</script>
