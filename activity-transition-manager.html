<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Activity Transition Manager</title>
<style>
main{max-width:1400px}
.at-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.at-pick button{font:inherit;border:5px solid var(--ink);border-radius:20px;background:#fff;padding:12px;cursor:pointer;box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:1.1rem;color:var(--ink);text-align:left}
.at-pick button small{display:block;font-weight:600;color:#6B7695}
.at-pick button.on{background:var(--sun)}
.at-run{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:860px){.at-run{grid-template-columns:1fr}}
.at-card{background:var(--cc);border:7px solid var(--ink);border-radius:30px;box-shadow:9px 9px 0 var(--ink);padding:clamp(18px,3vw,34px);color:#fff;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:8px;text-shadow:3px 3px 0 rgba(0,0,0,.25)}
.at-card .e{font-size:clamp(4rem,11vw,7rem);line-height:1}
.at-card .t{font-size:clamp(2rem,5.6vw,3.8rem);font-weight:800;line-height:1.05}
.at-card .s{font-size:clamp(3rem,8vw,5rem);font-weight:800;font-variant-numeric:tabular-nums}
.at-card.in{animation:atin .5s cubic-bezier(.3,1.4,.5,1)}@keyframes atin{from{transform:translateX(30px);opacity:0}}
.at-steps{display:grid;gap:8px}
.at-st{display:flex;gap:10px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:700}
.at-st .e{font-size:1.6rem}.at-st small{margin-left:auto;color:#6B7695}
.at-st.done{opacity:.5;text-decoration:line-through}.at-st.now{background:#FFF6C9;outline:4px solid var(--sun)}
.at-res{text-align:center;font-weight:800;font-size:1.4rem;color:#fff;text-shadow:2px 2px 0 var(--ink);min-height:1.4em;margin-top:10px}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🔄", "Activity Transition Manager");
const $=id=>document.getElementById(id);const CC=['#FF6B5B','#22C3E6','#5DC66E','#9B6BF2','#FF9F43','#FF8FC7'];
const DEF=`# Math ➜ Reading
📕 Close your math book and put it away | 20
✏️ Pencils in the cup | 10
📚 Get your reading book and log | 30
🪑 Sit down and start reading | 15
# Recess ➜ Class
🧥 Hang up jackets | 30
💧 Get a drink | 30
🪑 Sit down quietly | 15
👀 Eyes on the teacher | 10
# Get ready for lunch
🧹 Clean up your space | 30
🧼 Wash your hands | 60
🍱 Grab your lunch | 20
🚶 Line up quietly | 20
# Carpet time
🪑 Push in your chair | 10
🧘 Walk to your carpet spot | 20
🙌 Criss-cross, hands in your lap | 10`;
const st=Kit.get('at-state',{text:DEF,cur:0,best:{}});
document.querySelector('main').innerHTML=`<div class="at-pick" id="pick"></div><div class="at-run"><div class="at-card" id="card"></div><div><div class="at-steps" id="steps"></div>
<div class="row" style="margin-top:12px"><button class="btn big green" id="go">▶ Start</button><button class="btn white" id="nx">⏭ Next step</button><button class="btn" id="rd">🙌 We're ready!</button><button class="btn white small" id="ed">✏️</button></div></div></div><div class="at-res" id="res"></div>
<div class="card stack" id="edc" hidden style="margin-top:14px"><b>✏️ Transitions</b><span class="muted">Start each one with # name. Then one step per line: emoji what to do | seconds.</span><textarea id="ta" style="min-height:260px"></textarea><button class="btn green" id="sv">✓ Save</button></div>`;
const T=()=>{const out=[];let c=null;Kit.lines(st.text).forEach(l=>{if(l.startsWith('#')){c={n:l.slice(1).trim(),steps:[]};out.push(c)}else if(c){const p=l.split('|');const m=p[0].trim().match(/^(\p{Extended_Pictographic}[\u{FE0F}\u{200D}\p{Extended_Pictographic}]*)\s*(.*)$/u);c.steps.push({e:m?m[1]:'➡️',t:m?m[2]:p[0].trim(),s:Math.max(3,+p[1]||20)})}});return out.filter(x=>x.steps.length)};
let k=-1,left=0,tv=null,t0=0;
const fmt=s=>s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:`${s}s`;
function draw(){const L=T();st.cur=Math.min(st.cur,L.length-1);const tr=L[st.cur];$('pick').innerHTML=L.map((x,i)=>`<button data-i="${i}" class="${i===st.cur?'on':''}">${Kit.esc(x.n)}<small>${x.steps.length} steps · ${fmt(x.steps.reduce((a,b)=>a+b.s,0))}${st.best[x.n]?` · 🏆 ${fmt(st.best[x.n])}`:''}</small></button>`).join('');
 if(!tr)return;$('steps').innerHTML=tr.steps.map((s,i)=>`<div class="at-st ${i<k?'done':''} ${i===k?'now':''}"><span class="e">${s.e}</span>${Kit.esc(s.t)}<small>${fmt(s.s)}</small></div>`).join('');
 const s=tr.steps[k];$('card').style.setProperty('--cc',k<0?'#1D2B53':CC[k%6]);$('card').innerHTML=k<0?`<div class="e">🔄</div><div class="t">${Kit.esc(tr.n)}</div><div style="font-weight:700;font-size:1.3rem">Press Start when everyone is listening.</div>`:s?`<div class="e">${s.e}</div><div class="t">${Kit.esc(s.t)}</div><div class="s">${left}</div>`:`<div class="e">🎉</div><div class="t">Ready!</div>`;window.__t={k,left}}
function stepTo(i){const tr=T()[st.cur];k=i;if(k>=tr.steps.length){done();return}left=tr.steps[k].s;draw();$('card').classList.remove('in');void $('card').offsetWidth;$('card').classList.add('in');Kit.ding()}
function done(){clearInterval(tv);tv=null;const tr=T()[st.cur],secs=Math.round((Date.now()-t0)/1000),plan=tr.steps.reduce((a,b)=>a+b.s,0),b=st.best[tr.n];k=tr.steps.length;draw();
 const nb=!b||secs<b;if(nb){st.best[tr.n]=secs;Kit.set('at-state',st)}$('res').textContent=`⏱ Done in ${fmt(secs)}${secs<=plan?' — faster than planned! 🚀':''}${nb?' · 🏆 New class record!':` · Record: ${fmt(b)}`}`;Kit.tada();if(nb)Kit.confetti(120);$('go').textContent='▶ Start';draw()}
$('go').onclick=()=>{if(tv){clearInterval(tv);tv=null;$('go').textContent='▶ Keep going';return}if(k<0||k>=T()[st.cur].steps.length){t0=Date.now();$('res').textContent='';stepTo(0)}$('go').textContent='⏸ Pause';
 tv=setInterval(()=>{left--;if(left<=3&&left>0)Kit.tick();if(left<=0){stepTo(k+1);return}draw()},1000)};
$('nx').onclick=()=>{if(k<0){t0=Date.now();$('go').click();return}stepTo(k+1)};$('rd').onclick=()=>{if(k>=0&&tv)done()};
$('pick').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;clearInterval(tv);tv=null;k=-1;st.cur=+b.dataset.i;Kit.set('at-state',st);$('go').textContent='▶ Start';$('res').textContent='';draw()};
$('ed').onclick=()=>{$('edc').hidden=!$('edc').hidden;$('ta').value=st.text};$('sv').onclick=()=>{st.text=$('ta').value;Kit.set('at-state',st);$('edc').hidden=true;k=-1;draw()};
draw();
</script>
</body></html>
