<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Classroom Traffic Light</title>
<style>.tl-wrap{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap}
.housing{background:var(--ink);border-radius:60px;padding:24px;display:flex;flex-direction:column;gap:20px;box-shadow:8px 8px 0 rgba(29,43,83,.4)}
.lamp{width:min(150px,26vh);height:min(150px,26vh);border-radius:50%;border:6px solid #0f1a38;cursor:pointer;opacity:.25;transition:opacity .2s,box-shadow .2s,transform .2s}
.lamp.red{background:#FF4B3E}.lamp.yellow{background:#FFC93C}.lamp.green{background:#4CD964}
.lamp.on{opacity:1;transform:scale(1.04)}
.lamp.red.on{box-shadow:0 0 50px 10px #FF4B3E}.lamp.yellow.on{box-shadow:0 0 50px 10px #FFC93C}.lamp.green.on{box-shadow:0 0 50px 10px #4CD964}
.msgcard{max-width:460px;flex:1;min-width:260px;text-align:center}
.msg{font-size:clamp(2rem,5vw,3.2rem);font-weight:700;line-height:1.15;margin-bottom:14px}
summary{cursor:pointer;font-weight:600}</style></head>
<body>
<main>
<div class="tl-wrap">
 <div class="housing">
  <button class="lamp red" data-c="red" aria-label="Red light"></button>
  <button class="lamp yellow" data-c="yellow" aria-label="Yellow light"></button>
  <button class="lamp green" data-c="green" aria-label="Green light"></button>
 </div>
 <div class="card msgcard">
  <div id="msg" class="msg">Tap a light</div>
  <details class="setup"><summary>Change the messages</summary>
   <div class="stack" style="margin-top:10px">
    <label>Red <input type="text" id="t-red"></label>
    <label>Yellow <input type="text" id="t-yellow"></label>
    <label>Green <input type="text" id="t-green"></label>
   </div></details>
  <p class="muted">Keyboard: R, Y, G</p>
 </div>
</div></main>
<script src="kit.js"></script>
<script>
Kit.mount('🚦', 'Classroom Traffic Light');

const $=id=>document.getElementById(id);
const def={red:'Stop. Voices off.',yellow:'Whisper voices',green:'Talk and work together'};
const t=Object.assign({},def,Kit.get('tl-text',{}));
['red','yellow','green'].forEach(c=>{$('t-'+c).value=t[c];$('t-'+c).oninput=e=>{t[c]=e.target.value;Kit.set('tl-text',t);if(cur===c)$('msg').textContent=t[c]}});
let cur=null;
function setL(c){cur=c;document.querySelectorAll('.lamp').forEach(l=>l.classList.toggle('on',l.dataset.c===c));$('msg').textContent=t[c];
  $('msg').style.color={red:'#D93427',yellow:'#B8860B',green:'#2E9B44'}[c];Kit.tone({red:330,yellow:520,green:780}[c],.3,'sine',.25);Kit.set('tl-cur',c)}
document.querySelectorAll('.lamp').forEach(l=>l.onclick=()=>setL(l.dataset.c));
addEventListener('keydown',e=>{if(document.activeElement.tagName==='INPUT')return;const m={r:'red',y:'yellow',g:'green'}[e.key.toLowerCase()];if(m)setL(m)});
const s=Kit.get('tl-cur',null);if(s){cur=s;document.querySelectorAll('.lamp').forEach(l=>l.classList.toggle('on',l.dataset.c===s));$('msg').textContent=t[s];$('msg').style.color={red:'#D93427',yellow:'#B8860B',green:'#2E9B44'}[s]}

</script>
</body></html>
