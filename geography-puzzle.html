<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Geography Puzzle</title>
<style>
main{max-width:1600px}
.gp-top{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.gp-q{text-align:center;background:#fff;border:6px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:8px 16px;margin:0 auto 12px;max-width:820px}
.gp-q b{font-size:clamp(1.4rem,4vw,2.4rem)}
.gp-q img{height:1.4em;vertical-align:-.25em;border:3px solid var(--ink);border-radius:6px;margin-right:6px}
.gp-map{border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);overflow:hidden}
.gp-map svg{width:100%;aspect-ratio:2/1;display:block;cursor:pointer}
.gp-map .cty.home{fill:#9B6BF2}.gp-map .cty.yes{fill:#5DC66E}.gp-map .cty.no{fill:#FF9F8F}.gp-map .cty.miss{fill:#FFC93C}
.gp-found{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;min-height:2em}
.gp-found span{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:2px 10px;font-weight:800}
.gp-found span.m{background:#FFF1A8}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script><script src="geo.js"></script>
<script>
Kit.mount("🗺️", "Geography Puzzle");
const $=id=>document.getElementById(id);
// places without a country code (like Somaliland) are left out of the puzzles
GEO.W.forEach(c=>c.nb=(c.nb||[]).filter(id=>!id.startsWith('X')));
const OK=GEO.W.filter(GEO.OK),C=id=>GEO.W.find(c=>c.id===id);
// countries with 2 to 9 land neighbors make good puzzles
const POOL={easy:OK.filter(c=>c.nb&&c.nb.length>=2&&c.nb.length<=4),med:OK.filter(c=>c.nb&&c.nb.length>=3&&c.nb.length<=6),hard:OK.filter(c=>c.nb&&c.nb.length>=5)};
let lv='easy',cur,found=new Set(),wrong=0,score=0,round=0,done=false,bag=[];
document.querySelector('main').innerHTML=`<div class="gp-top"><select id="lv" style="width:auto"><option value="easy">🟢 2 to 4 neighbors</option><option value="med">🟡 3 to 6 neighbors</option><option value="hard">🔴 5 or more neighbors</option></select><span class="ln-pill">Puzzle <b id="rn">0</b></span><span class="ln-pill">⭐ <b id="sc">0</b></span><span class="ln-pill">❌ <b id="wr">0</b></span><button class="btn white small" id="gu">🏳️ Show me</button><button class="btn green small" id="nx">Next ➜</button></div>
<div class="gp-q" id="q"></div><div class="gp-map" id="mb"><svg id="sv"></svg></div><div class="gp-found" id="fd"></div>`;
const M=GEO.world($('sv'),{onTap:tap});GEO.zoomButtons($('mb'),M);
function next(){if(!bag.length)bag=Kit.shuffle(POOL[lv]);cur=bag.pop();found=new Set();wrong=0;done=false;round++;$('rn').textContent=round;$('wr').textContent=0;M.draw();M.el(cur.id).classList.add('home');M.zoomTo(cur.id,3.2);ui();window.__t={home:cur.id,nb:[...cur.nb],found:[]}}
function ui(){const n=cur.nb.length;$('q').innerHTML=`<img src="img/flags/${cur.id.toLowerCase()}.svg" alt="">Tap every country that touches <b>${cur.n}</b>! <span class="ln-pill">${found.size} of ${n}</span>`;
 $('fd').innerHTML=[...found].map(id=>`<span>${C(id).n}</span>`).join('')+(done?cur.nb.filter(id=>!found.has(id)).map(id=>`<span class="m">${C(id)?C(id).n:id}</span>`).join(''):'')}
function tap(c){if(!c||done||c.id.startsWith('X'))return;if(c.id===cur.id){Kit.tick();return}
 if(cur.nb.includes(c.id)){if(found.has(c.id))return;found.add(c.id);M.el(c.id).classList.add('yes');Kit.ding();if(found.size===cur.nb.length){done=true;const pts=Math.max(1,cur.nb.length*2-wrong);score+=pts;$('sc').textContent=score;Kit.tada();Kit.confetti(50)}}
 else{wrong++;$('wr').textContent=wrong;const el=M.el(c.id);el.classList.add('no');setTimeout(()=>el.classList.remove('no'),700);Kit.tone(200,.2,'triangle',.15)}
 ui();window.__t={...window.__t,found:[...found],done}}
$('gu').onclick=()=>{done=true;cur.nb.forEach(id=>{if(!found.has(id)&&M.el(id))M.el(id).classList.add('miss')});ui()};
$('nx').onclick=next;$('lv').onchange=()=>{lv=$('lv').value;bag=[];next()};
window.__g={tap:id=>tap(C(id))};
next();
</script>
</body></html>
