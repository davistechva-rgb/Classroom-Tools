<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Debugging Challenge</title>
<style>
main{max-width:1400px}
.db-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
.db{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.db{grid-template-columns:1fr}}
.db-goal{background:#FFF6C9;border:5px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;font-size:1.1rem;margin-bottom:10px}
.db-code{background:#1D2B53;border:6px solid var(--ink);border-radius:20px;box-shadow:7px 7px 0 var(--ink);padding:10px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(.95rem,2vw,1.25rem);overflow-x:auto}
.db-ln{display:flex;cursor:pointer;padding:3px 0;white-space:pre;color:#E8F0FF;border-left:6px solid transparent}
.db-ln:hover{background:#2B3A67}
.db-ln .n{width:2.6em;text-align:right;padding-right:14px;color:#7F8FB8;user-select:none;flex:none}
.db-ln.no{background:#5A2B3A;animation:shake .3s}.db-ln.bug{background:#6B5A1D;border-left-color:#FFD84D}.db-ln.fixed{background:#1F5A3A;border-left-color:#5DC66E}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.db-ln .kw{color:#FF9FCB}.db-ln .st{color:#B8F0A0}.db-ln .nm{color:#FFD27F}.db-ln .fn{color:#7FD8FF}
.db-p{display:grid;gap:10px}
.db-out{background:#fff;border:5px solid var(--ink);border-radius:18px;padding:10px}
.db-out pre{margin:6px 0 0;font-family:ui-monospace,Menlo,monospace;background:#F4F6FB;border-radius:10px;padding:8px;font-size:1.05rem;min-height:2.5em;white-space:pre-wrap}
.db-out.bad pre{background:#FFE7E3}.db-out.good pre{background:#E3F8E6}
.db-fix{display:grid;gap:6px}
.db-fix button{font:600 1rem ui-monospace,Menlo,monospace;white-space:pre;text-align:left;border:4px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;cursor:pointer;color:var(--ink);overflow-x:auto}
.db-fix button.yes{background:#8BE09A}.db-fix button.no{background:#FFB3AA}
.db-msg{font-weight:800;font-size:1.1rem;min-height:1.4em;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.db-tip{background:#fff;border:4px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:700}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🐛", "Debugging Challenge");
const $=id=>document.getElementById(id);
// [title, what it should do, code lines, buggy line, [right fix, wrong, wrong], should print, buggy output, lesson]
const B0=[['Count to 5','Print the numbers 1 to 5.',['for n in range(1, 5):','    print(n)'],0,['for n in range(1, 6):','for n in range(0, 5):','for n in range(1, 4):'],'1\n2\n3\n4\n5','1\n2\n3\n4','range(1, 5) stops BEFORE 5. To include 5, the end number has to be 6.'],
 ['Candy counter','Add up the candy in every bag.',['total = 0','for bag in [3, 5, 2]:','    total = bag','print(total)'],2,['    total = total + bag','    total = bag + 1','    bag = total + bag'],'10','2','"total = bag" throws away the old total. We need to ADD to it.'],
 ['Say hello','Greet Sam by name.',['name = "Sam"','print("Hello, " + "name")'],1,['print("Hello, " + name)','print("Hello, " + "Sam name")','print(Hello, + name)'],'Hello, Sam','Hello, name','Quotes mean "this exact text". Without quotes, name means the variable.'],
 ['Odd or even','7 is odd, so it should print "odd".',['number = 7','if number % 2 == 1:','    print("even")','else:','    print("odd")'],1,['if number % 2 == 0:','if number % 3 == 1:','if number > 2:'],'odd','even','% gives the remainder. Even numbers have a remainder of 0 when divided by 2.'],
 ['Countdown','Count down 3, 2, 1, then blast off.',['count = 3','while count > 0:','    print(count)','    count = count + 1','print("Blast off!")'],3,['    count = count - 1','    count = count + 2','    count = 0 + 1'],'3\n2\n1\nBlast off!','3\n4\n5\n6\n7\n... (it never stops!)','If count keeps going up, "count > 0" is always true. That\'s an infinite loop!'],
 ['High score','Find the biggest score.',['scores = [4, 9, 2]','best = 0','for s in scores:','    if s < best:','        best = s','print(best)'],3,['    if s > best:','    if s == best:','    if best < 0:'],'9','0','We want to keep a score when it is BIGGER than the best so far.'],
 ['Rectangle area','A 4 by 3 rectangle has an area of 12.',['width = 4','height = 3','area = width + height','print(area)'],2,['area = width * height','area = width - height','area = width + height + 5'],'12','7','Area means width TIMES height, not plus.'],
 ['Last pet','Print the last pet in the list.',['pets = ["cat", "dog", "fish"]','print(pets[3])'],1,['print(pets[2])','print(pets[1])','print(pets(3))'],'fish','Error: list index out of range','Lists start counting at 0, so 3 items are numbered 0, 1 and 2.'],
 ['Secret password','Let the right guess in.',['password = "tiger"','guess = "tiger"','if guess = password:','    print("Welcome!")'],2,['if guess == password:','if guess := password:','if "guess" == "password":'],'Welcome!','SyntaxError: invalid syntax','One = puts a value in a variable. Two == checks if things are equal.'],
 ['Three times table','Print 3, 6, 9.',['for n in range(1, 4):','    print(n * 2)'],1,['    print(n * 3)','    print(n + 3)','    print(n * 2 + 1)'],'3\n6\n9','2\n4\n6','The loop is fine. The math inside it multiplies by the wrong number.'],
 ['Shopping total','Print the total only once, at the end.',['cost = 0','for price in [2, 3]:','    cost = cost + price','    print("Total:", cost)'],3,['print("Total:", cost)','    print("Total:", price)','        print("Total:", cost)'],'Total: 5','Total: 2\nTotal: 5','Spaces at the start of a line matter! Indented lines run every time the loop repeats.'],
 ['Hungry robot','Eat 3 snacks, then say "Full!"',['snacks = 0','while snacks < 3:','    snacks = snacks + 1','    print("Yum")','    print("Full!")'],4,['print("Full!")','    print("Yum!")','        print("Full!")'],'Yum\nYum\nYum\nFull!','Yum\nFull!\nYum\nFull!\nYum\nFull!','"Full!" was inside the loop, so it ran 3 times. Move it out by removing the spaces.']];
let BUGS=[],cur,stage,tries,score=0,round=0,R=6,bag=[],teams=null;
const KW=/\b(for|in|range|if|else|while|print|and|or|not)\b/g;
function color(c){return Kit.esc(c).replace(/(&quot;.*?&quot;)/g,'\u0001$1\u0002').replace(/\b(\d+)\b/g,'<span class="nm">$1</span>').replace(KW,m=>m==='print'||m==='range'?`<span class="fn">${m}</span>`:`<span class="kw">${m}</span>`).replace(/\u0001(.*?)\u0002/g,(m,s)=>`<span class="st">${s.replace(/<[^>]+>/g,'')}</span>`)}
document.querySelector('main').innerHTML=`<div class="db-top"><span class="ln-pill">🐛 Bug <b id="rn">0</b>/${R}</span><span class="ln-pill">⭐ <b id="sc">0</b></span>${Learn.teamPicker('tp',0)}<button class="btn white small" id="ng">🔄 New game</button></div><div id="tm"></div>
<div class="db"><div><div class="db-goal" id="gl"></div><div class="db-code" id="cd"></div><div class="db-msg" id="msg" style="margin-top:10px"></div></div>
<div class="db-p"><div class="db-out" id="o1"><b>✅ It should print:</b><pre id="ex"></pre></div><div class="db-out bad" id="o2"><b>🐛 It actually prints:</b><pre id="ac"></pre></div><div class="db-fix" id="fx"></div><div class="db-tip" id="tip" hidden></div><button class="btn green big" id="nx" hidden>Next bug ➜</button></div></div>`;
function next(){if(round>=R)return Learn.finish('🐛',teams?teams.winner():`${score} points!`,'You squashed every bug. Real programmers debug like this every day!',start);if(!bag.length)bag=Kit.shuffle(BUGS);cur=bag.pop();round++;stage='find';tries=0;
 $('rn').textContent=round;$('gl').innerHTML=`🎯 <b>${Kit.esc(cur[0])}:</b> ${Kit.esc(cur[1])}`;$('ex').textContent=cur[5];$('ac').textContent=cur[6];$('o2').className='db-out bad';$('o2').querySelector('b').textContent='🐛 It actually prints:';
 drawCode();$('fx').innerHTML='';$('tip').hidden=true;$('nx').hidden=true;$('msg').textContent='👆 Tap the line with the bug.';window.__t={bug:cur[3],fix:cur[4][0],score,round,stage}}
function drawCode(cls={}){const lines=[...cur[2]];if(stage==='done')lines[cur[3]]=cur[4][0];$('cd').innerHTML=lines.map((l,i)=>`<div class="db-ln ${cls[i]||''}" data-i="${i}"><span class="n">${i+1}</span><span>${color(l)}</span></div>`).join('')}
$('cd').onclick=e=>{const d=e.target.closest('[data-i]');if(!d||stage!=='find')return;const i=+d.dataset.i;
 if(i===cur[3]){stage='fix';Kit.ding();drawCode({[i]:'bug'});$('msg').textContent=`🔍 Found it! Line ${i+1} has the bug. How should it be fixed?`;$('fx').innerHTML=Kit.shuffle(cur[4]).map(f=>`<button data-f="${Kit.esc(f)}">${Kit.esc(f)}</button>`).join('');window.__t.stage='fix'}
 else{tries++;Kit.tone(200,.2,'triangle',.15);drawCode({[i]:'no'});$('msg').textContent=`Line ${i+1} looks OK. Compare what it should print with what it actually prints.`}};
$('fx').onclick=e=>{const b=e.target.closest('[data-f]');if(!b||stage!=='fix'||b.classList.contains('no'))return;
 if(b.dataset.f===cur[4][0]){stage='done';b.classList.add('yes');const p=Math.max(1,3-tries);score+=p;$('sc').textContent=score;if(teams){teams.add(p);teams.next()}Kit.tada();drawCode({[cur[3]]:'fixed'});
  $('o2').className='db-out good';$('o2').querySelector('b').textContent='🎉 Now it prints:';$('ac').textContent=cur[5];$('msg').textContent=`✅ Bug squashed! +${p}`;$('tip').hidden=false;$('tip').innerHTML=`💡 ${Kit.esc(cur[7])}`;$('nx').hidden=false;window.__t={...window.__t,stage:'done',score}}
 else{tries++;b.classList.add('no');Kit.tone(200,.2,'triangle',.15);$('msg').textContent='That change would still be wrong. Try another fix!'}};
$('nx').onclick=next;$('ng').onclick=start;
function start(){round=0;score=0;bag=[];$('sc').textContent=0;const n=+$('tp').value;teams=n?Learn.teams($('tm'),n,{turns:true}):($('tm').innerHTML='',null);next()}
$('tp').onchange=start;
BUGS=B0;start();
</script>
</body></html>
