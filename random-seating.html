<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Random Seating Chart</title>
<style>.grid2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.room{background:#F4FAFF;border:4px solid var(--ink);border-radius:20px;padding:16px;overflow:auto}
.front{text-align:center;font-weight:700;background:var(--ink);color:#fff;border-radius:12px;padding:6px;margin:0 auto 16px;max-width:320px}
.desks{display:grid;gap:12px}.desk{min-height:64px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-weight:700;text-align:center;padding:6px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);word-break:break-word;font-size:1.05rem}
.desk.empty{background:#fff;color:#99a;font-weight:500;box-shadow:none;border-style:dashed}.desk.sel{outline:5px solid var(--grape);outline-offset:2px}.desk.off{visibility:hidden}
@media print{.room{border:0}.desk{box-shadow:none}}.stack>label{display:block}</style></head>
<body>
<main>
<div class="grid2">
 <div class="card stack noprint">
  <label for="names">Class list (one name per line)</label><textarea id="names"></textarea>
  <div class="row"><label>Rows <input type="number" id="rows" value="4" min="1" max="12"></label><label>Columns <input type="number" id="cols" value="6" min="1" max="12"></label></div>
  <label>Seat in the front two rows (one name per line)<textarea id="front" style="min-height:70px"></textarea></label>
  <label>Keep apart (one pair per line, like Ben, Carlos)<textarea id="apart" style="min-height:70px"></textarea></label>
  <div class="row"><button class="btn green" id="go">Make seating chart</button><button class="btn white" id="print">Print</button></div>
  <p id="note" class="muted"></p>
 </div>
 <div class="card"><h2 class="center" style="margin:0 0 12px">Seating Chart</h2><div class="room"><div class="front">Front of the room</div><div id="desks" class="desks"></div></div></div>
</div></main>
<script src="kit.js"></script>
<script>
Kit.mount('🪑', 'Random Seating Chart');
const BG=['#FFF4CC','#FFE0DC','#E3F7E6','#EFE6FF','#FFE3F2','#DDF6FC'];
const $=id=>document.getElementById(id);
$('names').value=Kit.get('names','');['front','apart'].forEach(k=>{$(k).value=Kit.get('rs-'+k,'');$(k).oninput=()=>Kit.set('rs-'+k,$(k).value)});$('names').oninput=()=>Kit.set('names',$('names').value);
let last=Kit.get('rs-last',null);
function draw(g,R,C){$('desks').style.gridTemplateColumns=`repeat(${C},minmax(64px,1fr))`;
 $('desks').innerHTML=g.map((n,i)=>`<div class="desk ${n?'':'empty'}" style="${n?'background:'+BG[(Math.floor(i/C)+i%C)%6]+';animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:'+(i*.02)+'s':''}">${n?Kit.esc(n):'empty'}</div>`).join('')}
$('go').onclick=()=>{const N=Kit.lines($('names').value),R=+$('rows').value||1,C=+$('cols').value||1,T=R*C;
 if(!N.length){$('note').textContent='Add your class list first.';return}if(N.length>T){$('note').textContent=`You have ${N.length} students but only ${T} desks. Add rows or columns.`;return}
 const front=Kit.lines($('front').value).map(s=>s.toLowerCase()),pairs=Kit.lines($('apart').value).map(l=>l.split(',').map(s=>s.trim().toLowerCase())).filter(p=>p.length>1);
 const near=(a,b)=>Math.abs(Math.floor(a/C)-Math.floor(b/C))<=1&&Math.abs(a%C-b%C)<=1;let best,bb=1e9;
 for(let t=0;t<1500&&bb>0;t++){const fr=Kit.shuffle(N.filter(n=>front.includes(n.toLowerCase()))),rest=Kit.shuffle(N.filter(n=>!front.includes(n.toLowerCase())));
  const seats=Kit.shuffle([...Array(T).keys()]);const frontSeats=seats.filter(s=>s<2*C),other=seats.filter(s=>s>=2*C);const order=[...frontSeats,...other];
  const g=Array(T).fill('');let k=0;fr.forEach(n=>g[order[k++]]=n);const remaining=Kit.shuffle(order.slice(k)).sort((a,b)=>a-b);Kit.shuffle(remaining.slice(0,rest.length)).forEach((s,i)=>g[s]=rest[i]);
  const pos={};g.forEach((n,i)=>{if(n)pos[n.toLowerCase()]=i});let bad=pairs.filter(([a,b])=>pos[a]!=null&&pos[b]!=null&&near(pos[a],pos[b])).length;
  bad+=front.filter(f=>pos[f]!=null&&pos[f]>=2*C).length;if(bad<bb){bb=bad;best=g}}
 $('note').textContent=bb?'Some requests could not all be met. Try more desks.':'';last={g:best,R,C};Kit.set('rs-last',last);Kit.set('rs-rows',R);Kit.set('rs-cols',C);draw(best,R,C);Kit.tada()};
$('rows').value=Kit.get('rs-rows',4);$('cols').value=Kit.get('rs-cols',6);if(last)draw(last.g,last.R,last.C);
$('print').onclick=()=>print();

</script>
</body></html>
