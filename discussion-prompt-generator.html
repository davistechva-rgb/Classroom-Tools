<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Discussion Prompt Generator</title>
<style>
main{max-width:1300px}
.dp-cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.dp-cats button{font:inherit;font-weight:800;border:4px solid var(--ink);border-radius:99px;padding:5px 14px;cursor:pointer;background:#fff;color:var(--ink)}
.dp-cats button.on{background:var(--cc);color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.dp-deck{position:relative;max-width:1000px;margin:0 auto;perspective:1400px}
.dp-card{background:#fff;border:7px solid var(--ink);border-radius:30px;box-shadow:9px 9px 0 var(--ink);padding:clamp(18px,3.4vw,40px);min-height:44vh;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;overflow:hidden}
.dp-card::before{content:"";position:absolute;inset:0 0 auto;height:14px;background:var(--cc)}
.dp-card.flip{animation:dpflip .6s}@keyframes dpflip{0%{transform:rotateY(80deg);opacity:.2}}
.dp-tag{font-weight:800;letter-spacing:.12em;color:var(--cc);font-size:1rem}
.dp-q{font-size:clamp(1.8rem,4.8vw,3.4rem);font-weight:800;line-height:1.15}
.dp-frame{display:flex;flex-wrap:wrap;gap:8px}
.dp-frame span{background:#F4FAFF;border:3px solid var(--ink);border-radius:12px;padding:4px 12px;font-weight:700;font-size:1.05rem}
.dp-lv{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.dp-tt{font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("💬", "Discussion Prompt Generator");
const $=id=>document.getElementById(id);
const C={life:['🌱 Me & my life','#5DC66E'],world:['🌍 Our world','#22C3E6'],school:['🏫 School','#FF9F43'],ethics:['⚖️ What\'s fair?','#9B6BF2'],imagine:['🚀 Imagine','#FF8FC7'],books:['📚 Stories & books','#FF6B5B']};
const Q={life:[['What is something you are proud of, and why?',1],['Who is someone you look up to? What makes them special?',1],['What is a skill you want to learn this year?',1],['Describe a time you changed your mind about something.',2],['What does it mean to be a good friend?',2],['What is the hardest part about growing up?',3],['How do you know when you have done your best?',3]],
 world:[['What is one thing you would change about your town?',1],['Should every kid have to learn to swim? Why?',2],['Is it more important to protect animals or build new houses?',3],['What invention changed the world the most?',2],['How can kids help the planet?',1],['Should there be more parks or more stores?',2],['What makes a community strong?',3]],
 school:[['What is the best way to learn something new?',1],['Should students get homework? Why or why not?',2],['If you could add one subject to school, what would it be?',1],['Should kids help choose the school rules?',2],['What makes a classroom feel safe?',3],['Is it better to work alone or in a group?',2],['Should recess be longer? What would we give up?',3]],
 ethics:[['Is it ever okay to break a rule?',3],['If you find money on the ground, what should you do?',2],['Is it fair to give everyone the same, or what each person needs?',3],['Should you tell a friend the truth if it might hurt their feelings?',3],['What does it mean to be brave?',2],['Is it okay to keep a secret from a grown-up?',2],['Should everyone get a trophy?',2]],
 imagine:[['If animals could talk, which one would be the funniest?',1],['If you could live in any book, which one would you pick?',1],['What would school be like in 100 years?',2],['If you were in charge of the world for a day, what would you do first?',2],['Would you rather visit the past or the future? Why?',2],['What would happen if there was no electricity for a week?',3],['If you could invent a holiday, what would it celebrate?',1]],
 books:[['Which character would you want as a friend? Why?',1],['Did the main character make good choices?',2],['How would the story change if it was told by another character?',3],['What do you think the author wants us to learn?',3],['What would you change about the ending?',2],['Which part of the story surprised you most?',1],['Is the main character the same at the end as at the start?',3]]};
const FR=['I think… because…','I agree with ___ because…','I see it differently because…','Can you say more about…','Another idea is…','An example is…'];
const st=Kit.get('dp-set',{cats:Object.keys(C),lv:0,think:30,mine:''});
document.querySelector('main').innerHTML=`<div class="dp-cats" id="cats"></div><div class="dp-lv"><label class="ln-pill">Level <select id="lv" style="width:auto;border-width:2px;padding:2px 8px"><option value="0">All</option><option value="1">⭐ Warm-up</option><option value="2">⭐⭐ Think</option><option value="3">⭐⭐⭐ Deep</option></select></label><label class="ln-pill">Think time <select id="tt" style="width:auto;border-width:2px;padding:2px 8px"><option value="0">Off</option><option value="15">15 s</option><option value="30">30 s</option><option value="60">1 min</option></select></label></div>
<div class="dp-deck"><div class="dp-card" id="cd"></div></div><div class="row" style="justify-content:center;margin-top:16px"><button class="btn white" id="bk">◀ Back</button><button class="btn big green" id="nx">🎲 New prompt</button><span class="dp-tt" id="tm"></span><button class="btn white small" id="ed">✏️ My own</button></div>
<div class="card stack" id="edc" hidden style="margin-top:14px"><b>✏️ My own prompts</b><span class="muted">One per line. They show up as "My prompts."</span><textarea id="ta" style="min-height:140px"></textarea><button class="btn green" id="sv">✓ Save</button></div>`;
const save=()=>Kit.set('dp-set',st);let hist=[],hi=-1,tv=null,bag=[];
function pool(){let p=[];Object.keys(Q).forEach(k=>{if(st.cats.includes(k))Q[k].forEach(([q,l])=>{if(!st.lv||l===st.lv)p.push({q,l,c:k})})});if(st.cats.includes('mine'))Kit.lines(st.mine).forEach(q=>p.push({q,l:0,c:'mine'}));return p}
function cats(){const all={...C,...(Kit.lines(st.mine).length?{mine:['✏️ My prompts','#1D2B53']}:{})};$('cats').innerHTML=Object.entries(all).map(([k,v])=>`<button data-c="${k}" class="${st.cats.includes(k)?'on':''}" style="--cc:${v[1]}">${v[0]}</button>`).join('')}
function show(p){const meta=C[p.c]||['✏️ My prompts','#1D2B53'];const c=$('cd');c.style.setProperty('--cc',meta[1]);c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip');
 c.innerHTML=`<div class="dp-tag">${meta[0].toUpperCase()} ${p.l?'· '+'⭐'.repeat(p.l):''}</div><div class="dp-q">${Kit.esc(p.q)}</div><div><b>🗣️ Try starting with:</b><div class="dp-frame" style="margin-top:6px">${Kit.shuffle(FR).slice(0,3).map(f=>`<span>${f}</span>`).join('')}</div></div>`;window.__t={q:p.q}
 clearInterval(tv);let s=st.think;if(s){const d=()=>$('tm').textContent=s>0?`🤔 ${s}s`:'🗣️ Share!';d();tv=setInterval(()=>{s--;d();if(s<=0){clearInterval(tv);Kit.ding()}},1000)}else $('tm').textContent=''}
$('nx').onclick=()=>{if(!bag.length)bag=Kit.shuffle(pool());const p=bag.pop();if(!p){$('cd').innerHTML='<div class="dp-q">Pick at least one category.</div>';return}hist=hist.slice(0,hi+1);hist.push(p);hi=hist.length-1;show(p);Kit.tone(600,.1,'triangle',.2)};
$('bk').onclick=()=>{if(hi>0){hi--;show(hist[hi])}};
$('cats').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;st.cats=st.cats.includes(c)?st.cats.filter(x=>x!==c):[...st.cats,c];save();bag=[];cats()};
$('lv').value=st.lv;$('tt').value=st.think;$('lv').onchange=()=>{st.lv=+$('lv').value;save();bag=[]};$('tt').onchange=()=>{st.think=+$('tt').value;save()};
$('ed').onclick=()=>{$('edc').hidden=!$('edc').hidden;$('ta').value=st.mine};$('sv').onclick=()=>{st.mine=$('ta').value;if(!st.cats.includes('mine'))st.cats.push('mine');save();bag=[];cats();$('edc').hidden=true};
addEventListener('keydown',e=>{if(e.target.closest('textarea'))return;if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();$('nx').click()}if(e.key==='ArrowLeft')$('bk').click()});
cats();$('nx').click();
</script>
</body></html>
