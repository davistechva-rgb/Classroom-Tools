<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Opinion Poll</title>
<style>
main{max-width:1200px}
.op-card{background:#fff;border:7px solid var(--ink);border-radius:30px;box-shadow:9px 9px 0 var(--ink);padding:clamp(18px,3vw,34px);text-align:center}
.op-q{font-size:clamp(1.8rem,4.6vw,3rem);font-weight:800;line-height:1.15;margin-bottom:18px}
.op-ch{display:grid;gap:12px}
.op-c{font:inherit;font-weight:800;font-size:clamp(1.2rem,3vw,2rem);border:5px solid var(--ink);border-radius:20px;padding:14px;cursor:pointer;background:var(--cc);color:#fff;box-shadow:0 6px 0 var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.op-c:active{transform:translateY(6px);box-shadow:none}
.op-thx{font-size:clamp(2rem,5vw,3.4rem);font-weight:800}
.op-bars{display:grid;gap:12px;text-align:left}
.op-bar{display:grid;grid-template-columns:minmax(120px,28%) 1fr auto;gap:10px;align-items:center;font-weight:800;font-size:1.2rem}
.op-bar .tr{height:44px;border:4px solid var(--ink);border-radius:14px;background:#F4FAFF;overflow:hidden}
.op-bar .tr b{display:block;height:100%;background:var(--cc);width:0;transition:width 1.2s cubic-bezier(.3,1.2,.5,1)}
.op-bar.win .tr{box-shadow:0 0 0 5px var(--sun)}
.op-cnt{font-weight:800;color:#6B7695;margin-top:10px}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("💭", "Opinion Poll");
const $=id=>document.getElementById(id);const CC=['#FF6B5B','#22C3E6','#5DC66E','#9B6BF2','#FF9F43','#FF8FC7'];
const st=Kit.get('op-state',{q:'What should our class reward be?',choices:'🍿 Movie and popcorn\n🎨 Art party\n⚽ Extra recess\n👕 Pajama day',votes:[],hide:true});
const save=()=>Kit.set('op-state',st);let mode='vote';
document.querySelector('main').innerHTML=`<div class="op-card" id="cd"></div><div class="row" style="justify-content:center;margin-top:16px"><button class="btn green" id="res">📊 Show results</button><button class="btn white" id="vt">🗳️ Back to voting</button><button class="btn white" id="clr">🧽 New poll</button><label class="ln-pill"><input type="checkbox" id="hd"> 🙈 Hide votes until the end</label></div>
<div class="card stack" id="edc" hidden style="margin-top:14px"><b>✏️ New poll</b><input type="text" id="tq" placeholder="Your question"><textarea id="tc" style="min-height:140px" placeholder="One choice per line"></textarea><button class="btn green" id="sv">✓ Start this poll</button></div>`;
const ch=()=>Kit.lines(st.choices);
function draw(){const C=ch(),V=C.map((_,i)=>st.votes.filter(v=>v===i).length),tot=st.votes.length;$('hd').checked=st.hide;
 if(mode==='vote')$('cd').innerHTML=`<div class="op-q">${Kit.esc(st.q)}</div><div class="op-ch">${C.map((c,i)=>`<button class="op-c" data-i="${i}" style="--cc:${CC[i%6]}">${Kit.esc(c)}</button>`).join('')}</div><div class="op-cnt">🗳️ ${tot} ${tot===1?'vote':'votes'} so far${st.hide?'':` · ${C.map((c,i)=>`${V[i]}`).join(' · ')}`}</div>`;
 else if(mode==='thanks')$('cd').innerHTML=`<div class="op-thx">✅ Thanks for voting!</div><p style="font-size:1.3rem;font-weight:700">Your vote is a secret. Pass to the next person.</p><button class="btn big green" id="nv">👉 Next voter</button>`;
 else{const mx=Math.max(...V);$('cd').innerHTML=`<div class="op-q">${Kit.esc(st.q)}</div><div class="op-bars">${C.map((c,i)=>`<div class="op-bar ${V[i]===mx&&mx>0?'win':''}" style="--cc:${CC[i%6]}"><span>${Kit.esc(c)}</span><div class="tr"><b data-w="${tot?V[i]/tot*100:0}"></b></div><span>${V[i]} · ${tot?Math.round(V[i]/tot*100):0}%</span></div>`).join('')}</div><div class="op-cnt">${tot} votes</div>`;
  requestAnimationFrame(()=>document.querySelectorAll('.op-bar b').forEach(b=>b.style.width=b.dataset.w+'%'))}
 const nv=$('nv');if(nv)nv.onclick=()=>{mode='vote';draw()};window.__t={votes:st.votes.length,mode}}
$('cd').onclick=e=>{const b=e.target.closest('.op-c');if(!b)return;st.votes.push(+b.dataset.i);save();Kit.ding();mode=st.hide?'thanks':'vote';draw()};
$('res').onclick=()=>{mode='results';Kit.tada();draw();if(st.votes.length)Kit.confetti(60)};$('vt').onclick=()=>{mode='vote';draw()};
$('hd').onchange=()=>{st.hide=$('hd').checked;save();draw()};
$('clr').onclick=()=>{$('edc').hidden=!$('edc').hidden;$('tq').value=st.q;$('tc').value=st.choices};
$('sv').onclick=()=>{st.q=$('tq').value.trim()||'Our poll';st.choices=$('tc').value;st.votes=[];save();$('edc').hidden=true;mode='vote';draw()};
draw();
</script>
</body></html>
