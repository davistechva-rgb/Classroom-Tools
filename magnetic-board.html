<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Magnetic Board</title>
<style>
main{max-width:1800px}
.mg-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:10px}
.mg-board{position:relative;border:8px solid #C7CED9;outline:6px solid var(--ink);border-radius:22px;box-shadow:9px 9px 0 var(--ink);background:linear-gradient(135deg,#F7F9FC,#E4E9F1);aspect-ratio:16/9;overflow:hidden;touch-action:none;margin:6px}
.mg-board.chalk{background:#2F5D3A;border-color:#8B5A2B}
.mg-board.cork{background:#C99A63;background-image:radial-gradient(rgba(0,0,0,.08) 1.5px,transparent 1.5px);background-size:12px 12px;border-color:#8B5A2B}
.mg-m{position:absolute;font-weight:900;cursor:grab;user-select:none;touch-action:none;color:var(--mc);font-size:clamp(1.6rem,4.2vw,3.6rem);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 0 #000;-webkit-text-stroke:2px rgba(29,43,83,.55);font-family:Fredoka,sans-serif;transform:rotate(var(--r,0deg))}
.mg-m.pic{-webkit-text-stroke:0;text-shadow:0 4px 4px rgba(0,0,0,.25)}
.mg-m.shape{-webkit-text-stroke:0}
.mg-m.hold{cursor:grabbing;transform:scale(1.15) rotate(var(--r,0deg));z-index:10;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.mg-tray{background:#fff;border:5px solid var(--ink);border-radius:18px;padding:8px;margin-top:12px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.mg-tray button{font:900 1.5rem Fredoka,sans-serif;min-width:44px;height:48px;border:3px solid var(--ink);border-radius:12px;background:#F4FAFF;cursor:pointer;color:var(--tc,var(--ink))}
.mg-tray button:hover{transform:translateY(-2px)}
.mg-tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.mg-goal{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fff;border:4px solid var(--ink);border-radius:16px;padding:6px 14px;display:flex;gap:10px;align-items:center;font-weight:900;z-index:5}
.mg-goal .e{font-size:2.6rem}
.mg-slots{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;gap:10px}
.mg-slots i{width:clamp(44px,6vw,80px);height:clamp(54px,7.5vw,96px);border:4px dashed #9FA9C4;border-radius:14px;display:block}
.mg-slots i.ok{border-color:#5DC66E;background:rgba(93,198,110,.15)}
.mg-trash{position:absolute;right:10px;bottom:10px;font-size:2rem;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:4px 8px;z-index:4}
.mg-trash.hot{background:#FFB3AA;transform:scale(1.15)}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🧲", "Magnetic Board");
const $=id=>document.getElementById(id);
const MC=['#E5533F','#FF9F43','#FFC93C','#5DC66E','#22C3E6','#1E7FD0','#9B6BF2','#FF6B9A'];
const SETS={abc:['🔤 ABC','ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')],low:['🔡 abc','abcdefghijklmnopqrstuvwxyz'.split('')],num:['🔢 123','0123456789+−×÷=<>.'.split('')],shp:['🔺 Shapes',['🔴','🟠','🟡','🟢','🔵','🟣','🟥','🟧','🟨','🟩','🟦','🟪','🔺','🔷','⭐','❤️']],pic:['🐶 Pictures',['🐶','🐱','🐭','🐰','🦊','🐻','🐸','🐵','🐔','🐟','🌳','🌸','☀️','🌙','⭐','🏠','🚗','🍎','🍌','⚽','🎈','📚','✏️','🎵']]};
const WORDS=[['🐱','CAT'],['🐶','DOG'],['☀️','SUN'],['🐟','FISH'],['🍎','APPLE'],['🐸','FROG'],['🚗','CAR'],['🌳','TREE'],['⭐','STAR'],['🐻','BEAR'],['🎈','BALLOON'],['🏠','HOME'],['🐔','HEN'],['🌙','MOON'],['📚','BOOK'],['🐰','BUNNY']];
let M=Kit.get('mg-board',[]),set='abc',drag=null,goal=null,bg=Kit.get('mg-bg','');
document.querySelector('main').innerHTML=`<div class="mg-top"><select id="bgs" style="width:auto"><option value="">🧊 Fridge</option><option value="chalk">🟩 Chalkboard</option><option value="cork">🟫 Cork board</option></select><button class="btn white small" id="wd">🔤 Spell a word</button><button class="btn white small" id="sc">✨ Tidy up</button><button class="btn white small" id="cl">🗑️ Clear board</button></div>
<div class="mg-board ${bg}" id="bd"><div class="mg-trash" id="tr">🗑️</div></div><div class="mg-tabs" id="tb">${Object.entries(SETS).map(([k,v])=>`<button class="btn ${k===set?'':'white'} small" data-set="${k}">${v[0]}</button>`).join('')}</div><div class="mg-tray" id="ty"></div>`;
$('bgs').value=bg;
function save(){Kit.set('mg-board',M)}
function tray(){$('ty').innerHTML=SETS[set][1].map((c,i)=>`<button data-add="${Kit.esc(c)}" style="--tc:${MC[i%MC.length]}">${c}</button>`).join('');document.querySelectorAll('[data-set]').forEach(b=>b.className='btn small '+(b.dataset.set===set?'':'white'))}
function draw(){$('bd').querySelectorAll('.mg-m').forEach(e=>e.remove());M.forEach((m,i)=>{const d=document.createElement('div');d.className='mg-m'+(/\p{Extended_Pictographic}|[\u{1F7E0}-\u{1F7EB}]/u.test(m.c)?(m.s==='pic'?' pic':' shape'):'');d.textContent=m.c;d.dataset.i=i;d.style.left=m.x+'%';d.style.top=m.y+'%';d.style.setProperty('--mc',m.col);d.style.setProperty('--r',m.r+'deg');$('bd').appendChild(d)});check();window.__t={n:M.length,chars:M.map(m=>m.c).join(''),goal:goal&&goal[1],solved:goal&&goal.solved}}
function add(c){if(M.length>=80)return;const col=SETS[set][1].indexOf(c);M.push({c,x:Kit.rand(8,85),y:Kit.rand(55,80),col:MC[(col<0?0:col)%MC.length],r:Kit.rand(-8,8),s:set});save();draw();Kit.tone(500,.05,'triangle',.1)}
$('ty').onclick=e=>{const b=e.target.closest('[data-add]');if(b)add(b.dataset.add)};
$('tb').onclick=e=>{const b=e.target.closest('[data-set]');if(b){set=b.dataset.set;tray()}};
$('bd').addEventListener('pointerdown',e=>{const d=e.target.closest('.mg-m');if(!d)return;e.preventDefault();const r=$('bd').getBoundingClientRect(),m=M[+d.dataset.i],dr=d.getBoundingClientRect();drag={d,m,ox:e.clientX-dr.left,oy:e.clientY-dr.top,r};d.classList.add('hold');d.setPointerCapture(e.pointerId);Kit.tick()});
$('bd').addEventListener('pointermove',e=>{if(!drag)return;const {r,d,m}=drag;m.x=Math.max(-2,Math.min(96,(e.clientX-drag.ox-r.left)/r.width*100));m.y=Math.max(-2,Math.min(92,(e.clientY-drag.oy-r.top)/r.height*100));d.style.left=m.x+'%';d.style.top=m.y+'%';const t=$('tr').getBoundingClientRect();$('tr').classList.toggle('hot',e.clientX>t.left-10&&e.clientY>t.top-10)});
$('bd').addEventListener('pointerup',e=>{if(!drag)return;const t=$('tr').getBoundingClientRect();if(e.clientX>t.left-10&&e.clientY>t.top-10){M.splice(M.indexOf(drag.m),1);Kit.tone(220,.1,'triangle',.1)}else Kit.tone(380,.06,'square',.08);drag.d.classList.remove('hold');$('tr').classList.remove('hot');drag=null;save();draw()});
function slots(){if(!goal)return[];const els=[...$('bd').querySelectorAll('.mg-slots i')];return els.map(s=>s.getBoundingClientRect())}
function check(){if(!goal)return;const S=slots(),mags=[...$('bd').querySelectorAll('.mg-m')];let ok=0;
 S.forEach((r,k)=>{const want=goal[1][k];const hit=mags.find(d=>{const b=d.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;return cx>r.left-6&&cx<r.right+6&&cy>r.top-6&&cy<r.bottom+6&&d.textContent.toUpperCase()===want});$('bd').querySelectorAll('.mg-slots i')[k].classList.toggle('ok',!!hit);if(hit)ok++});
 if(ok===goal[1].length&&!goal.solved){goal.solved=true;Kit.tada();Kit.confetti(60);$('gl').innerHTML=`<span class="e">${goal[0]}</span> 🎉 You spelled ${goal[1]}! <button class="btn green small" id="gn">Next ➜</button>`;$('gn').onclick=word}}
function word(){$('bd').querySelectorAll('.mg-goal,.mg-slots').forEach(x=>x.remove());goal=Kit.pick(WORDS.filter(w=>!goal||w[1]!==goal[1])).slice();goal.solved=false;set='abc';tray();
 $('bd').insertAdjacentHTML('afterbegin',`<div class="mg-goal" id="gl"><span class="e">${goal[0]}</span> Spell it! <button class="btn white small" id="gx">✖</button></div><div class="mg-slots">${goal[1].split('').map(()=>'<i></i>').join('')}</div>`);$('gx').onclick=()=>{$('bd').querySelectorAll('.mg-goal,.mg-slots').forEach(x=>x.remove());goal=null;draw()};
 // put the letters (plus a couple of extras) on the board
 const extra=Kit.shuffle('AEIOUSTRLN'.split('')).slice(0,2);Kit.shuffle([...goal[1].split(''),...extra]).forEach((c,i,a)=>M.push({c,x:6+i*(86/a.length),y:Kit.rand(68,80),col:MC[i%MC.length],r:Kit.rand(-8,8),s:'abc'}));save();draw()}
$('wd').onclick=word;$('cl').onclick=()=>{if(!M.length||confirm('Take every magnet off the board?')){M=[];save();draw()}};
$('sc').onclick=()=>{let x=3,y=58;const cols=Math.floor(94/7);M.forEach((m,i)=>{m.x=3+(i%cols)*7;m.y=58+Math.floor(i/cols)*12;m.r=0});save();draw()};
$('bgs').onchange=()=>{bg=$('bgs').value;Kit.set('mg-bg',bg);$('bd').className='mg-board '+bg};
window.__m={add,place:(i,x,y)=>{M[i].x=x;M[i].y=y;draw()},slot:k=>{const r=$('bd').getBoundingClientRect(),s=slots()[k];return [(s.left-r.left)/r.width*100,(s.top-r.top)/r.height*100]},find:c=>M.findIndex((m,i)=>m.c===c&&!m.used)};
addEventListener('resize',draw);tray();draw();
</script>
</body></html>
