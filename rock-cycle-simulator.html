<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Rock Cycle Simulator</title>
<style>
main{max-width:1500px}
.rc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.rc{grid-template-columns:1fr}}
.rc-map{background:#fff;border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:8px}
.rc-map svg{width:100%;display:block}
.rc-node{cursor:default}
.rc-card{background:#fff;border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.rc-rock{width:130px;aspect-ratio:1;border-radius:38% 46% 40% 52%;border:5px solid var(--ink);background:var(--rk);box-shadow:inset -10px -12px 0 rgba(0,0,0,.18),inset 8px 8px 0 rgba(255,255,255,.25);position:relative;transition:all .5s}
.rc-rock.magma{border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFE38A,#FF6B1A 45%,#B5210E);animation:rcGlow 1.2s infinite alternate}@keyframes rcGlow{to{filter:brightness(1.2)}}
.rc-rock.sed{border-radius:12px;background:radial-gradient(circle,var(--rk) 30%,transparent 32%) 0 0/14px 14px,radial-gradient(circle,var(--rk) 30%,transparent 32%) 7px 7px/14px 14px,#F7F0DC}
.rc-card h2{margin:0}.rc-card .k{display:inline-block;border:3px solid var(--ink);border-radius:99px;padding:1px 10px;font-weight:800;background:var(--kc);margin:4px 0}
.rc-act{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.rc-act button{font:inherit;font-weight:800;border:4px solid var(--ink);border-radius:16px;padding:8px;background:var(--ac);cursor:pointer;color:var(--ink);box-shadow:0 4px 0 var(--ink);text-align:left}
.rc-act button small{display:block;font-weight:600;font-size:.82rem}
.rc-act button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.rc-mis div{display:flex;gap:8px;border:3px solid var(--ink);border-radius:12px;padding:5px 10px;margin-bottom:6px;font-weight:700;background:#F4FAFF}.rc-mis div.ok{background:#C9F1D2}
.rc-path{display:flex;flex-wrap:wrap;gap:4px;font-weight:700;font-size:.9rem;margin-top:8px}.rc-path span{background:#F4FAFF;border:2px solid var(--ink);border-radius:99px;padding:1px 8px}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🪨", "Rock Cycle Simulator");
const $=id=>document.getElementById(id);
// every rock, its type, its color, and what it's like
const R={sand:['sediment','Sand','#E9C98A','Tiny bits of broken rock, washed into a pile by water and wind.'],mud:['sediment','Mud and clay','#9C7A5A','Super-fine bits of rock that settle in calm water.'],shells:['sediment','Shells and lime mud','#EDE6D6','Bits of shells and skeletons from sea creatures.'],
 sandstone:['sedimentary','Sandstone','#D9A066','Sand grains pressed and glued together. You can often see layers.'],shale:['sedimentary','Shale','#6E6A6A','Mud pressed into thin, flat layers that split easily.'],limestone:['sedimentary','Limestone','#E3DCC8','Made from shells. It can have fossils inside!'],
 quartzite:['metamorphic','Quartzite','#F2D7D0','Sandstone squeezed and baked into a super-hard rock.'],slate:['metamorphic','Slate','#4F5B6E','Shale squeezed into a rock that splits into smooth sheets. Old chalkboards were slate!'],marble:['metamorphic','Marble','#F4F1EC','Limestone baked and squeezed. Famous statues are carved from it.'],gneiss:['metamorphic','Gneiss','#8C8C99','Granite squeezed so hard its minerals line up in stripes. Say it "nice"!'],schist:['metamorphic','Schist','#6B8C7A','A sparkly, flaky rock made from heated and squeezed rock.'],
 magma:['magma','Magma','#FF6B1A','Melted rock deep underground. When it comes out of a volcano, it\'s called lava.'],
 granite:['igneous','Granite','#C7A9A0','Magma that cooled slowly underground, so it grew big, speckled crystals.'],basalt:['igneous','Basalt','#3E3E48','Lava that cooled quickly, so its crystals are tiny. Most of the ocean floor is basalt.'],obsidian:['igneous','Obsidian','#1A1A22','Lava that cooled SO fast it turned to glass. It\'s shiny and sharp.'],pumice:['igneous','Pumice','#D8D2C4','Foamy lava full of gas bubbles. It\'s so light it can float on water!']};
const KC={sediment:'#F7F0DC',sedimentary:'#FFE3C4',metamorphic:'#EAE0FF',magma:'#FFD9D4',igneous:'#DDE6F0'};
const ACT=[['erode','🌧️ Weathering & erosion','Wind, water, and ice break it into bits','#BFE6FA',r=>R[r][0]!=='sediment'&&r!=='magma',r=>({granite:'sand',sandstone:'sand',quartzite:'sand',basalt:'mud',shale:'mud',slate:'mud',schist:'mud',gneiss:'sand',obsidian:'sand',pumice:'sand',limestone:'shells',marble:'shells'})[r]],
 ['compact','🧱 Compaction & cementation','Layers pile up, squeeze, and glue together','#FFE3C4',r=>R[r][0]==='sediment',r=>({sand:'sandstone',mud:'shale',shells:'limestone'})[r]],
 ['meta','🔥 Heat & pressure','Buried deep and squeezed, but not melted','#EAE0FF',r=>['sedimentary','igneous','metamorphic'].includes(R[r][0])&&!['quartzite','marble','gneiss','schist'].includes(r)||r==='slate',r=>({sandstone:'quartzite',shale:'slate',slate:'schist',limestone:'marble',granite:'gneiss',basalt:'schist',obsidian:'schist',pumice:'schist'})[r]],
 ['melt','🌋 Melting','Pushed so deep it gets hot enough to melt','#FFD9D4',r=>r!=='magma'&&R[r][0]!=='sediment',()=>'magma'],
 ['slow','🐢 Cool slowly underground','Crystals have time to grow big','#DDE6F0',r=>r==='magma',()=>'granite'],
 ['fast','⚡ Erupt and cool fast','Lava cools quickly on the surface','#DDE6F0',r=>r==='magma',()=>Kit.pick(['basalt','basalt','obsidian','pumice'])]];
const MIS=[['Make marble',p=>p.includes('marble')],['Make obsidian or pumice from a volcano',p=>p.includes('obsidian')||p.includes('pumice')],['Make slate',p=>p.includes('slate')],['Visit all 5 stops on the cycle',p=>new Set(p.map(r=>R[r][0])).size===5],['Make 10 changes in a row',p=>p.length>=11]];
let cur='granite',path=['granite'],done=new Set();
const POS={igneous:[400,90],sediment:[640,280],sedimentary:[520,500],metamorphic:[280,500],magma:[160,280]};
document.querySelector('main').innerHTML=`<div class="rc"><div class="rc-map"><svg id="mp" viewBox="0 0 800 600"></svg></div>
<div><div class="rc-card"><div class="rc-rock" id="rk"></div><div><h2 id="nm"></h2><span class="k" id="kd"></span><p style="margin:4px 0;font-weight:600" id="ds"></p></div></div>
<div class="rc-act" id="act"></div><div class="rc-path" id="pth"></div><div style="margin-top:12px"><b>🎯 Missions</b><div class="rc-mis" id="mis"></div><button class="btn white small" id="rs">↺ Start with a new rock</button></div></div></div>`;
function map(){const k=R[cur][0];let s='<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#8892A8"/></marker></defs>';
 [['igneous','sediment'],['sediment','sedimentary'],['sedimentary','metamorphic'],['metamorphic','magma'],['magma','igneous'],['sedimentary','sediment'],['metamorphic','sediment'],['igneous','metamorphic'],['sedimentary','magma']].forEach(([a,b])=>{const [x1,y1]=POS[a],[x2,y2]=POS[b],dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d;s+=`<line x1="${x1+ux*72}" y1="${y1+uy*72}" x2="${x2-ux*78}" y2="${y2-uy*78}" stroke="#C3CBDB" stroke-width="5" marker-end="url(#ah)"/>`});
 // the path the rock has taken so far
 for(let i=1;i<path.length;i++){const [x1,y1]=POS[R[path[i-1]][0]],[x2,y2]=POS[R[path[i]][0]];if(x1===x2&&y1===y2)continue;s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#FF9F43" stroke-width="${3+i/path.length*5}" opacity="${.3+.7*i/path.length}"/>`}
 Object.entries(POS).forEach(([n,[x,y]])=>{const on=n===k,vis=path.some(r=>R[r][0]===n);s+=`<g class="rc-node"><circle cx="${x}" cy="${y}" r="70" fill="${KC[n]}" stroke="#1D2B53" stroke-width="${on?9:5}"/>${on?`<circle cx="${x}" cy="${y}" r="80" fill="none" stroke="#FFC93C" stroke-width="6"><animate attributeName="r" values="76;86;76" dur="1.4s" repeatCount="indefinite"/></circle>`:''}<text x="${x}" y="${y-4}" text-anchor="middle" font-weight="800" font-size="22" fill="#1D2B53">${n==='sediment'?'Sediment':n[0].toUpperCase()+n.slice(1)}</text><text x="${x}" y="${y+24}" text-anchor="middle" font-size="18" font-weight="700" fill="#55607E">${n==='sediment'?'bits of rock':n==='magma'?'melted rock':'rock'}${vis?' ✓':''}</text></g>`});
 $('mp').innerHTML=s}
function draw(){const r=R[cur];$('nm').textContent=r[1];$('kd').textContent=r[0]==='sediment'?'Sediment':r[0]==='magma'?'Magma':r[0][0].toUpperCase()+r[0].slice(1)+' rock';$('kd').style.setProperty('--kc',KC[r[0]]);$('ds').textContent=r[3];
 const rk=$('rk');rk.className='rc-rock'+(cur==='magma'?' magma':r[0]==='sediment'?' sed':'');rk.style.setProperty('--rk',r[2]);
 if(cur==='granite'||cur==='gneiss')rk.style.backgroundImage='radial-gradient(circle,#1D2B53 18%,transparent 20%),radial-gradient(circle,#F4F1EC 18%,transparent 20%)',rk.style.backgroundSize='22px 22px,17px 17px';else if(r[0]!=='sediment'&&cur!=='magma')rk.style.backgroundImage=cur==='sandstone'||cur==='shale'||cur==='slate'?'repeating-linear-gradient(170deg,rgba(0,0,0,.08) 0 8px,transparent 8px 18px)':cur==='obsidian'?'linear-gradient(135deg,rgba(255,255,255,.35),transparent 40%)':cur==='pumice'?'radial-gradient(circle,rgba(0,0,0,.18) 22%,transparent 26%)':'',rk.style.backgroundSize=cur==='pumice'?'12px 12px':'';
 $('act').innerHTML=ACT.map(a=>`<button data-a="${a[0]}" style="--ac:${a[3]}" ${a[4](cur)?'':'disabled'}>${a[1]}<small>${a[2]}</small></button>`).join('');
 $('pth').innerHTML='🧭 Journey: '+path.map(r=>`<span>${R[r][1]}</span>`).join('→');
 MIS.forEach((m,i)=>{if(!done.has(i)&&m[1](path)){done.add(i);Kit.tada();Kit.confetti(50)}});$('mis').innerHTML=MIS.map((m,i)=>`<div class="${done.has(i)?'ok':''}">${done.has(i)?'✅':'⬜'} ${m[0]}</div>`).join('');map();window.__t={cur,stage:r[0],path:[...path],done:done.size}}
$('act').onclick=e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=ACT.find(z=>z[0]===b.dataset.a);cur=a[5](cur);path.push(cur);Kit.tone({erode:500,compact:350,meta:280,melt:180,slow:420,fast:600}[a[0]],.2,'triangle',.2);draw()};
$('rs').onclick=()=>{cur=Kit.pick(['granite','basalt','sandstone','limestone','shale']);path=[cur];draw()};
draw();
</script>
</body></html>
