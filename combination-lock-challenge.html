<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Combination Lock Challenge</title>
<style>
.cl-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:820px){.cl-wrap{grid-template-columns:1fr}}
.cl-lock{position:relative;max-width:420px;margin:0 auto;width:100%}
.cl-shackle{width:58%;margin:0 auto -18px;height:120px;border:26px solid #9AA5B4;border-bottom:0;border-radius:120px 120px 0 0;position:relative;transition:transform .7s cubic-bezier(.3,1.5,.5,1);box-shadow:inset 0 0 0 4px var(--ink),0 0 0 4px var(--ink)}
.cl-lock.open .cl-shackle{transform:translateY(-44px)}
.cl-body{background:linear-gradient(#3A4660,#252E44);border:6px solid var(--ink);border-radius:40px;padding:22px;box-shadow:8px 8px 0 var(--ink);position:relative}
.cl-dial{width:100%;aspect-ratio:1;display:block;touch-action:none;cursor:grab}
.cl-ptr{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid #FF6B5B;filter:drop-shadow(0 2px 0 var(--ink))}
.cl-ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.cl-steps{display:grid;gap:12px}
.cl-step{display:flex;align-items:center;gap:12px;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink)}
.cl-step .n{font:800 2rem/1 ui-monospace,Consolas,monospace;min-width:70px;text-align:center;background:#EEF2F8;border:3px solid var(--ink);border-radius:12px;padding:6px}
.cl-step .n.got{background:var(--sun)}
.cl-step .d{flex:1;font-weight:700}
.cl-step.now{outline:5px solid var(--grass);outline-offset:3px}
.cl-step .ok{font-size:1.6rem}
.cl-read{text-align:center;font:800 1.6rem ui-monospace,Consolas,monospace;margin-top:8px;color:#fff}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="escape.js"></script>
<script>
Kit.mount("🔐", "Combination Lock Challenge");

Esc.setup({intro:'🔐🌀', minutes:12,
how:'A real dial lock! Answer three questions to learn the three numbers. Then dial them the way real locks work: turn RIGHT (clockwise) to the first number, LEFT (counterclockwise) to the second number, and RIGHT again to the third. Drag the dial or use the turn buttons, press "Stop here" on each number, then pull the lock open.',
start({room}){
 const $=id=>document.getElementById(id);
 const N=40;let nums=[];do{nums=[Kit.rand(1,39),Kit.rand(1,39),Kit.rand(1,39)]}while(new Set(nums).size<3||Math.abs(nums[0]-nums[1])<4||Math.abs(nums[1]-nums[2])<4);
 window.__sol={nums};
 const DIR=['right ⟳','left ⟲','right ⟳'];
 room.innerHTML=`<div class="cl-wrap"><div class="cl-lock" id="lock"><div class="cl-shackle"></div><div class="cl-body"><div class="cl-ptr"></div>
  <svg class="cl-dial" id="dial" viewBox="-110 -110 220 220" aria-label="Combination dial"><g id="rot"><circle r="104" fill="#1B2232" stroke="#0F1422" stroke-width="4"/><circle r="100" fill="url(#g)"/>
  <defs><radialGradient id="g"><stop offset="0" stop-color="#4A5672"/><stop offset="1" stop-color="#2A3247"/></radialGradient></defs>
  ${Array.from({length:N},(_,i)=>{const a=i*360/N;const long=i%5===0;return `<g transform="rotate(${a})"><line y1="-98" y2="${long?-82:-89}" stroke="#fff" stroke-width="${long?3:1.6}"/>${long?`<text y="-66" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif" transform="rotate(0)">${i}</text>`:''}</g>`}).join('')}
  <circle r="34" fill="#141A28" stroke="#556" stroke-width="3"/><circle r="10" fill="#8C96A8"/></g></svg>
  <div class="cl-read" id="read">0</div>
  <div class="cl-ctl"><button class="btn white" id="L" aria-label="Turn left">⟲ Left</button><button class="btn" id="stop">Stop here</button><button class="btn white" id="R" aria-label="Turn right">Right ⟳</button></div>
  <div class="cl-ctl"><button class="btn red small" id="reset">Spin to reset</button><button class="btn green" id="pull">Pull the lock</button></div></div></div>
  <div class="cl-steps" id="steps"></div></div>`;
 // dial value: number under the pointer. Rotating the dial clockwise (right) makes the number under the pointer go DOWN.
 let ang=0,got=[false,false,false],stops=[],lastDir=0,dirAtStop=[];
 const val=()=>((Math.round(-ang/(360/N))%N)+N)%N;
 const draw=()=>{$('rot').setAttribute('transform',`rotate(${ang})`);$('read').textContent=val()};
 let prevVal=0;const moved=(d)=>{if(d!==0)lastDir=d>0?1:-1;const v=val();if(v!==prevVal){Kit.tone(1400,.015,'square',.04);prevVal=v}draw()};
 const turn=deg=>{ang+=deg;moved(deg)};
 const hold=(btn,deg)=>{let t;const go=()=>{turn(deg);t=setTimeout(go,70)};btn.onpointerdown=e=>{e.preventDefault();go()};['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>clearTimeout(t)))};
 hold($('R'),9);hold($('L'),-9);
 const dial=$('dial');let drag=null;
 dial.onpointerdown=e=>{const r=dial.getBoundingClientRect();drag={cx:r.left+r.width/2,cy:r.top+r.height/2};drag.a=Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx);dial.setPointerCapture(e.pointerId)};
 dial.onpointermove=e=>{if(!drag)return;const a=Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx);let d=(a-drag.a)*180/Math.PI;if(d>180)d-=360;if(d<-180)d+=360;drag.a=a;turn(d)};
 dial.onpointerup=dial.onpointercancel=()=>{drag=null;ang=-val()*(360/N);draw()};
 document.addEventListener('keydown',e=>{if(document.querySelector('.es-ov')||Esc.over)return;if(e.key==='ArrowRight'){turn(9);ang=-val()*9;draw()}if(e.key==='ArrowLeft'){turn(-9);ang=-val()*9;draw()}});
 const steps=()=>{$('steps').innerHTML=nums.map((n,i)=>`<div class="cl-step ${got[i]&&stops.length===i?'now':''}"><span class="n ${got[i]?'got':''}">${got[i]?n:'??'}</span><span class="d">${i+1}. Turn <b>${DIR[i]}</b> to this number${got[i]?'':`<br><button class="btn small grape" data-q="${i}">Unlock this number</button>`}</span><span class="ok">${stops[i]!=null?'📍'+stops[i]:''}</span></div>`).join('')};steps();
 let busy=false;
 $('steps').onclick=async e=>{const b=e.target.closest('[data-q]');if(!b||busy)return;busy=true;const i=+b.dataset.q;const ok=await Esc.ask({icon:'🔢',title:`Number ${i+1}`});busy=false;if(!ok)return;got[i]=true;steps();Esc.stat(`🔢 ${got.filter(Boolean).length} of 3 numbers`);
  if(got.every(Boolean))Esc.msg('You know all three numbers. Spin to reset, then dial them in!')};
 $('reset').onclick=async()=>{stops=[];dirAtStop=[];for(let k=0;k<24;k++){turn(15);await Kit.sleep(16)}ang=0;draw();steps();Esc.msg('Dial reset. Now turn right to the first number.')};
 $('stop').onclick=()=>{if(stops.length>=3){Esc.msg('Three numbers are set. Pull the lock!');return}stops.push(val());dirAtStop.push(lastDir);Kit.tone(700,.1,'triangle',.2);steps();
  Esc.msg(stops.length<3?`Stopped on ${val()}. Now turn ${DIR[stops.length]}.`:'All three set. Pull the lock!')};
 $('pull').onclick=async()=>{const want=[1,-1,1];
  const right=stops.length===3&&stops.every((s,i)=>s===nums[i])&&dirAtStop.every((d,i)=>d===want[i]);
  if(right){$('lock').classList.add('open');Kit.ding();await Kit.sleep(800);Esc.win('🔓','Unlocked!',`${nums.join(' – ')}. You cracked the combination!`)}
  else{Esc.penalize();Kit.tone(150,.4,'sawtooth',.2);$('lock').animate([{transform:'translateY(0)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'}],{duration:250});
   const wrongDir=stops.length===3&&stops.every((s,i)=>s===nums[i]);Esc.msg(wrongDir?'Right numbers, but turn the right way for each one! Spin to reset and try again.':stops.length<3?'Set all three numbers first.':'Clunk. It won\'t open. Spin to reset and try again.');}};
 Esc.stat('🔢 0 of 3 numbers');Esc.msg('Unlock the three numbers first.');draw();
}});
</script>
</body></html>
