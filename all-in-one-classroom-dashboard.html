<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>All-in-One Classroom Dashboard</title>
<style>
main{max-width:1900px}
.ai-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
.ai-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.ai-p{grid-column:span 4;background:#fff;border:5px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0;min-height:160px}
.ai-p.w3{grid-column:span 3}.ai-p.w5{grid-column:span 5}.ai-p.w6{grid-column:span 6}.ai-p.w8{grid-column:span 8}
@media (max-width:1100px){.ai-p,.ai-p.w3,.ai-p.w5,.ai-p.w8{grid-column:span 6}}
@media (max-width:680px){.ai-grid>*{grid-column:1/-1 !important}}
.ai-p h3{margin:0;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ai-p h3 a{font-size:.8rem;font-weight:800;color:#1E7FD0}
.ai-clock{font:900 clamp(2.6rem,6vw,4rem) Fredoka,sans-serif;line-height:1;text-align:center}
.ai-date{text-align:center;font-weight:800;color:#55607E}
.ai-now{background:#FFF6C9;border:4px solid var(--ink);border-radius:16px;padding:8px 12px}
.ai-now b{font-size:1.5rem;display:block}
.ai-sched{display:grid;gap:3px;max-height:230px;overflow:auto}
.ai-sched div{display:flex;justify-content:space-between;font-weight:700;padding:2px 8px;border-radius:8px}.ai-sched div.on{background:#C8F3D0;font-weight:900}.ai-sched div.past{opacity:.45}
.ai-att{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px;max-height:260px;overflow:auto}
.ai-att button{font:inherit;font-weight:800;font-size:.9rem;border:3px solid var(--ink);border-radius:12px;padding:4px;background:#C8F3D0;cursor:pointer;color:var(--ink)}
.ai-att button.away{background:#FFD3CC;text-decoration:line-through;opacity:.75}
.ai-rows{display:grid;gap:5px}
.ai-rows div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-weight:800}
.ai-bar{height:14px;border:3px solid var(--ink);border-radius:99px;background:#E3E8F2;overflow:hidden}.ai-bar i{display:block;height:100%;background:var(--c,#5DC66E)}
.ai-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.ai-links a{border:3px solid var(--ink);border-radius:14px;padding:6px 8px;font-weight:800;text-decoration:none;color:var(--ink);background:#F4FAFF;font-size:.9rem;display:block}
.ai-links a:hover{background:var(--sun)}
.ai-tm{font:900 3rem Fredoka,sans-serif;text-align:center;line-height:1}
.ai-tm.end{color:#E5533F;animation:bl .5s infinite alternate}@keyframes bl{to{opacity:.3}}
.ai-todo{display:grid;gap:4px}.ai-todo label{display:flex;gap:6px;align-items:center;font-weight:700}.ai-todo label.d{text-decoration:line-through;opacity:.5}
.ai-todo input[type=text]{font:inherit;padding:4px 8px;border:3px solid var(--ink);border-radius:10px;width:100%}
.ai-empty{color:#55607E;font-weight:700}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script><script src="rewards.js"></script>
<script>
Kit.mount("🖥️", "All-in-One Classroom Dashboard");
const $=id=>document.getElementById(id);
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const DEF=[['08:00','08:15','Morning meeting'],['08:15','09:15','Reading'],['09:15','10:15','Math'],['10:15','10:30','Recess'],['10:30','11:30','Science'],['11:30','12:00','Lunch'],['12:00','12:45','Social studies'],['12:45','13:30','Specials'],['13:30','14:30','Writing'],['14:30','14:45','Pack up']];
const ds=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let att=Kit.get('aio-att',{}),todo=Kit.get('aio-todo',[]),tLeft=0,tTot=300,tRun=null;
const today=()=>ds(new Date());
const pretty=s=>s.replace(/\.html$/,'').split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
document.querySelector('main').innerHTML=`<div class="ai-top"><button class="btn white small" id="ar">🧩 Arrange panels</button><button class="btn white small" id="rf">🔄 Refresh</button></div><div class="ai-grid" id="gd">
<div class="ai-p w3" data-w="clock" data-n="🕐 Clock"><div class="ai-clock" id="ck"></div><div class="ai-date" id="dt"></div><div class="ai-now" id="nw"></div></div>
<div class="ai-p w5" data-w="sched" data-n="📅 Today's schedule"><h3>📅 Today's schedule <a href="class-schedule.html">edit ✏️</a></h3><div class="ai-sched" id="sc"></div></div>
<div class="ai-p" data-w="att" data-n="🙋 Attendance"><h3>🙋 Here today <span id="ac" style="font-size:.95rem"></span></h3><div class="ai-att" id="at"></div></div>
<div class="ai-p" data-w="leaders" data-n="🏆 Class leaders"><h3>🏆 XP leaders <a href="class-leaderboard.html">more ➜</a></h3><div class="ai-rows" id="ld"></div></div>
<div class="ai-p" data-w="missions" data-n="🕵️ Missions"><h3>🕵️ Class missions <a href="classroom-missions.html">open ➜</a></h3><div class="ai-rows" id="ms"></div></div>
<div class="ai-p" data-w="teams" data-n="❤️ Team health"><h3>❤️ Team health <a href="team-health-system.html">open ➜</a></h3><div class="ai-rows" id="th"></div></div>
<div class="ai-p w3" data-w="timer" data-n="⏱️ Timer"><h3>⏱️ Timer</h3><div class="ai-tm" id="tm">5:00</div><div class="row" style="gap:4px;justify-content:center">${[1,3,5,10].map(m=>`<button class="btn white small" data-m="${m}">${m}m</button>`).join('')}</div><div class="row" style="gap:4px;justify-content:center"><button class="btn green small" id="tg">▶ Start</button><button class="btn white small" id="tr">↺</button></div></div>
<div class="ai-p w5" data-w="habits" data-n="🔥 Habits today"><h3>🔥 Habits today <a href="streak-tracker.html">open ➜</a></h3><div class="ai-rows" id="hb"></div></div>
<div class="ai-p" data-w="jobs" data-n="💼 Class jobs"><h3>💼 Class jobs <a href="classroom-currency-system.html">open ➜</a></h3><div class="ai-rows" id="jb"></div></div>
<div class="ai-p" data-w="todo" data-n="✅ Teacher to-do"><h3>✅ My to-do</h3><div class="ai-todo" id="td"></div><input type="text" id="ti" placeholder="Add a reminder and press Enter" style="font:inherit;padding:4px 8px;border:3px solid var(--ink);border-radius:10px"></div>
<div class="ai-p w8" data-w="links" data-n="⭐ My tools"><h3>⭐ My favorite tools <a href="index.html">all tools ➜</a></h3><div class="ai-links" id="lk"></div></div></div>`;
const AR=Kit.arrange($('gd'),'all-in-one');
function sched(){const d=new Date(),day=DAYS[d.getDay()-1];const S=Kit.get('cs',null);const rows=day?((S&&S[day])||DEF):[];const hm=d.toTimeString().slice(0,5);return {day,rows,hm}}
function clock(){const d=new Date();$('ck').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('dt').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 const {rows,hm}=sched();const now=rows.find(r=>r[0]<=hm&&hm<r[1]),next=rows.find(r=>r[0]>hm);const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};const cur=d.getHours()*60+d.getMinutes();
 $('nw').innerHTML=now?`<span style="font-weight:800">📍 Now</span><b>${Kit.esc(now[2])}</b>${next?`<span style="font-weight:700">Next: ${Kit.esc(next[2])} in ${mins(next[0])-cur} min</span>`:''}`:next?`<span style="font-weight:800">⏭️ Next</span><b>${Kit.esc(next[2])}</b><span style="font-weight:700">at ${next[0]}</span>`:'<b>🏡 School is out!</b>';
 $('sc').innerHTML=rows.length?rows.map(r=>`<div class="${r===now?'on':r[1]<=hm?'past':''}"><span>${Kit.esc(r[2])}</span><span>${r[0]}–${r[1]}</span></div>`).join(''):'<div class="ai-empty">No schedule on weekends. 🎉</div>'}
function draw(){const K=RW.kids(),T=today(),away=att[T]||[];
 $('ac').textContent=`${K.filter(k=>!away.includes(k)).length} / ${K.length}`;$('at').innerHTML=K.map(k=>`<button data-a="${Kit.esc(k)}" class="${away.includes(k)?'away':''}">${Kit.esc(k)}</button>`).join('');
 const top=K.map(k=>[k,RW.xp(k)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);$('ld').innerHTML=top.length?top.map(([k,x],i)=>`<div><span>${['🥇','🥈','🥉','4️⃣','5️⃣'][i]}</span><span>${Kit.esc(k)}</span><span>Lv ${RW.level(x).level} · ${x}</span></div>`).join(''):'<div class="ai-empty">No XP given yet.</div>';
 const M=Kit.get('cm2-m',[]);$('ms').innerHTML=M.length?M.slice(0,4).map(m=>`<div><span>${m.e}</span><span>${Kit.esc(m.code)}<div class="ai-bar"><i style="width:${Math.min(100,m.got/m.goal*100)}%;--c:#FF9F43"></i></div></span><span>${m.got}/${m.goal}</span></div>`).join(''):'<div class="ai-empty">No missions yet.</div>';
 const TH=Kit.get('th-state',null);$('th').innerHTML=TH&&TH.teams&&TH.teams.length?TH.teams.map(t=>`<div><span>${t.hp<=0?'😵':t.m}</span><span>${Kit.esc(t.name)}<div class="ai-bar"><i style="width:${t.hp/t.max*100}%;--c:#E5533F"></i></div></span><span>${t.hp}❤️${t.sh?'🛡️':''}</span></div>`).join(''):'<div class="ai-empty">Set up teams in Team Health.</div>';
 const SD=Kit.get('sk-data',{}),H=Object.keys(SD);$('hb').innerHTML=H.length?H.map(h=>{const n=K.filter(k=>((SD[h]||{})[k]||{})[T]===1).length;return `<div><span>🔥</span><span>${Kit.esc(h)}<div class="ai-bar"><i style="width:${K.length?n/K.length*100:0}%;--c:#FF9F43"></i></div></span><span>${n}/${K.length}</span></div>`}).join(''):'<div class="ai-empty">Track habits in the Streak Tracker.</div>';
 const J=Kit.get('cy-asg',{});$('jb').innerHTML=Object.keys(J).length?Object.entries(J).map(([j,k])=>`<div><span>💼</span><span>${Kit.esc(j)}</span><span>${Kit.esc(k)}${away.includes(k)?' 🚫':''}</span></div>`).join(''):'<div class="ai-empty">Hand out jobs in the Currency System.</div>';
 $('td').innerHTML=todo.map((t,i)=>`<label class="${t.d?'d':''}"><input type="checkbox" data-t="${i}" ${t.d?'checked':''}> ${Kit.esc(t.t)} <button data-x="${i}" style="margin-left:auto;border:0;background:none;cursor:pointer" aria-label="Delete">✕</button></label>`).join('')||'<div class="ai-empty">Nothing to do. ☕</div>';
 let F=[];try{F=JSON.parse(localStorage.getItem('ct:favs'))||[]}catch(e){}$('lk').innerHTML=F.length?F.map(f=>`<a href="${Kit.esc(f.endsWith('.html')?f:f+'.html')}">${Kit.esc(pretty(f))}</a>`).join(''):'<div class="ai-empty">Tap ☆ on any tool to add it here.</div>';
 clock();window.__t={present:K.filter(k=>!away.includes(k)).length,kids:K.length,todo:todo.length,done:todo.filter(t=>t.d).length,favs:F.length}}
$('at').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const T=today(),k=b.dataset.a;att[T]=att[T]||[];att[T]=att[T].includes(k)?att[T].filter(x=>x!==k):[...att[T],k];Kit.set('aio-att',att);Kit.tick();draw()};
$('ti').onkeydown=e=>{if(e.key==='Enter'&&$('ti').value.trim()){todo.push({t:$('ti').value.trim(),d:false});$('ti').value='';Kit.set('aio-todo',todo);draw()}};
$('td').onclick=e=>{const x=e.target.closest('[data-x]');if(x){todo.splice(+x.dataset.x,1);Kit.set('aio-todo',todo);draw()}};$('td').onchange=e=>{const i=e.target.dataset.t;if(i!=null){todo[+i].d=e.target.checked;Kit.set('aio-todo',todo);draw()}};
function tShow(){const m=Math.floor(Math.max(0,tLeft)/60),s=Math.max(0,tLeft)%60;$('tm').textContent=`${m}:${String(s).padStart(2,'0')}`;$('tm').classList.toggle('end',tLeft<=0&&!!tRun)}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{clearInterval(tRun);tRun=null;tTot=tLeft=+b.dataset.m*60;$('tg').textContent='▶ Start';tShow()});
$('tg').onclick=()=>{if(tRun){clearInterval(tRun);tRun=null;$('tg').textContent='▶ Start';return}if(tLeft<=0)tLeft=tTot;$('tg').textContent='⏸ Pause';tRun=setInterval(()=>{tLeft--;if(tLeft===0){Kit.alarm&&Kit.alarm();Kit.tada()}if(tLeft<-5){clearInterval(tRun);tRun=null;$('tg').textContent='▶ Start'}tShow()},1000)};
$('tr').onclick=()=>{clearInterval(tRun);tRun=null;tLeft=tTot;$('tg').textContent='▶ Start';tShow()};
$('ar').onclick=()=>{const on=AR.toggle();$('ar').textContent=on?'✅ Done arranging':'🧩 Arrange panels'};$('rf').onclick=draw;
addEventListener('storage',draw);addEventListener('focus',draw);setInterval(clock,15000);
tLeft=tTot;tShow();draw();
</script>
</body></html>
