<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Interactive Timeline Builder</title>
<style>
main{max-width:1500px}
.it-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.it-ed{display:grid;gap:10px}
.it-step{display:grid;grid-template-columns:auto 60px minmax(0,1fr) auto;gap:10px;align-items:start;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:10px}
.it-step .n{font-weight:900;font-size:1.3rem;background:var(--sc);border:3px solid var(--ink);border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.it-step .e{font-size:2rem;border:3px solid var(--ink);border-radius:12px;width:56px;height:56px;background:#fff;cursor:pointer}
.it-step input,.it-step textarea{font:inherit;font-weight:600;padding:6px 9px;border:3px solid var(--ink);border-radius:10px;width:100%;display:block;margin-bottom:6px}
.it-step textarea{min-height:0}
.it-step .tools{display:grid;gap:4px}
.it-pick{position:fixed;z-index:50;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:4px 4px 0 var(--ink)}
.it-pick button{font-size:1.4rem;border:0;background:none;cursor:pointer;border-radius:6px}.it-pick button:hover{background:#FFF1A8}
.it-show{background:#fff;border:6px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);padding:16px;display:grid;gap:14px}
.it-track{position:relative;height:90px;margin:0 20px}
.it-track .ln{position:absolute;left:0;right:0;top:44px;height:8px;background:#E3E8F2;border-radius:4px}
.it-track .fill{position:absolute;left:0;top:44px;height:8px;background:#5DC66E;border-radius:4px;transition:width .6s}
.it-track .dot{position:absolute;top:28px;width:40px;height:40px;border-radius:50%;border:4px solid var(--ink);background:#fff;transform:translateX(-50%);display:grid;place-items:center;font-size:1.2rem;cursor:pointer;transition:.3s}
.it-track .dot.past{background:#8BE09A}.it-track .dot.on{background:var(--sun);transform:translateX(-50%) scale(1.3)}
.it-track .mk{position:absolute;top:-6px;font-size:2rem;transform:translateX(-50%);transition:left .6s}
.it-big{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:center;min-height:300px;animation:sl .45s}
@keyframes sl{0%{transform:translateX(40px);opacity:0}}
@media (max-width:760px){.it-big{grid-template-columns:minmax(0,1fr)}}
.it-big .pic{font-size:clamp(6rem,16vw,11rem);text-align:center;background:var(--sc);border:5px solid var(--ink);border-radius:24px;padding:10px}
.it-big .pic img{max-width:100%;max-height:260px;border-radius:14px}
.it-big h2{margin:0;font-size:clamp(1.5rem,4vw,2.6rem)}.it-big p{font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:600;line-height:1.45;margin:8px 0 0}
.it-big .k{font-weight:900;color:#E5533F}
.it-quiz{display:grid;gap:8px;max-width:760px;margin:0 auto}
.it-q{display:flex;gap:10px;align-items:center;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:800;font-size:1.1rem;cursor:pointer}
.it-q.sel{background:#FFF1A8;outline:4px solid var(--sun)}.it-q.ok{background:#B8F0C2}.it-q.bad{background:#FFD3CC}
.it-q span{font-size:1.8rem}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🗺️", "Interactive Timeline Builder");
const $=id=>document.getElementById(id);
const SC=['#FFE7A3','#C9E58A','#9FD8FF','#FFB3D1','#D6C2FF','#FFC98B','#B8F0E6','#FFF27A'];
const EMO=['🥚','🐛','🛡️','🦋','🌱','🌻','💧','☁️','🌧️','🌊','☀️','🍞','🧀','🥪','🏫','📚','🍎','🚌','⏰','🛏️','✏️','🔬','🧪','📝','🏛️','📜','🗳️','✅','🚀','🌍','⭐','❓'];
const TPL={bfly:['🦋 Butterfly life cycle',[['🥚','Egg','A butterfly lays tiny eggs on a leaf.'],['🐛','Caterpillar','The caterpillar hatches and eats and eats, growing bigger.'],['🛡️','Chrysalis','It makes a hard case called a chrysalis and changes inside.'],['🦋','Butterfly','A butterfly comes out, dries its wings and flies away!']]],
 water:['💧 Water cycle',[['☀️','Evaporation','The sun warms water, and it rises into the air as water vapor.'],['☁️','Condensation','The vapor cools and turns into tiny drops that make clouds.'],['🌧️','Precipitation','When the drops get heavy, they fall as rain, snow or hail.'],['🌊','Collection','Water collects in oceans, lakes and rivers, and the cycle starts again.']]],
 plant:['🌱 Seed to flower',[['🌰','Seed','A seed is planted in soil.'],['💧','Water','Water and warmth help the seed wake up.'],['🌱','Sprout','Roots grow down and a tiny shoot pushes up.'],['🌿','Leaves','Leaves catch sunlight to make food for the plant.'],['🌻','Flower','The plant blooms and makes new seeds.']]],
 law:['🏛️ How a bill becomes a law',[['💡','Idea','Someone has an idea for a new law.'],['📜','Bill','A member of Congress writes the idea as a bill.'],['🗳️','House vote','The House of Representatives debates and votes on it.'],['🗳️','Senate vote','The Senate debates and votes on it too.'],['✍️','President','The President signs the bill, and it becomes a law.']]],
 day:['🏫 Our school day',[['🚌','Arrive','We get to school and unpack.'],['📚','Morning work','Reading and math time.'],['🍎','Lunch & recess','Time to eat and play!'],['🔬','Afternoon','Science, social studies and specials.'],['👋','Goodbye','Pack up and head home.']]]};
let D=Kit.get('it-tl',null)||{title:TPL.bfly[0].slice(3),steps:TPL.bfly[1].map(s=>({e:s[0],t:s[1],x:s[2]}))},tab='edit',cur=0,auto=0,Q=null;
document.querySelector('main').innerHTML=`<div class="it-tabs"><button class="btn" data-t="edit">✏️ Build</button><button class="btn white" data-t="show">▶️ Present</button><button class="btn white" data-t="quiz">🧩 Put it in order</button><select id="tp" style="width:auto"><option value="">📚 Examples…</option>${Object.entries(TPL).map(([k,t])=>`<option value="${k}">${t[0]}</option>`).join('')}</select></div><div id="bd"></div>`;
function save(){Kit.set('it-tl',D)}
function edit(){$('bd').innerHTML=`<div class="it-ed"><input id="ti" value="${Kit.esc(D.title)}" style="font:900 1.5rem Fredoka,sans-serif;padding:8px 12px;border:4px solid var(--ink);border-radius:14px;text-align:center"><div id="ls" class="it-ed"></div><div class="row" style="justify-content:center"><button class="btn green" id="ad">➕ Add a step</button></div></div>`;
 $('ti').oninput=()=>{D.title=$('ti').value;save()};$('ad').onclick=()=>{if(D.steps.length<12){D.steps.push({e:'⭐',t:'',x:''});save();list();$('ls').lastElementChild.querySelector('input').focus()}};list()}
function list(){$('ls').innerHTML=D.steps.map((s,i)=>`<div class="it-step" data-i="${i}" style="--sc:${SC[i%8]}"><span class="n">${i+1}</span><button class="e" data-pick="${i}">${s.img?'🖼️':s.e}</button><div><input data-f="t" placeholder="Step name" value="${Kit.esc(s.t)}"><textarea data-f="x" rows="2" placeholder="What happens">${Kit.esc(s.x)}</textarea><label class="btn white small" style="cursor:pointer">📷 ${s.img?'Change':'Add'} a picture<input type="file" accept="image/*" data-img="${i}" hidden></label>${s.img?` <button class="btn white small" data-noimg="${i}">✖ picture</button>`:''}</div><div class="tools"><button class="btn white small" data-up="${i}" ${i?'':'disabled'}>⬆</button><button class="btn white small" data-dn="${i}" ${i<D.steps.length-1?'':'disabled'}>⬇</button><button class="btn white small" data-del="${i}">🗑️</button></div></div>`).join('');window.__t={tab,steps:D.steps.length}}
$('bd').addEventListener('input',e=>{const f=e.target.dataset.f,b=e.target.closest('[data-i]');if(f&&b){D.steps[+b.dataset.i][f]=e.target.value;save()}});
$('bd').addEventListener('change',e=>{const i=e.target.dataset.img;if(i==null)return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,480/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.steps[+i].img=c.toDataURL('image/jpeg',.82);try{save()}catch(err){alert('That picture is too big to save.');delete D.steps[+i].img}list()};im.src=r.result};r.readAsDataURL(f)});
$('bd').addEventListener('click',e=>{const d=e.target.closest('[data-up],[data-dn],[data-del],[data-pick],[data-noimg]');document.querySelectorAll('.it-pick').forEach(p=>{if(!e.target.closest('.it-pick'))p.remove()});if(!d)return;const ds=d.dataset;
 if(ds.up){const i=+ds.up;[D.steps[i-1],D.steps[i]]=[D.steps[i],D.steps[i-1]]}if(ds.dn){const i=+ds.dn;[D.steps[i+1],D.steps[i]]=[D.steps[i],D.steps[i+1]]}if(ds.del)D.steps.splice(+ds.del,1);if(ds.noimg)delete D.steps[+ds.noimg].img;
 if(ds.pick){const r=d.getBoundingClientRect(),p=document.createElement('div');p.className='it-pick';p.style.left=Math.min(innerWidth-300,r.left)+'px';p.style.top=Math.max(4,Math.min(innerHeight-190,r.bottom+4))+'px';p.innerHTML=EMO.map(x=>`<button data-em="${x}">${x}</button>`).join('');document.body.appendChild(p);p.onclick=ev=>{const b=ev.target.closest('[data-em]');if(b){D.steps[+ds.pick].e=b.dataset.em;delete D.steps[+ds.pick].img;save();p.remove();list()}};return}
 save();list()});
function show(){const n=D.steps.length;if(!n){$('bd').innerHTML='<div class="it-show">Add some steps first!</div>';return}cur=Math.min(cur,n-1);const s=D.steps[cur],pct=n>1?cur/(n-1)*100:0;
 $('bd').innerHTML=`<div class="it-show"><h2 style="margin:0;text-align:center">${Kit.esc(D.title)}</h2><div class="it-track"><div class="ln"></div><div class="fill" style="width:${pct}%"></div>${D.steps.map((x,i)=>`<div class="dot ${i<cur?'past':i===cur?'on':''}" data-go="${i}" style="left:${n>1?i/(n-1)*100:50}%">${i+1}</div>`).join('')}<div class="mk" style="left:${pct}%">🚩</div></div>
 <div class="it-big" style="--sc:${SC[cur%8]}"><div class="pic">${s.img?`<img src="${s.img}" alt="">`:s.e}</div><div><div class="k">Step ${cur+1} of ${n}</div><h2>${Kit.esc(s.t)}</h2><p>${Kit.esc(s.x)}</p></div></div>
 <div class="row" style="justify-content:center;gap:8px"><button class="btn white" id="pv" ${cur?'':'disabled'}>⬅ Back</button><button class="btn white" id="ap">${auto?'⏸':'▶'} Auto-play</button><button class="btn green" id="nx" ${cur<n-1?'':'disabled'}>Next ➜</button></div></div>`;
 $('pv').onclick=()=>{cur--;show();Kit.tick()};$('nx').onclick=()=>{cur++;show();Kit.tick()};$('bd').querySelector('.it-track').onclick=e=>{const d=e.target.closest('[data-go]');if(d){cur=+d.dataset.go;show()}};
 $('ap').onclick=()=>{if(auto){clearInterval(auto);auto=0;show();return}auto=setInterval(()=>{if(cur>=D.steps.length-1){clearInterval(auto);auto=0;show();Kit.tada();return}cur++;show()},window.__fast?50:4000);show()};
 window.__t={tab,cur,n}}
function quiz(){const n=D.steps.length;if(n<3){$('bd').innerHTML='<div class="it-show">Add at least 3 steps to make a quiz.</div>';return}let o;do o=Kit.shuffle([...Array(n).keys()]);while(o.every((v,i)=>v===i));Q={o,sel:null,checked:false};qdraw()}
function qdraw(){$('bd').innerHTML=`<div class="it-quiz"><h2 style="margin:0;text-align:center;color:#fff;text-shadow:2px 2px 0 var(--ink)">🧩 ${Kit.esc(D.title)}: put the steps in order</h2><div style="text-align:center;color:#fff;font-weight:800;text-shadow:1px 1px 0 var(--ink)">Tap one step, then another, to swap them.</div>${Q.o.map((k,i)=>{const s=D.steps[k];return `<div class="it-q ${Q.sel===i?'sel':''} ${Q.checked?(k===i?'ok':'bad'):''}" data-q="${i}"><b>${i+1}.</b><span>${s.img?'🖼️':s.e}</span>${Kit.esc(s.t)}</div>`}).join('')}<div class="row" style="justify-content:center;gap:8px"><button class="btn green" id="ck">✓ Check</button><button class="btn white" id="mx">🔀 Mix again</button></div><div id="qr" style="text-align:center;color:#fff;font-weight:900;font-size:1.3rem;text-shadow:2px 2px 0 var(--ink)"></div></div>`;
 $('bd').querySelector('.it-quiz').onclick=e=>{const q=e.target.closest('[data-q]');if(!q)return;const i=+q.dataset.q;Q.checked=false;if(Q.sel==null)Q.sel=i;else{[Q.o[Q.sel],Q.o[i]]=[Q.o[i],Q.o[Q.sel]];Q.sel=null;Kit.tick()}qdraw()};
 $('ck').onclick=()=>{Q.checked=true;Q.sel=null;const right=Q.o.filter((k,i)=>k===i).length;qdraw();$('qr').textContent=right===Q.o.length?'🎉 Perfect order!':`${right} of ${Q.o.length} in the right spot. Keep swapping!`;right===Q.o.length?(Kit.tada(),Kit.confetti(70)):Kit.tone(260,.2,'triangle',.12);window.__t.solved=right===Q.o.length};$('mx').onclick=quiz;window.__t={tab,order:[...Q.o]}}
function tabs(){clearInterval(auto);auto=0;document.querySelectorAll('[data-t]').forEach(b=>b.className='btn '+(b.dataset.t===tab?'':'white'));({edit,show,quiz})[tab]()}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;tabs()});
$('tp').onchange=()=>{const k=$('tp').value;if(k&&(confirm('Replace your timeline with this example?'))){D={title:TPL[k][0].replace(/^\S+\s/,''),steps:TPL[k][1].map(s=>({e:s[0],t:s[1],x:s[2]}))};cur=0;save();tabs()}$('tp').value=''};
window.__i={swap:(a,b)=>{[Q.o[a],Q.o[b]]=[Q.o[b],Q.o[a]];qdraw()},order:()=>Q.o};
tabs();
</script>
</body></html>
