<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Story Character Builder</title>
<style>
main{max-width:1600px}
.sc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
@media (max-width:900px){.sc{grid-template-columns:minmax(0,1fr)}}
.sc-card{background:linear-gradient(var(--bg1),var(--bg2));border:6px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:16px;display:grid;gap:10px;justify-items:center;text-align:center}
.sc-fig{position:relative;width:min(260px,70vw);aspect-ratio:1;display:grid;place-items:center}
.sc-fig .body{font-size:min(170px,46vw);line-height:1}
.sc-fig .hat{position:absolute;top:-6%;left:50%;transform:translateX(-50%) rotate(var(--r,0deg));font-size:min(90px,24vw);line-height:1}
.sc-fig .item{position:absolute;bottom:4%;right:-2%;font-size:min(80px,22vw);line-height:1;transform:rotate(-12deg)}
.sc-fig .pet{position:absolute;bottom:2%;left:-4%;font-size:min(70px,19vw);line-height:1}
.sc-fig .fx{position:absolute;top:6%;right:0;font-size:min(56px,15vw);animation:bob 1.2s infinite alternate}@keyframes bob{to{transform:translateY(-8px)}}
.sc-name{font:900 clamp(1.6rem,4vw,2.4rem) Fredoka,sans-serif;border:0;background:transparent;text-align:center;width:100%;color:var(--ink)}
.sc-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.sc-tags span{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:2px 10px;font-weight:800}
.sc-facts{background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:700;text-align:left;width:100%;display:grid;gap:3px}
.sc-p{background:#fff;border:5px solid var(--ink);border-radius:22px;padding:12px;display:grid;gap:10px}
.sc-row b{display:block;margin-bottom:4px}
.sc-opts{display:flex;flex-wrap:wrap;gap:5px}
.sc-opts button{font:inherit;font-size:1.7rem;width:52px;height:52px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;padding:0}
.sc-opts button.on{background:var(--sun);transform:translateY(-3px)}
.sc-opts.w button{width:auto;font-size:1rem;font-weight:800;padding:0 10px;height:40px;color:var(--ink)}
.sc-bgs button{width:40px;height:40px;border-radius:50%;background:linear-gradient(var(--a),var(--b))}
.sc-story{background:#FFFDF2;border:4px dashed var(--ink);border-radius:16px;padding:12px;font-weight:700;font-size:1.15rem;line-height:1.5}
.sc-gal{display:flex;flex-wrap:wrap;gap:6px}.sc-gal button{border:3px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;font:inherit;font-weight:800;padding:3px 8px}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🧸", "Story Character Builder");
const $=id=>document.getElementById(id);
const O={body:['🐻','🐰','🦊','🐱','🐶','🐸','🦁','🐼','🐲','🦄','🤖','👽','🐧','🐙','🦖','🧒','👧','👦','🧙','🧚'],hat:['','👑','🎩','🧢','⛑️','🎓','👒','🪖','🎀','🌸','🦴'],item:['','🪄','⚔️','🎈','📚','🔦','🍦','🎸','🗺️','🔑','🛡️','🍪'],pet:['','🐌','🐦','🐛','🐭','🐢','🦋','🐞','🐠'],fx:['','✨','⭐','💖','⚡','🔥','❄️','🌈','💤']};
const TRAITS=['brave','shy','silly','kind','curious','clever','grumpy','helpful','sneaky','cheerful','bossy','gentle','fast','sleepy'];
const LIKES=['pancakes','rainy days','solving puzzles','dancing','collecting rocks','telling jokes','space','music','reading','climbing trees'];
const FEARS=['the dark','loud noises','spiders','being alone','heights','thunderstorms','getting lost','bath time'];
const WHERE=['a castle in the clouds','a busy city','a deep, dark forest','an underwater village','a tiny island','outer space','a magic school','a snowy mountain'];
const BGS=[['#FFE29A','#FFB347'],['#BFE8FF','#7FC8F8'],['#D6F5D0','#8FD694'],['#F3D9FF','#C79BF2'],['#FFD6E0','#FF9FB8'],['#E3E8F2','#B8C2D6']];
let C=Kit.get('sc-char',null)||{name:'Pip',body:'🦊',hat:'👑',item:'🪄',pet:'🐌',fx:'✨',traits:['brave','silly'],like:'pancakes',fear:'the dark',where:'a deep, dark forest',bg:0},gal=Kit.get('sc-gal',[]),story='';
function save(){Kit.set('sc-char',C)}
document.querySelector('main').innerHTML=`<div class="sc"><div class="sc-card" id="cd"></div><div class="sc-p" id="ed"></div></div>`;
function a(n){return /^[aeiou]/i.test(n)?'an':'a'}
function makeStory(){const t=C.traits,he='they';const starts=[`Once upon a time, in ${C.where}, there lived ${a(t[0]||'')} ${t[0]||''} little ${nameOf(C.body)} named ${C.name}.`,`${C.name} was ${t.join(' and ')||'a very interesting'} and loved ${C.like} more than anything.`];
 const problems=[`One day, ${C.name} heard a strange sound coming from ${Kit.pick(['behind the old door','the tallest tree','under the bridge','the top of the hill'])}.`,`But ${C.name} was afraid of ${C.fear}, and the path was full of it!`,`One morning, ${C.name}'s ${C.item?nameOf(C.item):'favorite thing'} went missing!`];
 const help=C.pet?`Luckily, ${C.name}'s friend the ${nameOf(C.pet)} came along to help.`:'';story=`${starts[0]} ${starts[1]} ${Kit.pick(problems)} ${help} What will ${C.name} do next? ✏️`;draw()}
function nameOf(e){return {'🐻':'bear','🐰':'bunny','🦊':'fox','🐱':'cat','🐶':'puppy','🐸':'frog','🦁':'lion','🐼':'panda','🐲':'dragon','🦄':'unicorn','🤖':'robot','👽':'alien','🐧':'penguin','🐙':'octopus','🦖':'dinosaur','🧒':'kid','👧':'girl','👦':'boy','🧙':'wizard','🧚':'fairy','🪄':'magic wand','⚔️':'sword','🎈':'balloon','📚':'book','🔦':'flashlight','🍦':'ice cream','🎸':'guitar','🗺️':'map','🔑':'key','🛡️':'shield','🍪':'cookie','🐌':'snail','🐦':'bird','🐛':'caterpillar','🐭':'mouse','🐢':'turtle','🦋':'butterfly','🐞':'ladybug','🐠':'fish'}[e]||'friend'}
function draw(){const bg=BGS[C.bg];
 $('cd').style.setProperty('--bg1',bg[0]);$('cd').style.setProperty('--bg2',bg[1]);
 $('cd').innerHTML=`<div class="sc-fig"><span class="body">${C.body}</span>${C.hat?`<span class="hat">${C.hat}</span>`:''}${C.item?`<span class="item">${C.item}</span>`:''}${C.pet?`<span class="pet">${C.pet}</span>`:''}${C.fx?`<span class="fx">${C.fx}</span>`:''}</div><input class="sc-name" id="nm" value="${Kit.esc(C.name)}" aria-label="Character name"><div class="sc-tags">${C.traits.map(t=>`<span>${t}</span>`).join('')}</div><div class="sc-facts"><div>🏠 Lives in ${C.where}</div><div>💛 Loves ${C.like}</div><div>😱 Scared of ${C.fear}</div></div>${story?`<div class="sc-story">${Kit.esc(story)}</div>`:''}<div class="row" style="gap:6px;justify-content:center"><button class="btn green" id="st">📖 Story starter</button><button class="btn white small" id="rd">🎲 Surprise me</button><button class="btn white small" id="sv">💾 Save</button><button class="btn white small" id="pr">🖨️ Print</button></div>`;
 const opt=(k,list)=>`<div class="sc-row"><b>${{body:'🧍 Who?',hat:'🎩 On the head',item:'🎒 Holding',pet:'🐾 Sidekick',fx:'✨ Magic'}[k]}</b><div class="sc-opts">${list.map(e=>`<button data-k="${k}" data-v="${e}" class="${C[k]===e?'on':''}" aria-label="${e||'none'}">${e||'🚫'}</button>`).join('')}</div></div>`;
 const words=(k,list,multi)=>`<div class="sc-row"><b>${{traits:'💭 Personality (pick 2)',like:'💛 Loves',fear:'😱 Scared of',where:'🏠 Lives in'}[k]}</b><div class="sc-opts w">${list.map(w=>`<button data-w="${k}" data-v="${w}" class="${(multi?C[k].includes(w):C[k]===w)?'on':''}">${w}</button>`).join('')}</div></div>`;
 $('ed').innerHTML=opt('body',O.body)+opt('hat',O.hat)+opt('item',O.item)+opt('pet',O.pet)+opt('fx',O.fx)+`<div class="sc-row"><b>🎨 Card color</b><div class="sc-opts sc-bgs">${BGS.map((b,i)=>`<button data-bg="${i}" class="${C.bg===i?'on':''}" style="--a:${b[0]};--b:${b[1]}" aria-label="Color ${i+1}"></button>`).join('')}</div></div>`+words('traits',TRAITS,true)+words('like',LIKES)+words('fear',FEARS)+words('where',WHERE)+`<div class="sc-row"><b>📚 Saved characters</b><div class="sc-gal">${gal.map((g,i)=>`<button data-g="${i}">${g.body} ${Kit.esc(g.name)}</button>`).join('')||'<span class="muted">None yet.</span>'}</div></div>`;
 $('nm').oninput=()=>{C.name=$('nm').value||'Pip';save();window.__t.name=C.name};$('st').onclick=()=>{makeStory();Kit.ding()};$('rd').onclick=()=>{for(const k in O)C[k]=Kit.pick(O[k].filter(Boolean));C.traits=Kit.shuffle(TRAITS).slice(0,2);C.like=Kit.pick(LIKES);C.fear=Kit.pick(FEARS);C.where=Kit.pick(WHERE);C.bg=Kit.rand(0,BGS.length-1);C.name=Kit.pick(['Pip','Zuzu','Max','Luna','Bo','Ziggy','Nova','Taco','Mimi','Rex']);story='';save();Kit.tada();draw()};
 $('sv').onclick=()=>{gal.unshift({...C,traits:[...C.traits]});gal=gal.slice(0,12);Kit.set('sc-gal',gal);Kit.ding();draw()};$('pr').onclick=()=>window.print();
 window.__t={...C,story,gal:gal.length}}
$('ed').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.k){C[b.dataset.k]=b.dataset.v;Kit.tick()}
 if(b.dataset.w){const k=b.dataset.w,v=b.dataset.v;if(k==='traits'){C.traits=C.traits.includes(v)?C.traits.filter(x=>x!==v):[...C.traits,v].slice(-2)}else C[k]=v;Kit.tick()}
 if(b.dataset.bg){C.bg=+b.dataset.bg}if(b.dataset.g){C={...gal[+b.dataset.g]};story=''}save();draw()};
draw();
</script>
</body></html>
