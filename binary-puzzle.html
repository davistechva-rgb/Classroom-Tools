<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Binary Puzzle</title>
<style>
main{max-width:1400px}
.bp-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
.bp-goal{text-align:center;color:#fff;font-weight:900;font-size:clamp(1.4rem,4vw,2.4rem);text-shadow:3px 3px 0 var(--ink);margin-bottom:12px}
.bp-goal b{display:inline-block;background:var(--sun);color:var(--ink);text-shadow:none;border:5px solid var(--ink);border-radius:16px;padding:0 16px;min-width:2.5em}
.bp-cards{display:flex;gap:clamp(4px,1vw,10px);justify-content:center;flex-wrap:wrap}
.bp-c{width:clamp(54px,10vw,130px);aspect-ratio:3/4;border:5px solid var(--ink);border-radius:16px;cursor:pointer;position:relative;perspective:600px;background:transparent;padding:0}
.bp-c .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.bp-c.on .in{transform:rotateY(180deg)}
.bp-c .fr,.bp-c .bk{position:absolute;inset:0;border-radius:11px;backface-visibility:hidden;display:grid;place-items:center;align-content:center;gap:4px}
.bp-c .fr{background:#2B3A67;color:#fff;font-weight:900;font-size:2rem}
.bp-c .bk{background:#FFFDF6;transform:rotateY(180deg)}
.bp-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;padding:6px;max-width:90%}
.bp-dots i{width:clamp(5px,1vw,10px);aspect-ratio:1;border-radius:50%;background:#E5533F}
.bp-c .val{font-weight:900;font-size:1.2rem;color:var(--ink)}
.bp-bit{text-align:center;font-weight:900;font-size:1.6rem;color:#fff;text-shadow:2px 2px 0 var(--ink);margin-top:4px}
.bp-col{display:grid;justify-items:center}
.bp-sum{text-align:center;margin-top:14px;font-weight:900;font-size:1.4rem;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.bp-sum span{background:#fff;color:var(--ink);text-shadow:none;border:4px solid var(--ink);border-radius:14px;padding:4px 14px;display:inline-block}
.bp-msg{text-align:center;font-weight:800;font-size:1.2rem;color:#fff;text-shadow:2px 2px 0 var(--ink);min-height:1.6em;margin-top:10px}
.bp-read{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.bp-read button{font:inherit;font-weight:900;font-size:1.4rem;border:4px solid var(--ink);border-radius:14px;padding:8px 16px;background:#fff;cursor:pointer;min-width:70px;color:var(--ink)}
.bp-read button.yes{background:#8BE09A}.bp-read button.no{background:#FFB3AA}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🔢", "Binary Puzzle");
const $=id=>document.getElementById(id);
let bits=5,on=[],goal=0,mode='make',score=0,teams=null,t0=0,count=0,lock=false;
document.querySelector('main').innerHTML=`<div class="bp-top"><button class="btn" data-m="make">🃏 Make the number</button><button class="btn white" data-m="read">👀 Read the number</button><button class="btn white" data-m="count">⏱️ Count up!</button><select id="bt" style="width:auto"><option value="4">4 cards (0–15)</option><option value="5" selected>5 cards (0–31)</option><option value="6">6 cards (0–63)</option><option value="8">8 cards (0–255)</option></select>${Learn.teamPicker('tp',0)}<span class="ln-pill">⭐ <b id="sc">0</b></span></div><div id="tm"></div>
<div class="bp-goal" id="gl"></div><div class="bp-cards" id="cs"></div><div class="bp-sum" id="sm"></div><div class="bp-read" id="rd"></div><div class="bp-msg" id="msg"></div>`;
const val=()=>on.reduce((s,v,i)=>s+(v?1<<(bits-1-i):0),0);
function cards(tap=true){$('cs').innerHTML=on.map((v,i)=>{const p=1<<(bits-1-i);return `<div class="bp-col"><button class="bp-c ${v?'on':''}" data-i="${i}" ${tap?'':'disabled'}><div class="in"><div class="fr">?</div><div class="bk"><div class="bp-dots">${'<i></i>'.repeat(Math.min(p,64))}</div><div class="val">${p}</div></div></div></button><div class="bp-bit">${v?1:0}</div></div>`}).join('')}
function sum(show=true){const ps=on.map((v,i)=>v?1<<(bits-1-i):0).filter(Boolean);$('sm').innerHTML=`Binary <span>${on.map(v=>v?1:0).join('')}</span> = ${show?`<span>${ps.length?ps.join(' + '):'0'} = ${val()}</span>`:'<span>?</span>'}`}
function round(){lock=false;bits=+$('bt').value;on=Array(bits).fill(false);const max=(1<<bits)-1;
 if(mode==='make'){do goal=Kit.rand(1,max);while(goal===val());$('gl').innerHTML=`Flip cards to show <b>${goal}</b>`;cards();sum();$('rd').innerHTML='';$('msg').textContent='Each card has double the dots of the card on its right. Face up = 1, face down = 0.'}
 else if(mode==='read'){goal=Kit.rand(1,max);on=on.map((_,i)=>!!(goal>>(bits-1-i)&1));$('gl').innerHTML='What number is this?';cards(false);sum(false);
  const opts=Kit.shuffle([...new Set([goal,goal^1,goal^(1<<Kit.rand(1,bits-1)),Math.min(max,goal+Kit.rand(1,4)),Math.max(0,goal-Kit.rand(1,4))])]).filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);if(!opts.includes(goal))opts[0]=goal;
  $('rd').innerHTML=Kit.shuffle(opts).map(o=>`<button data-a="${o}">${o}</button>`).join('');$('msg').textContent='Add up the dots on the face-up cards.'}
 else{count=0;t0=0;$('gl').innerHTML=`Count from <b>0</b> to <b id="cg">${Math.min(15,max)}</b> as fast as you can!`;goal=0;cards();sum();$('rd').innerHTML='';$('msg').textContent='Show 1, then 2, then 3… The timer starts on your first flip.'}
 window.__t={goal,mode,score,val:val()}}
function check(){if(lock)return;const v=val();sum();
 if(mode==='make'&&v===goal){lock=true;score++;$('sc').textContent=score;if(teams){teams.add(1);teams.next()}Kit.tada();$('msg').textContent=`🎉 ${on.map(x=>x?1:0).join('')} is ${goal} in binary!`;setTimeout(round,1600)}
 if(mode==='count'){const target=Math.min(15,(1<<bits)-1);if(v===count+1){count++;Kit.ding();$('gl').innerHTML=`Now show <b>${count+1>target?'🏁':count+1}</b>`;if(count>=target){lock=true;const s=((Date.now()-t0)/1000).toFixed(1);score++;$('sc').textContent=score;const best=Kit.get('bp-best-'+bits,null);if(!best||+s<best)Kit.set('bp-best-'+bits,+s);$('msg').textContent=`🏁 Counted to ${target} in ${s} seconds!${best?` Best: ${Math.min(best,+s)}s`:''}`;Kit.tada();Kit.confetti(60)}}}
 window.__t={...window.__t,val:v,count,score}}
$('cs').onclick=e=>{const c=e.target.closest('[data-i]');if(!c||lock||mode==='read')return;if(mode==='count'&&!t0)t0=Date.now();const i=+c.dataset.i;on[i]=!on[i];c.classList.toggle('on',on[i]);c.nextElementSibling.textContent=on[i]?1:0;Kit.tone(300+(bits-i)*80,.06,'triangle',.12);check()};
$('rd').onclick=e=>{const b=e.target.closest('[data-a]');if(!b||lock)return;lock=true;if(+b.dataset.a===goal){b.classList.add('yes');score++;$('sc').textContent=score;if(teams)teams.add(1);Kit.ding()}else{b.classList.add('no');[...$('rd').children].find(x=>+x.dataset.a===goal).classList.add('yes');Kit.tone(200,.2,'triangle',.15)}if(teams)teams.next();
 document.querySelectorAll('.bp-c').forEach(c=>c.classList.add('on'));on=on.map((_,i)=>!!(goal>>(bits-1-i)&1));cards(false);sum(true);setTimeout(round,1800)};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.className='btn '+(x.dataset.m===mode?'':'white'));round()});
$('bt').onchange=round;$('tp').onchange=()=>{const n=+$('tp').value;teams=n?Learn.teams($('tm'),n,{turns:true}):($('tm').innerHTML='',null);score=0;$('sc').textContent=0;round()};
window.__p={set:v=>{on=on.map((_,i)=>!!(v>>(bits-1-i)&1));cards();check()},flip:i=>$('cs').querySelectorAll('[data-i]')[i].click()};
round();
</script>
</body></html>
