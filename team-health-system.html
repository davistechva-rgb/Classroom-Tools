<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Team Health System</title>
<style>
main{max-width:1700px}
.th-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.th-teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.th-t{background:#fff;border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:12px;display:grid;gap:8px;text-align:center;position:relative;border-top:18px solid var(--tc)}
.th-t.hit{animation:hit .4s}@keyframes hit{20%{transform:translateX(-10px) rotate(-2deg);background:#FFD3CC}60%{transform:translateX(8px)}}
.th-t.heal{animation:heal .6s}@keyframes heal{40%{background:#C8F3D0;transform:scale(1.03)}}
.th-t.ko{background:#E3E8F2}.th-t.ko .mas{filter:grayscale(1)}
.th-t .mas{font-size:3.6rem;line-height:1}
.th-t input{font:900 1.3rem Fredoka,sans-serif;text-align:center;border:0;width:100%;color:var(--ink);background:transparent}
.th-hearts{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:clamp(1.3rem,2.6vw,1.8rem);min-height:2.4rem}
.th-hearts span.e{opacity:.25;filter:grayscale(1)}
.th-sh{position:absolute;top:8px;right:10px;font-size:2rem;animation:bob 1s infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}
.th-ac{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.th-ac button{font:inherit;font-weight:900;font-size:1.3rem;border:3px solid var(--ink);border-radius:12px;padding:6px 2px;background:var(--bc);cursor:pointer}
.th-ko{font-weight:900;color:#E5533F}
.th-log{background:#fff;border:5px solid var(--ink);border-radius:18px;padding:10px;margin-top:14px;max-height:170px;overflow:auto;font-weight:700;display:grid;gap:3px}
.th-boss{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:860px){.th-boss{grid-template-columns:minmax(0,1fr)}}
.th-arena{background:radial-gradient(circle at 50% 40%,#5B3B8F,#141C3A);border:6px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);padding:16px;color:#fff;text-align:center;display:grid;gap:10px}
.th-arena .mon{font-size:clamp(6rem,16vw,10rem);line-height:1;transition:transform .2s}
.th-arena .mon.hurt{animation:hit .4s;filter:brightness(2)}
.th-hp{height:28px;border:4px solid #fff;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}.th-hp i{display:block;height:100%;background:linear-gradient(90deg,#E5533F,#FF9F43);transition:width .5s}
.th-hp.us i{background:linear-gradient(90deg,#5DC66E,#22C3E6)}
.th-dmg{position:fixed;font-weight:900;font-size:2.4rem;pointer-events:none;z-index:60;animation:fl 1s forwards;text-shadow:3px 3px 0 #000}@keyframes fl{to{transform:translateY(-80px);opacity:0}}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("❤️", "Team Health System");
const $=id=>document.getElementById(id);
const MAS=['🦁','🐯','🦊','🐼','🐸','🦄','🐙','🦖'],TC=['#E5533F','#1E7FD0','#5DC66E','#9B6BF2','#FF9F43','#FF6B9A'];
const BOSSES=[['🐉','Homework Dragon'],['👾','Noise Monster'],['🧟','Messy Desk Zombie'],['🦑','Distraction Kraken'],['🤖','Robot of Forgetting']];
const POW=[['💖💖','Double heal!',(t)=>{t.hp=Math.min(t.max,t.hp+2)}],['🛡️','Free shield!',(t)=>{t.sh=true}],['❤️‍🔥','Full health!',(t)=>{t.hp=t.max}],['🧲','Steal a heart from the healthiest team!',(t,all)=>{const r=all.filter(x=>x!==t&&x.hp>0).sort((a,b)=>b.hp-a.hp)[0];if(r){r.hp--;t.hp=Math.min(t.max,t.hp+1)}}],['🍀','Lucky! +1 heart',(t)=>{t.hp=Math.min(t.max,t.hp+1)}]];
let S=Kit.get('th-state',null)||{n:4,max:10,teams:[],log:[],boss:{b:0,hp:50,max:50,us:20,usMax:20}},tab='teams';
function fix(){while(S.teams.length<S.n)S.teams.push({name:`Team ${S.teams.length+1}`,m:MAS[S.teams.length%8],hp:S.max,max:S.max,sh:false});S.teams=S.teams.slice(0,S.n)}
function save(){Kit.set('th-state',S)}
function log(t){S.log.unshift(`${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · ${t}`);S.log=S.log.slice(0,50)}
document.querySelector('main').innerHTML=`<div class="th-tabs"><button class="btn" data-t="teams">❤️ Team hearts</button><button class="btn white" data-t="boss">🐉 Boss battle</button><select id="tn" style="width:auto">${[2,3,4,5,6].map(n=>`<option value="${n}">${n} teams</option>`).join('')}</select><select id="mx" style="width:auto">${[5,10,15].map(n=>`<option value="${n}">${n} hearts</option>`).join('')}</select><button class="btn white small" id="rs">🔄 Full health for all</button></div><div id="bd"></div><div class="th-log" id="lg"></div>`;
function fly(el,t,c){const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='th-dmg';d.textContent=t;d.style.color=c;d.style.left=(r.left+r.width/2-30)+'px';d.style.top=(r.top+40)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function teams(){fix();$('bd').innerHTML=`<div class="th-teams">${S.teams.map((t,i)=>`<div class="th-t ${t.hp<=0?'ko':''}" data-i="${i}" style="--tc:${TC[i%6]}">${t.sh?'<span class="th-sh">🛡️</span>':''}<div class="mas">${t.hp<=0?'😵':t.m}</div><input value="${Kit.esc(t.name)}" data-n="${i}" aria-label="Team name"><div class="th-hearts">${Array.from({length:t.max},(_,k)=>`<span class="${k<t.hp?'':'e'}">${k<t.hp?(t.hp<=Math.ceil(t.max*.3)?'💛':'❤️'):'🖤'}</span>`).join('')}</div>
 ${t.hp<=0?`<div class="th-ko">💀 Knocked out!</div><button class="btn green" data-rv="${i}">✨ Revive (3 hearts)</button>`:`<div class="th-ac"><button data-a="hit" style="--bc:#FFD3CC" title="Lose a heart">💔</button><button data-a="heal" style="--bc:#C8F3D0" title="Gain a heart">❤️</button><button data-a="shield" style="--bc:#D6E9FF" title="Shield">🛡️</button><button data-a="pow" style="--bc:#FFF1A8" title="Power-up">⚡</button></div>`}</div>`).join('')}</div>`;
 $('bd').querySelector('.th-teams').onclick=e=>{const c=e.target.closest('[data-i]');if(!c)return;const i=+c.dataset.i,t=S.teams[i],a=e.target.closest('[data-a]'),rv=e.target.closest('[data-rv]');
  if(rv){t.hp=3;log(`✨ ${t.name} was revived!`);Kit.tada();save();teams();return}if(!a)return;const act=a.dataset.a;
  if(act==='hit'){if(t.sh){t.sh=false;log(`🛡️ ${t.name}'s shield blocked a hit!`);Kit.tone(500,.15,'square',.1);fly(c,'🛡️ Blocked!','#22C3E6')}else{t.hp=Math.max(0,t.hp-1);log(`💔 ${t.name} lost a heart.`);Kit.tone(160,.25,'sawtooth',.1);fly(c,'−1 ❤️','#E5533F');if(t.hp<=0){log(`💀 ${t.name} was knocked out!`);Kit.alarm&&Kit.alarm()}}save();teams();$('bd').querySelector(`[data-i="${i}"]`).classList.add('hit')}
  if(act==='heal'){if(t.hp<t.max){t.hp++;log(`❤️ ${t.name} gained a heart.`);Kit.ding();fly(c,'+1 ❤️','#5DC66E')}save();teams();$('bd').querySelector(`[data-i="${i}"]`).classList.add('heal')}
  if(act==='shield'){t.sh=true;log(`🛡️ ${t.name} has a shield.`);Kit.tick();save();teams()}
  if(act==='pow'){const p=Kit.pick(POW);p[2](t,S.teams);log(`⚡ ${t.name}: ${p[1]}`);Kit.tada();fly(c,p[0],'#FFC93C');save();teams()}};
 $('bd').querySelectorAll('[data-n]').forEach(n=>n.oninput=()=>{S.teams[+n.dataset.n].name=n.value;save()});window.__t={tab,hp:S.teams.map(t=>t.hp),sh:S.teams.map(t=>t.sh)}}
function boss(){const B=S.boss,bs=BOSSES[B.b%BOSSES.length];$('bd').innerHTML=`<div class="th-boss"><div class="th-arena"><div style="font-weight:900;font-size:1.4rem">${bs[1]}</div><div class="mon" id="mon">${B.hp<=0?'💥':bs[0]}</div><div class="th-hp"><i style="width:${B.hp/B.max*100}%"></i></div><div style="font-weight:900">👹 ${B.hp} / ${B.max}</div>
 <div class="row" style="justify-content:center;gap:6px">${B.hp>0?'<button class="btn green" data-b="1">⚔️ Attack (−1)</button><button class="btn green" data-b="5">💥 Big attack (−5)</button>':'<button class="btn" style="background:var(--sun)" id="nb">🐉 Next boss</button>'}</div></div>
 <div class="th-arena" style="background:radial-gradient(circle at 50% 40%,#2E7D4F,#123524)"><div style="font-weight:900;font-size:1.4rem">🏫 Our class</div><div class="mon">${B.us<=0?'😵':'🧑‍🤝‍🧑'}</div><div class="th-hp us"><i style="width:${B.us/B.usMax*100}%"></i></div><div style="font-weight:900">💚 ${B.us} / ${B.usMax}</div>
 <div class="row" style="justify-content:center;gap:6px">${B.us>0?'<button class="btn white" data-u="-2">👹 Boss attacks (−2)</button><button class="btn white" data-u="2">💚 Heal (+2)</button>':'<button class="btn white" id="ru">✨ Try again</button>'}</div><div style="font-weight:700">⚔️ Attack when the class works hard. 👹 The boss attacks when things go off track!</div></div></div>`;
 $('bd').querySelector('.th-boss').onclick=e=>{const a=e.target.closest('[data-b]'),u=e.target.closest('[data-u]');
  if(a){const d=+a.dataset.b;B.hp=Math.max(0,B.hp-d);fly($('mon'),`−${d}`,'#FFD84D');Kit.tone(220,.12,'square',.12);log(`⚔️ The class hit ${bs[1]} for ${d}!`);if(B.hp<=0){log(`🏆 The class defeated ${bs[1]}!`);Kit.tada();Kit.confetti(150)}save();boss();$('mon').classList.add('hurt')}
  if(u){const d=+u.dataset.u;B.us=Math.max(0,Math.min(B.usMax,B.us+d));log(d<0?`👹 ${bs[1]} attacked the class!`:'💚 The class healed.');d<0?Kit.tone(140,.3,'sawtooth',.1):Kit.ding();save();boss()}
  if(e.target.id==='nb'){B.b++;B.max+=10;B.hp=B.max;B.us=B.usMax;save();boss()}if(e.target.id==='ru'){B.us=B.usMax;B.hp=B.max;save();boss()}};window.__t={tab,boss:B.hp,us:B.us}}
function draw(){document.querySelectorAll('[data-t]').forEach(b=>b.className='btn '+(b.dataset.t===tab?'':'white'));$('tn').value=S.n;$('mx').value=S.max;$('tn').hidden=$('mx').hidden=tab!=='teams';tab==='teams'?teams():boss();$('lg').innerHTML=S.log.map(l=>`<div>${Kit.esc(l)}</div>`).join('')||'<div>📜 The battle log will show up here.</div>'}
const orig=save;save=()=>{orig();$('lg').innerHTML=S.log.map(l=>`<div>${Kit.esc(l)}</div>`).join('')};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
$('tn').onchange=()=>{S.n=+$('tn').value;fix();save();draw()};$('mx').onchange=()=>{S.max=+$('mx').value;S.teams.forEach(t=>{t.max=S.max;t.hp=Math.min(t.hp,S.max)});save();draw()};
$('rs').onclick=()=>{S.teams.forEach(t=>{t.hp=t.max;t.sh=false});log('🔄 Everyone is back to full health.');save();draw()};
draw();
</script>
</body></html>
