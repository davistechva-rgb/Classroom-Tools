<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Mountain Climb</title>
<style>.dice-pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:55;background:#fff;border:5px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:10px 24px;text-align:center;font-weight:800;pointer-events:none}
.dice-pop .d{font-size:4rem;line-height:1}
.peak{position:relative;border:5px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;height:min(64vh,600px);background:linear-gradient(#A5D8FF,#E7F5FF)}
.peak svg{position:absolute;inset:0;width:100%;height:100%}
.climber{position:absolute;transform:translate(-50%,-80%);font-size:clamp(1.4rem,4vh,2.2rem);transition:left .5s ease,top .5s ease;z-index:3;text-align:center;line-height:1}
.climber b{display:block;font-size:.38em;border:2px solid var(--ink);border-radius:99px;padding:0 4px;color:var(--ink);white-space:nowrap}
.camp{position:absolute;transform:translate(-50%,-90%);font-size:1.6rem;z-index:2}.camp small{display:block;font-size:.45em;font-weight:800;background:#fff;border-radius:99px;padding:0 4px;text-align:center}
.snow{position:absolute;top:-10px;color:#fff;font-size:1.2rem;animation:snow linear infinite;z-index:4;pointer-events:none}@keyframes snow{to{transform:translateY(640px) translateX(-60px)}}
.peak.storm{animation:storm .3s 6}@keyframes storm{50%{filter:brightness(.6)}}
.tally{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}.tally span{border:3px solid var(--ink);border-radius:99px;padding:2px 12px;font-weight:700;background:#fff}
.press{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}.press .btn small{display:block;font-size:.72rem;font-weight:600}</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="play.js"></script>
<script>
Kit.mount("🏔️", "Mountain Climb");
async function rollDie(lo,hi,label){const box=document.createElement('div');box.className='dice-pop';box.innerHTML=`<div>${label||'Rolling…'}</div><div class="d">🎲</div>`;document.body.appendChild(box);
 const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];let v;for(let k=0;k<12;k++){v=Kit.rand(lo,hi);box.querySelector('.d').textContent=faces[v-1]||v;Kit.tick();await Kit.sleep(55+k*8)}
 Kit.ding();await Kit.sleep(650);box.remove();return v}
Play.setup({defTeams:3,how:'Race to the summit! Teams take turns. Answer right to start climbing: roll the die and move up. Then decide whether to 🎲 roll again to keep climbing, or ⛺ stop and keep your progress. But if you roll a ⛈️ storm, you lose everything you climbed this turn! Storms get more common near the top. ⛺ Base camps save your spot: you can never fall below a camp you reached. First team to plant their flag on the summit wins!',
start({teams,game}){
 const $=id=>document.getElementById(id);const TOP=24,CAMPS=[6,12,18];
 const M=teams.map(()=>({h:0,camp:0,storms:0,rolls:0,best:0}));
 // zig-zag path points (in % of the box)
 const path=Array.from({length:TOP+1},(_,k)=>{const row=Math.floor(k/6),pos=k%6;const dir=row%2?-1:1;const u=(pos/5)*2-1;const y=92-k*3.45;const half=40*(y-6)/94;const x=50+dir*u*half;return[x,y]}); // zig-zag that narrows toward the peak
 const d=path.map((p,k)=>(k?'L':'M')+p[0]+','+p[1]).join(' ');
 game.innerHTML=`<div class="peak" id="peak"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="0,100 50,4 100,100" fill="#8D99AE"/><polygon points="38,26 50,4 62,26 56,22 50,28 44,22" fill="#fff"/>
  <path d="${d}" fill="none" stroke="#5C4033" stroke-width=".9" stroke-dasharray="2 1.4"/></svg>
  ${CAMPS.map(c=>`<div class="camp" style="left:${path[c][0]}%;top:${path[c][1]}%">⛺<small>Camp</small></div>`).join('')}<div class="camp" style="left:${path[TOP][0]}%;top:${path[TOP][1]}%">🚩<small>Summit</small></div>
  ${teams.map((t,i)=>`<div class="climber" id="cm${i}">🧗<b style="background:${t.color}">${Kit.esc(t.name)}</b></div>`).join('')}</div>
  <div class="tally" id="tl"></div><div class="pl-msg" id="msg"></div><div id="act"></div><div id="ask"></div>`;
 const put=i=>{const p=path[M[i].h];const off=(i-(teams.length-1)/2)*3.2;$('cm'+i).style.left=(p[0]+off)+'%';$('cm'+i).style.top=p[1]+'%'};
 const tally=()=>$('tl').innerHTML=teams.map((t,i)=>`<span style="border-color:${t.color}">${Kit.esc(t.name)} · ⛰️ ${M[i].h}/${TOP} · ⛺ camp ${M[i].camp}</span>`).join('');
 teams.forEach((_,i)=>put(i));tally();
 function snow(on){$('peak').querySelectorAll('.snow').forEach(s=>s.remove());if(on){$('peak').classList.add('storm');for(let k=0;k<20;k++)$('peak').insertAdjacentHTML('beforeend',`<span class="snow" style="left:${Math.random()*110}%;animation-duration:${1+Math.random()}s">❄</span>`);setTimeout(()=>{snow(false);$('peak').classList.remove('storm')},1800)}}
 const ask2=(i,gain)=>new Promise(res=>{$('act').innerHTML=`<div class="card center"><span class="pl-turn" style="background:${teams[i].color}">${Kit.esc(teams[i].name)}</span> climbed <b>${gain}</b> this turn. Push your luck?
  <div class="press"><button class="btn red" data-p="roll">🎲 Roll again<small>${M[i].h>=CAMPS[2]?'storm on ⚀ or ⚁':'storm on ⚀'}</small></button><button class="btn green" data-p="stop">⛺ Stop and keep it</button></div></div>`;
  $('act').onclick=e=>{const b=e.target.closest('[data-p]');if(b){$('act').onclick=null;$('act').innerHTML='';res(b.dataset.p)}}});
 async function climb(i){const m=M[i];const start=m.h;let gain=0;
  while(true){const roll=await rollDie(1,6,'🎲 Climb!');m.rolls++;const stormOn=m.h>=CAMPS[2]?2:1;
   if(roll<=stormOn){m.storms++;snow(true);Kit.tone(90,.8,'sawtooth',.2);m.h=Math.max(m.camp,start);put(i);tally();Play.banner(`⛈️ Storm! ${teams[i].name} slides back${m.h>start?'':' to where they started'}`);await Kit.sleep(1200);return}
   const step=roll-stormOn;gain+=step;m.h=Math.min(TOP,m.h+step);put(i);Kit.tone(500+gain*20,.1,'triangle',.15);
   CAMPS.forEach(c=>{if(m.h>=c&&m.camp<c){m.camp=c;Play.banner(`⛺ ${teams[i].name} reached base camp ${CAMPS.indexOf(c)+1}!`)}});tally();await Kit.sleep(500);
   if(m.h>=TOP)return;if(await ask2(i,gain)==='stop'){m.best=Math.max(m.best,gain);Kit.ding();return}}}
 let turn=0;
 async function round(){const i=turn;$('msg').textContent='';const r=await Play.ask($('ask'),[i]);
  if(r.length){await climb(i);if(M[i].h>=TOP){Kit.confetti();return Play.podium('🚩',`${teams[i].name} reached the summit!`,M.map(m=>m.h),{'⛈️ Storms':M.map(m=>m.storms),'🎲 Rolls':M.map(m=>m.rolls)})}}
  else $('msg').textContent='No climbing this turn.';
  turn=(turn+1)%teams.length;setTimeout(round,1000)}
 round()}});

</script>
</body></html>
