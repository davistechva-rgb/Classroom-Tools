<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Chemical Reaction Simulator</title>
<style>
main{max-width:1500px}
.cr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.cr{grid-template-columns:1fr}}
.cr-shelf{background:#fff;border:5px solid var(--ink);border-radius:20px;padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cr-shelf h3{grid-column:1/-1;margin:0}
.cr-i{font:inherit;font-weight:700;font-size:.85rem;border:3px solid var(--ink);border-radius:14px;padding:6px 4px;background:#F4FAFF;cursor:pointer;text-align:center;color:var(--ink)}
.cr-i span{display:block;font-size:1.9rem;line-height:1.1}
.cr-i.pick{background:var(--sun);transform:scale(1.04)}
.cr-bench{background:linear-gradient(#E9F1F8 0 78%,#8A93A6 78% 82%,#B9C2D2 82%);border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:10px;text-align:center}
.cr-bench canvas{width:100%;max-width:420px;display:block;margin:0 auto}
.cr-in{display:flex;gap:8px;justify-content:center;align-items:center;min-height:52px;font-weight:800;font-size:1.1rem;flex-wrap:wrap}
.cr-in span{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:3px 12px}
.cr-p{background:#fff;border:5px solid var(--ink);border-radius:20px;padding:12px;display:grid;gap:10px}
.cr-pred{display:flex;gap:8px;flex-wrap:wrap}.cr-pred button{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;cursor:pointer;color:var(--ink);flex:1}.cr-pred button.on{background:var(--grape);color:#fff}
.cr-obs{border:4px solid var(--ink);border-radius:16px;padding:10px 12px;background:#FFF6C9;font-weight:600;min-height:5em}
.cr-signs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cr-signs div{border:3px solid var(--ink);border-radius:12px;padding:4px 8px;font-weight:700;font-size:.9rem;opacity:.35;background:#F4FAFF}.cr-signs div.on{opacity:1;background:#C9F1D2}
.cr-log{display:grid;gap:4px;max-height:200px;overflow:auto;font-weight:700;font-size:.9rem}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🧪", "Chemical Reaction Simulator");
const $=id=>document.getElementById(id);
const IN={soda:['🧂','Baking soda','#FFFFFF'],vin:['🍶','Vinegar','#F3F0D8'],milk:['🥛','Milk','#FFFFFF'],cab:['🥬','Red cabbage juice','#7A3E9D'],yeast:['🍞','Yeast','#E8D8B0'],perox:['🧴','Hydrogen peroxide','#EAF6FF'],salt:['🧂','Salt','#FFFFFF'],sugar:['🍬','Sugar','#FFFFFF'],water:['💧','Water','#CFEAFF'],oil:['🫒','Cooking oil','#E8C547'],ice:['🧊','Ice cube','#DFF4FF'],heat:['🔥','Warm hot plate','#FFB27A'],steel:['🧽','Steel wool','#9AA3B8']};
IN.soda[0]='🥄';// baking soda gets a spoon so it doesn't look like salt
// [a, b, kind, result color, effects, what you see, temperature change]
const RX=[['soda','vin','chem','#F3F0D8',{gas:1,temp:-1},'It fizzes and bubbles over! A gas (carbon dioxide) is made, and the cup feels a little colder.',-4],
 ['milk','vin','chem','#F4F1E4',{solid:1},'White lumps (curds) form and float. A new solid was made from the milk.',0],
 ['cab','vin','chem','#E25A9E',{color:1},'The purple juice turns bright pink! Cabbage juice changes color in an acid.',0],
 ['cab','soda','chem','#3BB5A0',{color:1},'The purple juice turns blue-green! Cabbage juice changes color with a base.',0],
 ['yeast','perox','chem','#FFFFFF',{gas:1,temp:1,foam:1},'A huge tower of foam grows, and it gets warm! Yeast breaks the peroxide into water and oxygen gas. (Teachers do this one with goggles!)',8],
 ['steel','vin','chem','#C9A27A',{color:1},'After a few days, the steel wool turns orange-brown. That\'s rust, a brand-new substance!',1],
 ['salt','water','phys','#CFEAFF',{dissolve:1},'The salt disappears into the water. It\'s still there (the water tastes salty), just spread out. You could get it back by letting the water dry up.',0],
 ['sugar','water','phys','#CFEAFF',{dissolve:1},'The sugar dissolves and seems to vanish, but it\'s still there. No new substance was made.',0],
 ['oil','water','phys','#CFEAFF',{layers:1},'The oil floats on top in its own layer. They don\'t mix, and nothing new is made.',0],
 ['ice','heat','phys','#CFEAFF',{melt:1},'The ice melts into water. It\'s still water, just a liquid now. Freeze it and it becomes ice again!',6]];
const SIGNS=[['gas','🫧 Bubbles of gas'],['color','🎨 Color change'],['temp','🌡️ Gets hot or cold'],['solid','🧀 A solid appears'],['foam','☁️ Foam'],['dissolve','🥄 Dissolves (physical)'],['layers','🍯 Layers (physical)'],['melt','💧 Melts (physical)']];
let pick=[],pred=null,res=null,parts=[],t=0,log=[],score={right:0,n:0},found=new Set();
document.querySelector('main').innerHTML=`<div class="cr"><div class="cr-shelf" id="sh"><h3>🧺 Ingredients <span class="muted" style="font-weight:600;font-size:.85rem">(pick two)</span></h3>${Object.entries(IN).map(([k,v])=>`<button class="cr-i" data-k="${k}"><span>${v[0]}</span>${v[1]}</button>`).join('')}</div>
<div class="cr-bench"><div class="cr-in" id="in"></div><canvas id="cv" width="420" height="440"></canvas><div class="row" style="justify-content:center"><button class="btn big green" id="mix" disabled>🥄 Mix!</button><button class="btn white" id="cl">🧽 Clean the beaker</button></div></div>
<div class="cr-p"><b>🤔 Before you mix: what will it be?</b><div class="cr-pred" id="pr"><button data-p="chem">⚗️ Chemical change<br><small>(something NEW is made)</small></button><button data-p="phys">🧊 Physical change<br><small>(same stuff, new look)</small></button></div>
<div class="cr-obs" id="obs">Pick two ingredients, make a prediction, then mix!</div><b>🔎 Signs you saw</b><div class="cr-signs" id="sg"></div><b>📓 Lab notebook <span class="muted" id="sc"></span></b><div class="cr-log" id="lg"></div></div></div>`;
const cv=$('cv'),x=cv.getContext('2d');
function find(a,b){return RX.find(r=>(r[0]===a&&r[1]===b)||(r[0]===b&&r[1]===a))}
function ui(){$('in').innerHTML=pick.length?pick.map(k=>`<span>${IN[k][0]} ${IN[k][1]}</span>`).join(' + '):'<span class="muted">Beaker is empty</span>';
 document.querySelectorAll('.cr-i').forEach(b=>b.classList.toggle('pick',pick.includes(b.dataset.k)));$('mix').disabled=pick.length<2||!pred||!!res;
 [...$('pr').children].forEach(b=>b.classList.toggle('on',b.dataset.p===pred));$('sg').innerHTML=SIGNS.map(s=>`<div class="${res&&res[4][s[0]]?'on':''}">${s[1]}</div>`).join('')}
function draw(){t++;x.clearRect(0,0,420,440);const r=res,fill=r?r[3]:pick.length?IN[pick[0]][2]:null,lvl=pick.length?(r&&r[4].foam?.55:.45):0;
 // beaker
 const bx=90,by=80,bw=240,bh=300;x.fillStyle='rgba(255,255,255,.55)';x.fillRect(bx,by,bw,bh);
 if(fill){const top=by+bh*(1-lvl);x.fillStyle=fill;x.globalAlpha=.85;x.fillRect(bx,top,bw,by+bh-top);x.globalAlpha=1;
  if(r&&r[4].layers){x.fillStyle='#E8C547';x.fillRect(bx,top,bw,40)}
  if(r&&r[4].solid){x.fillStyle='#FFFDF0';for(let k=0;k<14;k++){x.beginPath();x.arc(bx+20+(k*53)%200,top+16+(k*29)%50,10+(k%3)*3,0,7);x.fill()}}
  if(r&&r[4].melt&&t<200){x.fillStyle='rgba(223,244,255,.9)';x.fillRect(bx+90,top-30+t*.1,60*(1-t/200),40*(1-t/200))}
  if(r&&r[4].dissolve&&t<120){x.fillStyle='rgba(255,255,255,.8)';for(let k=0;k<30;k++){x.fillRect(bx+20+(k*41)%200,top+10+((k*17+t)%(bh*lvl-20)),4*(1-t/120),4*(1-t/120))}}}
 if(r&&r[4].gas){if(t%2===0)parts.push({x:bx+20+Math.random()*(bw-40),y:by+bh-10,v:1+Math.random()*2,r:3+Math.random()*6})}
 if(r&&r[4].foam&&t<260){x.fillStyle='#fff';const h=Math.min(240,t*1.3);for(let k=0;k<26;k++){x.beginPath();x.arc(bx+20+(k*37)%200,by+bh*(1-lvl)-h*((k%5)/5)+10,22,0,7);x.fill()}if(h>=200){x.beginPath();x.ellipse(210,by-40,90,60,0,0,7);x.fill()}}
 parts=parts.filter(p=>p.y>by-20);parts.forEach(p=>{p.y-=p.v;x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=2;x.beginPath();x.arc(p.x+Math.sin(p.y/10)*3,p.y,p.r,0,7);x.stroke()});
 x.strokeStyle='#1D2B53';x.lineWidth=6;x.beginPath();x.moveTo(bx-12,by-10);x.lineTo(bx,by);x.lineTo(bx,by+bh);x.lineTo(bx+bw,by+bh);x.lineTo(bx+bw,by);x.stroke();
 for(let k=1;k<5;k++){x.lineWidth=2;x.beginPath();x.moveTo(bx+bw-30,by+k*60);x.lineTo(bx+bw,by+k*60);x.stroke()}
 // thermometer
 const T=20+(r?r[6]*Math.min(1,t/120):0);x.fillStyle='#fff';x.fillRect(360,100,22,240);x.strokeRect(360,100,22,240);x.fillStyle=T>22?'#E5533F':T<18?'#2F7FD1':'#FF6B5B';const h=(T-5)/30*220;x.fillRect(364,336-h,14,h);x.beginPath();x.arc(371,348,16,0,7);x.fill();x.fillStyle='#1D2B53';x.font='800 18px system-ui';x.textAlign='center';x.fillText(T.toFixed(0)+'°C',371,90);
 requestAnimationFrame(draw)}
$('sh').onclick=e=>{const b=e.target.closest('[data-k]');if(!b||res)return;const k=b.dataset.k;pick=pick.includes(k)?pick.filter(z=>z!==k):[...pick.slice(-1),k].slice(-2);Kit.tick();ui()};
$('pr').onclick=e=>{const b=e.target.closest('[data-p]');if(!b||res)return;pred=b.dataset.p;ui()};
$('mix').onclick=()=>{const r=find(pick[0],pick[1]);t=0;parts=[];
 if(!r){res=['','','none',IN[pick[0]][2],{},`Not much happens. ${IN[pick[0]][1]} and ${IN[pick[1]][1].toLowerCase()} just sit together. No signs of a reaction!`,0];$('obs').innerHTML='🤷 '+res[5];ui();window.__t={kind:'none'};return}
 res=r;const right=pred===r[2];score.n++;if(right)score.right++;found.add(r[0]+r[1]);
 $('obs').innerHTML=`<b>${r[2]==='chem'?'⚗️ Chemical change!':'🧊 Physical change!'}</b> ${right?'✅ You predicted it!':'🤔 Not what you predicted.'}<br>${r[5]}`;
 log.unshift(`${IN[r[0]][0]} + ${IN[r[1]][0]} → ${r[2]==='chem'?'chemical':'physical'} ${right?'✅':'❌'}`);$('lg').innerHTML=log.map(l=>`<div>${l}</div>`).join('');$('sc').textContent=`(${score.right} of ${score.n} predictions right · ${found.size} of ${RX.length} found)`;
 r[2]==='chem'?Kit.tada():Kit.ding();if(found.size===RX.length)Kit.confetti(80);ui();window.__t={kind:r[2],right,found:found.size}};
$('cl').onclick=()=>{pick=[];pred=null;res=null;parts=[];$('obs').textContent='Pick two ingredients, make a prediction, then mix!';ui()};
ui();draw();
</script>
</body></html>
