<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Subtraction Practice</title>
<style>.prob{font-size:clamp(3rem,11vw,6.5rem);font-weight:700;margin:24px 0 6px;display:flex;justify-content:center;align-items:center;gap:.25em;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.box{min-width:2.2em;border:5px solid var(--ink);border-radius:20px;padding:0 .2em;background:#FFF4CC}.box.ok{background:var(--grass)}.box.bad{background:var(--tomato);color:#fff}
.msg{font-size:1.5rem;font-weight:700;min-height:1.4em}</style></head>
<body>
<main>
<div class="card row noprint" style="margin-bottom:20px">
 <label>Level <select id="lvl" style="width:auto"><option value="0">Within 10</option><option value="1">Within 20</option><option value="2">2-digit, no borrowing</option><option value="3">2-digit with borrowing</option><option value="4">3-digit</option></select></label>
 
 <label>Mode <select id="mode" style="width:auto"><option value="10">10 problems</option><option value="20">20 problems</option><option value="t60">1 minute challenge</option></select></label>
 <button class="btn green" id="start">Start</button>
</div>
<div class="card center">
 <div class="row" style="justify-content:space-between"><span class="chip" id="prog">Ready</span><span class="chip">🔥 <b id="streak">0</b></span><span class="chip">⭐ <b id="score">0</b></span></div>
 <div class="prob"><span id="p">Tap Start</span> <span class="eq">=</span> <span class="box" id="a">?</span></div>
 <div id="msg" class="msg"></div>
 <div class="keypad" id="pad"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="del" aria-label="Delete">⌫</button><button data-k="0">0</button><button data-k="ok" style="background:var(--grass)" aria-label="Check">✓</button></div>
</div></main>
<script src="kit.js"></script>
<script>
Kit.mount('➖', 'Subtraction Practice');

const $=id=>document.getElementById(id);const R=Kit.rand;const OP='−';
$('lvl').value=Kit.get('subtraction-lvl',0);$('lvl').onchange=()=>Kit.set('subtraction-lvl',+$('lvl').value);
const tbl=()=>$('tbl')&&$('tbl').value?+$('tbl').value:null;
function gen(lv){ 
if(lv===0){const a=R(0,10),b=R(0,a);return[a,b,a-b]}if(lv===1){const a=R(5,20),b=R(0,a);return[a,b,a-b]}
if(lv===2){const a1=R(2,9),b1=R(1,a1-1),a0=R(0,9),b0=R(0,a0);const a=a1*10+a0,b=b1*10+b0;return[a,b,a-b]}
if(lv===3){let a,b;do{a=R(21,99);b=R(11,a-1)}while((a%10)>=(b%10));return[a,b,a-b]}
const a=R(200,999),b=R(100,a);return[a,b,a-b] }
let cur,typed='',n=0,total=10,score=0,streak=0,busy=true,endAt=0,tv,missed=[];
function show(){$('a').textContent=typed||'?';$('a').className='box'}
function next(){if(total&&n>=total)return done();cur=gen(+$('lvl').value);n++;typed='';busy=false;$('p').textContent=`${cur[0]} ${OP} ${cur[1]}`;$('msg').textContent='';show();
 $('prog').textContent=total?`Problem ${n} of ${total}`:$('prog').textContent}
function check(){if(busy||!typed)return;busy=true;const ok=+typed===cur[2];$('a').className='box '+(ok?'ok':'bad');
 if(ok){score++;streak++;Kit.ding();if(streak%5===0)Kit.confetti(40)}else{streak=0;missed.push(`${cur[0]} ${OP} ${cur[1]} = ${cur[2]}`);$('msg').textContent=`The answer is ${cur[2]}`;Kit.tone(170,.3,'sawtooth',.15)}
 $('score').textContent=score;$('streak').textContent=streak;setTimeout(next,ok?600:1600)}
function done(){clearInterval(tv);busy=true;const tot=total||n-1;const pct=tot?score/tot:0,st=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;Kit.tada();if(st>=2)Kit.confetti();
 Kit.modal(`<div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><h2 style="font-size:2.2rem;margin:6px 0">${score} out of ${tot} right</h2>${missed.length?`<p>Practice these:</p><p>${missed.slice(0,12).map(m=>`<span class="chip">${m}</span>`).join('')}</p>`:''}`)}
$('start').onclick=()=>{n=0;score=0;streak=0;missed=[];$('score').textContent=0;$('streak').textContent=0;clearInterval(tv);const m=$('mode').value;
 if(m==='t60'){total=0;endAt=Date.now()+60000;tv=setInterval(()=>{const l=Math.ceil((endAt-Date.now())/1000);$('prog').textContent=`⏱️ ${l} sec`;if(l<=0){n++;done()}},250)}else total=+m;next()};
function key(k){if(busy&&k!=='ok')return;if(k==='del')typed=typed.slice(0,-1);else if(k==='ok')return check();else if(typed.length<5)typed+=k;show()}
$('pad').onclick=e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)};
addEventListener('keydown',e=>{if(/SELECT/.test(document.activeElement.tagName))return;if(/^[0-9]$/.test(e.key))key(e.key);if(e.key==='Backspace')key('del');if(e.key==='Enter'){e.preventDefault();key('ok')}});

</script>
</body></html>
