<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Word Ladder</title>
<style>
main{max-width:1200px}
.wl-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.wl-wrap{grid-template-columns:1fr}}
.wl-lad{position:relative;display:flex;flex-direction:column-reverse;gap:10px;padding:16px 40px;background:#fff;border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink)}
.wl-lad::before,.wl-lad::after{content:"";position:absolute;top:12px;bottom:12px;width:12px;background:#C99A5C;border:3px solid var(--ink);border-radius:6px}
.wl-lad::before{left:12px}.wl-lad::after{right:12px}
.wl-rung{display:flex;justify-content:center;gap:6px}
.wl-rung span{width:clamp(46px,8vw,64px);aspect-ratio:1;border:4px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:clamp(1.6rem,4vw,2.4rem);text-transform:uppercase;background:#F4FAFF}
.wl-rung span.ch{background:var(--sun)}
.wl-rung.goal span{background:#C9F1D2}.wl-rung.start span{background:#E3F2FF}
.wl-rung.blank span{background:#fff;border-style:dashed;color:#C2CCE0}
.wl-side{display:grid;gap:12px}
.wl-in{display:flex;gap:8px}.wl-in input{flex:1;font-size:1.8rem!important;text-align:center;text-transform:uppercase;letter-spacing:.2em;font-weight:800}
.wl-msg{font-weight:800;font-size:1.2rem;min-height:1.4em;text-align:center}
.wl-pick{display:flex;flex-wrap:wrap;gap:6px}
.wl-pick button{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;cursor:pointer;background:#fff;color:var(--ink);text-transform:uppercase}
.wl-pick button.on{background:var(--sun)}.wl-pick button.done{background:#C9F1D2}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🧠", "Word Ladder");
const $=id=>document.getElementById(id);
const PUZ=[['cat','dog',['cat','cot','cog','dog']],['hat','top',['hat','hot','hop','top']],['boy','man',['boy','bay','ban','man']],['mop','mat',['mop','map','mat']],['run','win',['run','fun','fan','fin','win']],['pig','sty',['pig','wig','wag','way','say','sty']],
 ['bear','deer',['bear','beer','deer']],['cold','warm',['cold','cord','card','ward','warm']],['head','tail',['head','heal','teal','tell','tall','tail']],['sick','well',['sick','silk','sill','will','well']],['more','less',['more','lore','lose','loss','less']]];
const WORDS=new Set(`ant any ape arm art ask ate bad bag ban bat bay bed bee beg bet big bin bit bog bow box boy bud bug bun bus but buy bye cab can cap car cat cog cot cow cry cub cup cut dad day den dew did dig dim dip dog dot dry due dug ear eat egg elf end eye fan far fat fed few fig fin fit fix fly fog for fox fun fur gap gas get gum gun guy had ham has hat hay hen her hid him hip his hit hog hop hot how hug hum hut ice ink jam jar jaw jet job jog joy jug key kid kit lab lap law lay leg let lid lie lip lit log lot low mad man map mat may men met mix mob mom mop mud mug nap net new nod not now nut oak odd off oil old one our out owl own pad pal pan pat paw pay pea pen pet pie pig pin pit pop pot pup put rag ram ran rap rat raw ray red rib rid rim rip rob rod rot row rub rug run sad sat saw say sea see set sew she shy sip sit six sky sly sob son spy sty sub sum sun tag tan tap tar tea ten tie tin tip toe ton too top tow toy try tub tug two use van vet wag war was wax way web wed wet who why wig win wit won wow yak yam yes yet you zip zoo
able back bake ball band bank bark barn bath bead beak beam bean bear beat beer bell belt bend best bike bird bite blue boat body bold bolt bone book boot bore born boss bowl bulb bump burn bush busy cake call calm came camp card care cart case cash cast cave cell chin chip city clap clay clip coat code coin cold come cook cool cord core corn cost crab crow cube cute dark dart dash date dawn days dead deal dear deep deer desk dial dice dine dirt dish dive dock does doll done door dose dove down drag draw drip drop drum duck dull dust each earn east easy edge face fact fail fair fall fame farm fast feed feel feet fell felt file fill film find fine fire firm fish five flag flat flew flip flow foam fold folk food fool foot ford fork form fort four free frog from fuel full fund gain game gate gave gear gift girl give glad glow glue goal goat gold golf gone good gown grab gray grew grin grip grow gull hair half hall hand hang hard harm hate have head heal heap hear heat heel held hell help herb here hero hide high hill hint hold hole home hood hook hope horn hose host hour huge hunt hurt idea iron item jail joke jump just keep kept kick kind king kiss kite knee knew knit know lace lady laid lake lamb lamp land lane last late lead leaf leak lean leap left lend lens less lick life lift like lime line link lion list live load loaf lock loft long look loop lord lore lose loss lost loud love luck lump made mail main make male mall many mark mask mast mate meal mean meat meet melt mess mice mild milk mill mind mine mint miss mist mole mood moon more moss most move much must nail name near neat neck need nest news next nice nine nose note oven over pack page paid pail pain pair pale palm pant park part pass past path peak pear peel pick pile pill pine pink pipe plan play plot plug plum poem pole pond pony pool poor pore pork port pose post pour pull pump pure push race rack rage rain rake ramp rang rank rare rate read real rest rice rich ride ring rise risk road roar robe rock rode role roll roof room root rope rose rude rule rush sack safe said sail sale salt same sand sang save seal seat seed seem seen self sell send ship shoe shop shot show shut sick side sign silk sill sing sink size skin skip slam slip slot slow snap snow soap sock soft soil sold sole some song soon sore sort soup sour spin spot star stay stem step stir stop such suit sure swim tail take tale talk tall tame tank tape task teal team tear tell tent test text than that them then they thin this tide tidy tile till time tiny tire toad told toll tone took tool tour town trap tree trip true tube tune turn twin type unit upon used vase vest view vine wade wage wait wake walk wall want ward warm warn wash wave weak wear week well went were west what when whip wide wife wild will wind wine wing wire wise wish with woke wolf wood wool word wore work worm wrap yard yarn year yell zero zone`.split(/\s+/));
const st=Kit.get('wl-state',{done:[]});let P=0,steps=[];
document.querySelector('main').innerHTML=`<div class="card" style="margin-bottom:14px"><b>Pick a ladder:</b> <div class="wl-pick" id="pk" style="margin-top:8px"></div></div>
<div class="wl-wrap"><div class="wl-lad" id="ld"></div><div class="wl-side"><div class="card stack"><div style="font-weight:800;font-size:1.2rem">Change just <u>one letter</u> each step to make a new word.</div><div class="wl-in"><input type="text" id="in" maxlength="4" autocomplete="off" aria-label="Next word"><button class="btn green" id="add">↑ Climb</button></div><div class="wl-msg" id="msg"></div>
<div class="row"><button class="btn white small" id="un">↶ Undo</button><button class="btn white small" id="ok">✋ Teacher: it's a real word</button><button class="btn white small" id="hn">💡 Hint</button><button class="btn white small" id="sh">👀 Show a way</button></div></div><div class="card" id="info"></div></div></div>`;
let pending=null;
function load(i){P=i;steps=[PUZ[i][0]];pending=null;$('in').maxLength=PUZ[i][0].length;$('in').value='';$('msg').textContent='';draw()}
function diff(a,b){if(a.length!==b.length)return -1;let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n}
function draw(){const [s,g,sol]=PUZ[P];$('pk').innerHTML=PUZ.map((p,i)=>`<button class="${i===P?'on':''} ${st.done.includes(i)?'done':''}" data-i="${i}">${p[0]} → ${p[1]}</button>`).join('');
 const rung=(w,cls,prev)=>`<div class="wl-rung ${cls}">${[...w].map((c,k)=>`<span class="${prev&&prev[k]!==c?'ch':''}">${c}</span>`).join('')}</div>`;
 const won=steps[steps.length-1]===g;$('ld').innerHTML=steps.map((w,i)=>rung(w,i===0?'start':w===g?'goal':'',steps[i-1])).join('')+(won?'':rung('?'.repeat(s.length),'blank')+rung(g,'goal'));
 $('info').innerHTML=`🏁 Get from <b>${s.toUpperCase()}</b> to <b>${g.toUpperCase()}</b>. Steps so far: <b>${steps.length-1}</b> · Best possible: <b>${sol.length-1}</b>`;window.__t={steps:[...steps],won}}
function climb(w,force){const last=steps[steps.length-1],g=PUZ[P][1];w=w.toLowerCase().trim();
 if(w.length!==last.length){$('msg').textContent=`Use ${last.length} letters.`;return}const d=diff(last,w);if(d!==1){$('msg').textContent=d===0?'That\'s the same word!':'Only change ONE letter.';Learn.flash($('in'),false);return}
 if(steps.includes(w)){$('msg').textContent='You already used that word.';return}
 if(!force&&!WORDS.has(w)){pending=w;$('msg').textContent=`Hmm, "${w.toUpperCase()}" isn't in my word list. If it's a real word, tap ✋.`;Kit.tone(220,.2,'triangle',.15);return}
 steps.push(w);pending=null;$('in').value='';$('msg').textContent='👍 Nice step!';Kit.tone(500+steps.length*60,.12,'triangle',.22);draw();
 if(w===g){if(!st.done.includes(P)){st.done.push(P);Kit.set('wl-state',st)}const best=PUZ[P][2].length-1;$('msg').textContent=steps.length-1<=best?'🏆 You found the shortest ladder!':`🎉 You made it in ${steps.length-1} steps!`;Kit.tada();Kit.confetti(100);draw()}}
$('add').onclick=()=>climb($('in').value);$('in').onkeydown=e=>{if(e.key==='Enter')climb($('in').value)};
$('ok').onclick=()=>{if(pending)climb(pending,true)};$('un').onclick=()=>{if(steps.length>1){steps.pop();draw()}};
$('hn').onclick=()=>{const sol=PUZ[P][2],last=steps[steps.length-1];const k=sol.indexOf(last);const nx=k>=0&&k<sol.length-1?sol[k+1]:null;if(nx){const pos=[...last].findIndex((c,i)=>c!==nx[i]);$('msg').textContent=`💡 Try changing letter ${pos+1}.`}else $('msg').textContent='💡 Try going back a step or two.'};
$('sh').onclick=()=>{$('msg').textContent='One way: '+PUZ[P][2].map(w=>w.toUpperCase()).join(' → ')};
$('pk').onclick=e=>{const b=e.target.closest('[data-i]');if(b)load(+b.dataset.i)};
load(0);
</script>
</body></html>
