<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Word Scrambler</title>
<style>.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0 10px}
.tiles span{width:clamp(48px,8vw,74px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;border:4px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);text-transform:uppercase;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.hintline{font-size:1.2rem;font-weight:600;min-height:1.5em}.msg{font-size:1.8rem;font-weight:700;min-height:1.3em}</style></head>
<body>
<main>
<div class="grid2">
 <div class="card stack setup">
  <label for="words">Words to scramble. One per line. Add a hint after a | if you want.</label>
  <textarea id="words"></textarea>
 </div>
 <div class="card center">
  <div class="row" style="justify-content:center"><span class="chip">⭐ Score: <b id="score">0</b></span><span class="chip" id="left"></span></div>
  <div id="tiles" class="tiles"></div>
  <p id="hint" class="hintline"></p>
  <input type="text" id="guess" placeholder="Type the word" autocomplete="off" autocapitalize="off" spellcheck="false" style="max-width:360px;font-size:1.6rem;text-align:center">
  <div class="row" style="justify-content:center;margin-top:14px">
   <button class="btn green" id="check">Check</button><button class="btn white" id="clue">Show a letter</button>
   <button class="btn white" id="shuffle">Mix again</button><button class="btn pink" id="reveal">Show answer</button><button class="btn" id="next">Next word</button>
  </div>
  <p id="msg" class="msg"></p>
 </div>
</div></main>
<script src="kit.js"></script>
<script>
Kit.mount('🔤', 'Word Scrambler');

const $=id=>document.getElementById(id);const COL=['#FFC93C','#FF8FC7','#22C3E6','#5DC66E','#9B6BF2','#FF9F43'];
$('words').value=Kit.get('ws-words',`apple | A red or green fruit
planet | Earth is one
rainbow | Colors in the sky after rain
teacher | Works at a school
elephant | Big gray animal with a trunk
library | A place full of books
pumpkin | Orange and round in October
butterfly | Starts as a caterpillar`);
$('words').oninput=()=>Kit.set('ws-words',$('words').value);
let pool=[],cur,score=0,shown=0;
const list=()=>Kit.lines($('words').value).map(l=>l.split('|').map(s=>s.trim())).filter(p=>p[0]);
function scramble(w){if(w.length<2)return w;let s;do{s=Kit.shuffle([...w]).join('')}while(s===w&&new Set(w).size>1);return s}
function tiles(t){$('tiles').innerHTML=[...t].map((c,k)=>`<span style="background:${COL[k%6]};animation-delay:${k*.04}s">${Kit.esc(c)}</span>`).join('')}
function next(){const l=list();if(!l.length){$('tiles').innerHTML='';$('msg').textContent='Add some words first';return}
 if(!pool.length)pool=Kit.shuffle(l);cur=pool.pop();shown=0;tiles(scramble(cur[0].toLowerCase()));$('hint').textContent=cur[1]?'Hint: '+cur[1]:'';
 $('guess').value='';$('msg').textContent='';$('left').textContent=`${pool.length} left`}
$('check').onclick=()=>{if(!cur)return;if($('guess').value.trim().toLowerCase()===cur[0].toLowerCase()){score++;$('score').textContent=score;$('msg').textContent='You got it! 🎉';Kit.tada();Kit.confetti(40);setTimeout(next,1500)}
 else{$('msg').textContent='Not yet, try again!';Kit.tone(170,.3,'sawtooth',.15)}};
$('guess').onkeydown=e=>{if(e.key==='Enter')$('check').click()};
$('clue').onclick=()=>{if(!cur)return;shown=Math.min(cur[0].length,shown+1);$('msg').textContent='Starts with: '+cur[0].slice(0,shown).toUpperCase()};
$('reveal').onclick=()=>{if(cur){tiles(cur[0].toLowerCase());$('msg').textContent='The word is '+cur[0]}};
$('shuffle').onclick=()=>{if(cur)tiles(scramble(cur[0].toLowerCase()))};$('next').onclick=next;
next();

</script>
</body></html>
