<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>This-or-That Generator</title>
<style>
main{max-width:1500px}
.tt-arena{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,2vw,20px);align-items:stretch;min-height:46vh}
.tt-s{border:7px solid var(--ink);border-radius:30px;box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;padding:16px;text-shadow:3px 3px 0 rgba(0,0,0,.3)}
.tt-s.l{background:#9B6BF2}.tt-s.r{background:#FF9F43}
.tt-s .ar{font-size:clamp(2.4rem,6vw,4rem);font-weight:800}
.tt-s .e{font-size:clamp(4rem,11vw,7rem);line-height:1}
.tt-s .t{font-size:clamp(1.8rem,4.8vw,3.4rem);font-weight:800}
.tt-s.pop{animation:ttp .5s cubic-bezier(.3,1.6,.5,1)}@keyframes ttp{from{transform:scale(.7);opacity:0}}
.tt-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.tt-ring{width:clamp(90px,12vw,140px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--sun) var(--p),#fff 0);border:6px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:clamp(2rem,5vw,3rem)}
.tt-n{font-weight:800;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.tt-h{text-align:center;font-weight:800;font-size:clamp(1.3rem,3vw,2rem);color:#fff;text-shadow:3px 3px 0 var(--ink);margin-bottom:12px}
@media (max-width:640px){.tt-arena{grid-template-columns:1fr}.tt-mid{flex-direction:row}}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🤔", "This-or-That Generator");
const $=id=>document.getElementById(id);
const PACKS={'Warm-up':`🐱 Cats | 🐶 Dogs\n🍕 Pizza | 🌮 Tacos\n☀️ Summer | ❄️ Winter\n🏖️ Beach | 🏔️ Mountains\n🌅 Morning | 🌙 Night\n🍎 Apples | 🍌 Bananas\n🎮 Video games | 📚 Books\n🚲 Bike | 🛴 Scooter\n🦁 Lion | 🐯 Tiger\n🎨 Draw | 🎤 Sing`,
 'School':`➗ Math | 📖 Reading\n🔬 Science | 🗺️ Social studies\n✏️ Pencil | 🖊️ Pen\n🧑‍🤝‍🧑 Group work | 🧍 Work alone\n🏃 Recess outside | 🎲 Indoor games\n📝 Write a story | 🎨 Draw a picture\n🍱 Pack lunch | 🍕 School lunch\n🪑 Desk | 🛋️ Bean bag`,
 'Food':`🍔 Burger | 🌭 Hot dog\n🍦 Ice cream | 🍰 Cake\n🥞 Pancakes | 🧇 Waffles\n🍫 Chocolate | 🍓 Strawberry\n🧃 Juice | 🥛 Milk\n🍿 Popcorn | 🥨 Pretzels\n🍝 Spaghetti | 🍕 Pizza\n🥕 Carrots | 🥦 Broccoli`,
 'Imagine':`🦸 Super strength | ⚡ Super speed\n🐉 Dragon | 🦄 Unicorn\n🚀 Rocket | 🚢 Submarine\n🧙 Wizard | 🤖 Robot\n🏰 Castle | 🏝️ Island\n👽 Meet an alien | 🦖 Meet a dinosaur\n⏳ Past | 🛸 Future\n🐙 Octopus arms | 🦒 Giraffe neck`};
const st=Kit.get('tt-set',{pack:'Warm-up',secs:6,n:8,mine:''});
document.querySelector('main').innerHTML=`<div class="tt-h" id="h">Move to the side of the room you pick!</div><div class="tt-arena"><div class="tt-s l" id="L"><span class="ar">⬅</span><span class="e"></span><span class="t"></span></div><div class="tt-mid"><div class="tt-ring" id="rg" style="--p:100%">🤔</div><span class="tt-n" id="n"></span></div><div class="tt-s r" id="R"><span class="ar">➡</span><span class="e"></span><span class="t"></span></div></div>
<div class="row" style="justify-content:center;margin-top:16px"><select id="pk" style="width:auto"></select><select id="sc" style="width:auto"><option value="4">4 s each</option><option value="6">6 s each</option><option value="10">10 s each</option><option value="0">I'll go by hand</option></select><select id="cnt" style="width:auto"><option value="5">5 rounds</option><option value="8">8 rounds</option><option value="12">12 rounds</option></select><button class="btn big green" id="go">▶ Go!</button><button class="btn white" id="nx">⏭ Next</button><button class="btn white small" id="ed">✏️ My own</button></div>
<div class="card stack" id="edc" hidden style="margin-top:14px"><b>✏️ My own this-or-thats</b><span class="muted">One per line: emoji this | emoji that</span><textarea id="ta" style="min-height:160px"></textarea><button class="btn green" id="sv">✓ Save</button></div>`;
const packs=()=>({...PACKS,...(Kit.lines(st.mine).length?{'My own':st.mine}:{})});
$('pk').innerHTML=Object.keys(packs()).map(k=>`<option>${k}</option>`).join('');$('pk').value=st.pack;$('sc').value=st.secs;$('cnt').value=st.n;
['pk','sc','cnt'].forEach(id=>$(id).onchange=()=>{st.pack=$('pk').value;st.secs=+$('sc').value;st.n=+$('cnt').value;Kit.set('tt-set',st)});
const split=t=>{const m=t.match(/^(\p{Extended_Pictographic}[\u{FE0F}\u{200D}\p{Extended_Pictographic}]*)\s*(.*)$/u);return m?[m[1],m[2]]:['',t]};
let deck=[],i=0,tv=null,left=0;
function show(){const r=deck[i];[['L',r[0]],['R',r[1]]].forEach(([id,t])=>{const [e,x]=split(t);const el=$(id);el.querySelector('.e').textContent=e;el.querySelector('.t').textContent=x;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')});
 $('n').textContent=`${i+1} of ${deck.length}`;$('h').textContent=`${split(r[0])[1]} or ${split(r[1])[1]}?`;Kit.tone(523,.1,'triangle',.2);Kit.tone(659,.1,'triangle',.2,.1);left=st.secs;ring();window.__t={i,n:deck.length}}
function ring(){$('rg').style.setProperty('--p',st.secs?left/st.secs*100+'%':'100%');$('rg').textContent=st.secs?left:'🤔'}
function next(){i++;if(i>=deck.length){clearInterval(tv);tv=null;$('h').textContent='🎉 That\'s all! Everyone back to your seats.';$('rg').textContent='🏁';Kit.tada();$('go').textContent='▶ Go!';window.__t={i,n:deck.length,done:true};return}show()}
$('go').onclick=()=>{const p=Kit.lines(packs()[st.pack]||'').map(l=>l.split('|').map(s=>s.trim())).filter(r=>r[1]);deck=Kit.shuffle(p).slice(0,st.n);i=0;if(!deck.length)return;show();clearInterval(tv);
 if(st.secs)tv=setInterval(()=>{left--;ring();if(left<=2&&left>0)Kit.tick();if(left<=0)next()},1000)};
$('nx').onclick=()=>{if(deck.length&&i<deck.length)next()};
$('ed').onclick=()=>{$('edc').hidden=!$('edc').hidden;$('ta').value=st.mine};$('sv').onclick=()=>{st.mine=$('ta').value;st.pack='My own';Kit.set('tt-set',st);$('pk').innerHTML=Object.keys(packs()).map(k=>`<option>${k}</option>`).join('');$('pk').value=st.pack;$('edc').hidden=true};
const p0=Kit.lines(PACKS['Warm-up'])[0].split('|');[['L',p0[0]],['R',p0[1]]].forEach(([id,t])=>{const [e,x]=split(t.trim());$(id).querySelector('.e').textContent=e;$(id).querySelector('.t').textContent=x});
</script>
</body></html>
