<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Math Race</title>
<style>
main{max-width:1700px}
.mr-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
.mr-track{background:#4A4F5C;border:6px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:10px 60px 10px 12px;position:relative;display:grid;gap:8px;margin-bottom:14px;overflow:hidden}
.mr-track::after{content:"";position:absolute;right:14px;top:0;bottom:0;width:36px;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/18px 18px}
.mr-lane{height:64px;border-bottom:4px dashed #fff8;position:relative}
.mr-lane:last-child{border-bottom:0}
.mr-car{position:absolute;top:50%;font-size:3.2rem;transform:translate(-10%,-50%) scaleX(-1);transition:left .6s cubic-bezier(.3,1.5,.6,1)}
.mr-lane b{position:absolute;left:4px;top:2px;color:#fff;font-size:.85rem;opacity:.8}
.mr-pl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.mr-pl{grid-template-columns:minmax(0,1fr)}}
.mr-p{background:#fff;border:6px solid var(--ink);border-top:20px solid var(--c);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:12px;display:grid;gap:10px;justify-items:center}
.mr-p input.nm{font:900 1.3rem Fredoka,sans-serif;text-align:center;border:0;width:100%;color:var(--ink)}
.mr-q{font:900 clamp(2rem,6vw,3.2rem) Fredoka,sans-serif;color:var(--ink)}
.mr-a{font:900 clamp(1.8rem,5vw,2.6rem) Fredoka,sans-serif;min-width:150px;min-height:62px;border:5px solid var(--ink);border-radius:16px;text-align:center;background:#F4F6FA;padding:2px 10px}
.mr-p.ok .mr-a{background:#C8F3D0}.mr-p.no .mr-a{background:#FFD3CC;animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mr-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:min(280px,100%)}
.mr-pad button{font:900 1.6rem Fredoka,sans-serif;height:56px;border:4px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 var(--ink);touch-action:manipulation}
.mr-pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mr-pad .go{background:#5DC66E}.mr-pad .del{background:#FFD3CC}
.mr-pts{font-weight:900;font-size:1.1rem}
.mr-win{position:fixed;inset:0;background:rgba(15,22,45,.75);display:grid;place-items:center;z-index:50}
.mr-win .wc{background:#fff;border:8px solid var(--ink);border-radius:30px;padding:24px 40px;text-align:center;font-weight:900;font-size:clamp(1.6rem,5vw,2.6rem);animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}}
.mr-cd{position:fixed;inset:0;display:grid;place-items:center;font:900 10rem Fredoka,sans-serif;color:#fff;text-shadow:6px 6px 0 var(--ink);z-index:50;pointer-events:none}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🏎️", "Math Race");
const $=id=>document.getElementById(id);
const OPS={add:'➕ Adding',sub:'➖ Subtracting',mul:'✖️ Times tables',div:'➗ Dividing',mix:'🔀 Mixed'};
const CARS=['🏎️','🚙','🚓','🚕'],COLS=['#E5533F','#1E7FD0','#5DC66E','#9B6BF2'];
let op=Kit.get('mr-op','add'),hi=Kit.get('mr-hi',10),goal=Kit.get('mr-goal',10),nP=Kit.get('mr-n',2),P=[],racing=false;
function prob(){let o=op==='mix'?Kit.pick(['add','sub','mul','div']):op,a,b;
 if(o==='add'){a=Kit.rand(0,hi);b=Kit.rand(0,hi);return [`${a} + ${b}`,a+b]}if(o==='sub'){a=Kit.rand(0,hi*2);b=Kit.rand(0,a);return [`${a} − ${b}`,a-b]}
 if(o==='mul'){a=Kit.rand(1,Math.min(12,hi));b=Kit.rand(1,12);return [`${a} × ${b}`,a*b]}b=Kit.rand(1,Math.min(12,hi));a=b*Kit.rand(1,12);return [`${a} ÷ ${b}`,a/b]}
document.querySelector('main').innerHTML=`<div class="mr-top"><select id="op" style="width:auto">${Object.entries(OPS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="hi" style="width:auto">${[5,10,20,50].map(n=>`<option value="${n}">Numbers to ${n}</option>`).join('')}</select><select id="gl" style="width:auto">${[5,10,15,20].map(n=>`<option value="${n}">🏁 ${n} to win</option>`).join('')}</select><select id="np" style="width:auto">${[2,3,4].map(n=>`<option value="${n}">${n} racers</option>`).join('')}</select><button class="btn green big" id="go">🚦 Start race!</button></div>
<div class="mr-track" id="tk"></div><div class="mr-pl" id="pl"></div>`;
function setup(){P=Array.from({length:nP},(_,i)=>({name:(P[i]&&P[i].name)||`Racer ${i+1}`,pos:0,q:null,a:'',ok:0,miss:0}));draw()}
function draw(){$('op').value=op;$('hi').value=hi;$('gl').value=goal;$('np').value=nP;
 $('tk').innerHTML=P.map((p,i)=>`<div class="mr-lane"><b>${Kit.esc(p.name)}</b><span class="mr-car" style="left:${p.pos/goal*92}%">${CARS[i]}</span></div>`).join('');
 $('pl').style.gridTemplateColumns=`repeat(${Math.min(nP,innerWidth<760?1:nP)},minmax(0,1fr))`;
 $('pl').innerHTML=P.map((p,i)=>`<div class="mr-p" data-p="${i}" style="--c:${COLS[i]}"><input class="nm" value="${Kit.esc(p.name)}" data-n="${i}" aria-label="Racer name"><div class="mr-q">${p.q?p.q[0]+' =':'🚦'}</div><div class="mr-a" data-a="${i}">${p.a}</div><div class="mr-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="del" data-k="del">⌫</button><button data-k="0">0</button><button class="go" data-k="go">✔</button></div><div class="mr-pts">✅ ${p.ok} · ❌ ${p.miss}</div></div>`).join('');
 window.__t={racing,pos:P.map(p=>p.pos),q:P.map(p=>p.q&&p.q[1])}}
function card(i){const p=P[i],c=$('pl').querySelector(`[data-p="${i}"]`);c.querySelector('.mr-q').textContent=p.q?p.q[0]+' =':'🚦';c.querySelector('.mr-a').textContent=p.a;c.querySelector('.mr-pts').textContent=`✅ ${p.ok} · ❌ ${p.miss}`;$('tk').children[i].querySelector('.mr-car').style.left=(p.pos/goal*92)+'%';window.__t={racing,pos:P.map(p=>p.pos),q:P.map(p=>p.q&&p.q[1])}}
async function start(){setup();racing=false;for(const n of ['3','2','1','GO!']){const d=document.createElement('div');d.className='mr-cd';d.textContent=n;document.body.appendChild(d);Kit.tone(n==='GO!'?880:440,.2,'square',.1);await Kit.sleep(window.__fast?1:700);d.remove()}
 racing=true;P.forEach((p,i)=>{p.q=prob();card(i)})}
function key(i,k){const p=P[i];if(!racing||!p.q)return;const c=$('pl').querySelector(`[data-p="${i}"]`);c.classList.remove('ok','no');
 if(k==='del')p.a=p.a.slice(0,-1);else if(k==='go'){if(p.a==='')return;if(+p.a===p.q[1]){p.ok++;p.pos++;Kit.tone(600+i*120,.1,'triangle',.12);c.classList.add('ok');if(p.pos>=goal){p.a='';card(i);win(i);return}}else{p.miss++;p.pos=Math.max(0,p.pos-(Kit.get('mr-back',false)?1:0));Kit.tone(160,.2,'sawtooth',.08);c.classList.add('no')}p.a='';p.q=prob()}
 else if(p.a.length<4)p.a+=k;card(i)}
function win(i){racing=false;Kit.tada();Kit.confetti(200);const o=document.createElement('div');o.className='mr-win';const p=P[i];o.innerHTML=`<div class="wc"><div style="font-size:2.5em">${CARS[i]}</div>🏆 ${Kit.esc(p.name)} wins!<div style="font-size:.55em;margin-top:8px;font-weight:800">${P.map(q=>`${Kit.esc(q.name)}: ✅ ${q.ok} ❌ ${q.miss}`).join('<br>')}</div><button class="btn green" style="margin-top:12px">🔁 Race again</button></div>`;document.body.appendChild(o);o.querySelector('button').onclick=()=>{o.remove();start()};window.__t.winner=p.name}
$('pl').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;key(+b.closest('[data-p]').dataset.p,b.dataset.k)};
$('pl').oninput=e=>{const i=e.target.dataset.n;if(i!=null){P[+i].name=e.target.value;$('tk').children[+i].querySelector('b').textContent=e.target.value}};
// keyboard: racer 1 uses the number row, racer 2 uses the number pad
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const np=e.code.startsWith('Numpad');const i=np&&P.length>1?1:0;
 if(/^\d$/.test(e.key))key(i,e.key);else if(e.key==='Enter')key(i,'go');else if(e.key==='Backspace')key(i,'del')});
['op','hi','gl','np'].forEach(id=>$(id).onchange=()=>{op=$('op').value;hi=+$('hi').value;goal=+$('gl').value;nP=+$('np').value;Kit.set('mr-op',op);Kit.set('mr-hi',hi);Kit.set('mr-goal',goal);Kit.set('mr-n',nP);racing=false;setup()});
$('go').onclick=start;window.__r={key};
setup();
</script>
</body></html>
