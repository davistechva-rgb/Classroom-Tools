<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Virtual Store Math</title>
<style>
main{max-width:1600px}
.vs-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
.vs{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.vs{grid-template-columns:minmax(0,1fr)}}
.vs-shelf{background:#C98B55;border:6px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;background-image:repeating-linear-gradient(transparent 0 150px,#8B5A2B 150px 160px)}
.vs-item{background:#fff;border:4px solid var(--ink);border-radius:16px;padding:6px;display:grid;justify-items:center;gap:2px;cursor:pointer;box-shadow:0 4px 0 var(--ink);font:inherit;color:var(--ink)}
.vs-item .e{font-size:2.6rem;line-height:1.1}.vs-item .n{font-weight:800;font-size:.9rem}
.vs-item .pr{background:#FFC93C;border:3px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:900;transform:rotate(-4deg)}
.vs-item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.vs-p{background:#fff;border:5px solid var(--ink);border-radius:22px;padding:12px;display:grid;gap:10px}
.vs-bud{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:1.3rem;background:#C8F3D0;border:4px solid var(--ink);border-radius:14px;padding:6px 12px}
.vs-cart{display:grid;gap:4px;min-height:60px}.vs-cart div{display:flex;justify-content:space-between;align-items:center;font-weight:800;border-bottom:2px dashed #DDE4F0;padding:2px 0}
.vs-cart button{border:2px solid var(--ink);border-radius:8px;background:#FFD3CC;cursor:pointer;font-weight:900}
.vs-ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:900;font-size:1.2rem}
.vs-ans input{width:120px;font:900 1.4rem Fredoka,sans-serif;padding:4px 8px;border:4px solid var(--ink);border-radius:12px}
.vs-msg{font-weight:900;font-size:1.15rem;min-height:1.4em}
.vs-reg{background:#1D2B53;border:6px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:14px;color:#fff;display:grid;gap:12px}
.vs-screen{background:#0B3B2E;color:#7CFFB2;font:900 clamp(1.2rem,3vw,1.7rem) ui-monospace,Menlo,monospace;border:4px solid #000;border-radius:12px;padding:10px 14px;display:grid;gap:4px}
.vs-money{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.vs-money button{border:0;background:none;cursor:pointer;padding:0;transition:transform .1s}.vs-money button:active{transform:scale(.9)}
.vs-bill{width:96px;height:46px;border:3px solid #1D4A2A;border-radius:6px;background:linear-gradient(#B9E4B2,#8CCB86);display:grid;place-items:center;font:900 1.1rem Fredoka,sans-serif;color:#1D4A2A}
.vs-coin{width:var(--s);height:var(--s);border-radius:50%;border:3px solid #6B5B2B;background:radial-gradient(circle at 35% 35%,#fff8,transparent 50%),var(--c);display:grid;place-items:center;font:900 .85rem Fredoka,sans-serif;color:#3B2F10}
.vs-tray{background:#2A3A6B;border-radius:14px;min-height:80px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("💰", "Virtual Store Math");
const $=id=>document.getElementById(id);
const ITEMS=`✏️ | Pencil | 0.25
📏 | Ruler | 0.75
🍎 | Apple | 0.50
🧃 | Juice box | 1.25
🍪 | Cookie | 0.35
📓 | Notebook | 2.50
🖍️ | Crayons | 1.75
🧸 | Teddy bear | 6.00
⚽ | Ball | 4.50
🍌 | Banana | 0.30
🎈 | Balloon | 0.95
🧁 | Cupcake | 1.60`;
Kit.editable({key:'vs-items',title:'Store items',help:'(one per line: emoji | item | price)',def:ITEMS,onSave:()=>draw()});
const items=()=>Kit.lines(Kit.get('ed:vs-items',ITEMS)).map(l=>{const p=l.split('|').map(s=>s.trim());return {e:p[0],n:p[1]||'Item',c:Math.round(parseFloat(p[2])*100)||100}});
const MONEY=[[2000,'$20','b'],[1000,'$10','b'],[500,'$5','b'],[100,'$1','b'],[25,'25¢','c','#D5D9E0',58],[10,'10¢','c','#E3E6EB',44],[5,'5¢','c','#C9CDD4',52],[1,'1¢','c','#D9935A',46]];
const $$=c=>'$'+(c/100).toFixed(2);
let tab='shop',lvl=Kit.get('vs-lvl','cents'),budget=0,cart=[],sale=null,paid=0,tray=[],msg='',stars=Kit.get('vs-stars',0);
function round(c){return lvl==='dollars'?Math.max(100,Math.round(c/100)*100):c}
function newShop(){budget=lvl==='dollars'?Kit.rand(5,15)*100:Kit.rand(3,12)*100;cart=[];msg='';draw()}
function newSale(){const I=items();const n=Kit.rand(1,3);const pick=Array.from({length:n},()=>Kit.pick(I));const tot=pick.reduce((s,i)=>s+round(i.c),0);const opts=[100,500,1000,2000].filter(v=>v>tot);paid=opts[0]?Kit.pick(opts.slice(0,2)):Math.ceil(tot/100)*100+100;sale={pick,tot};tray=[];msg='';draw()}
document.querySelector('main').innerHTML=`<div class="vs-top"><button class="btn" data-t="shop">🛒 Go shopping</button><button class="btn white" data-t="cash">🧾 Be the cashier</button><select id="lv" style="width:auto"><option value="dollars">💵 Whole dollars</option><option value="cents">🪙 Dollars and cents</option></select><span style="font-weight:900;color:#fff;text-shadow:2px 2px 0 var(--ink)" id="sr"></span></div><div id="bd"></div>`;
function draw(){document.querySelectorAll('[data-t]').forEach(b=>b.className='btn '+(b.dataset.t===tab?'':'white'));$('lv').value=lvl;$('sr').textContent=`⭐ ${stars}`;const I=items();
 if(tab==='shop'){const tot=cart.reduce((s,i)=>s+i.c,0);$('bd').innerHTML=`<div class="vs"><div class="vs-shelf" id="sh">${I.map((it,i)=>`<button class="vs-item" data-i="${i}"><span class="e">${it.e}</span><span class="n">${Kit.esc(it.n)}</span><span class="pr">${$$(round(it.c))}</span></button>`).join('')}</div>
  <div class="vs-p"><div class="vs-bud"><span>👛 You have</span><span>${$$(budget)}</span></div><b>🛒 Your basket</b><div class="vs-cart" id="ct">${cart.map((c,i)=>`<div><span>${c.e} ${Kit.esc(c.n)}</span><span>${$$(c.c)} <button data-x="${i}" aria-label="Remove">✕</button></span></div>`).join('')||'<span class="muted">Tap things on the shelf to add them.</span>'}</div>
  <div class="vs-ans">🧮 Total: $<input id="ta" type="number" step="0.01" min="0" placeholder="0.00"></div><div class="vs-ans">💵 Money left: $<input id="la" type="number" step="0.01" min="0" placeholder="0.00"></div>
  <button class="btn green" id="ck">✅ Check out</button><div class="vs-msg" id="mg">${msg}</div><button class="btn white small" id="ns">🎲 New shopping trip</button></div></div>`;
  $('sh').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const it=I[+b.dataset.i];cart.push({...it,c:round(it.c)});Kit.tone(800,.06,'triangle',.08);msg='';draw()};
  $('ct').onclick=e=>{const b=e.target.closest('[data-x]');if(b){cart.splice(+b.dataset.x,1);draw()}};$('ns').onclick=newShop;
  $('ck').onclick=()=>{if(!cart.length){msg='Put something in your basket first!';draw();return}const ta=Math.round(parseFloat($('ta').value)*100),la=Math.round(parseFloat($('la').value)*100);
   if(tot>budget){msg=`😬 Uh oh! Your basket costs more than ${$$(budget)}. Put something back.`;Kit.tone(200,.2,'triangle',.1)}else if(ta!==tot){msg='🤔 Check your total again. Add up each price.';Kit.tone(200,.2,'triangle',.1)}else if(la!==budget-tot){msg=`✅ Total is right! Now: ${$$(budget)} − ${$$(tot)} = ?`;Kit.ding()}else{stars++;Kit.set('vs-stars',stars);msg=`🎉 Perfect! You spent ${$$(tot)} and have ${$$(budget-tot)} left.`;Kit.tada();Kit.confetti(90)}
   const keep=[$('ta').value,$('la').value];draw();$('ta').value=keep[0];$('la').value=keep[1]};window.__t={tab,budget,tot,cart:cart.length,stars}}
 else{const given=tray.reduce((s,v)=>s+v,0),need=paid-sale.tot;$('bd').innerHTML=`<div class="vs"><div class="vs-reg"><div class="vs-screen">${sale.pick.map(i=>`<div style="display:flex;justify-content:space-between"><span>${i.e} ${Kit.esc(i.n)}</span><span>${$$(round(i.c))}</span></div>`).join('')}<div style="border-top:3px dashed #7CFFB2;display:flex;justify-content:space-between"><span>TOTAL</span><span>${$$(sale.tot)}</span></div><div style="display:flex;justify-content:space-between;color:#FFC93C"><span>CUSTOMER PAID</span><span>${$$(paid)}</span></div></div>
  <b>💵 Tap money to give change</b><div class="vs-money" id="mn">${MONEY.filter(m=>lvl==='cents'||m[0]>=100).map(m=>`<button data-v="${m[0]}" aria-label="${m[1]}">${m[2]==='b'?`<span class="vs-bill">${m[1]}</span>`:`<span class="vs-coin" style="--c:${m[3]};--s:${m[4]}px">${m[1]}</span>`}</button>`).join('')}</div></div>
  <div class="vs-p"><b>🤲 Change for the customer</b><div class="vs-tray" id="tr">${tray.map((v,i)=>{const m=MONEY.find(x=>x[0]===v);return `<button data-r="${i}" style="border:0;background:none;cursor:pointer">${m[2]==='b'?`<span class="vs-bill">${m[1]}</span>`:`<span class="vs-coin" style="--c:${m[3]};--s:${m[4]}px">${m[1]}</span>`}</button>`}).join('')||'<span style="color:#fff;opacity:.6;font-weight:700">Tap money on the left. Tap it here to take it back.</span>'}</div>
  <div class="vs-bud" style="background:#FFF6C9"><span>Change so far</span><span>${$$(given)}</span></div><div class="muted" style="font-weight:700">💡 Count up from ${$$(sale.tot)} to ${$$(paid)}.</div><button class="btn green" id="gv">✅ Give change</button><div class="vs-msg">${msg}</div><button class="btn white small" id="nc">🧑 Next customer</button></div></div>`;
  $('mn').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;tray.push(+b.dataset.v);tray.sort((a,b)=>b-a);Kit.tone(1200,.05,'triangle',.08);msg='';draw()};
  $('tr').onclick=e=>{const b=e.target.closest('[data-r]');if(b){tray.splice(+b.dataset.r,1);draw()}};$('nc').onclick=newSale;
  $('gv').onclick=()=>{if(given===need){stars++;Kit.set('vs-stars',stars);msg=`🎉 Correct change: ${$$(need)}! ${tray.length<=bestCount(need)?'And you used the fewest pieces!':''}`;Kit.tada();Kit.confetti(80)}else{msg=given<need?`Not enough. You need ${$$(need-given)} more.`:`That's too much by ${$$(given-need)}.`;Kit.tone(200,.2,'triangle',.1)}draw()};
  window.__t={tab,need,given,stars}}}
function bestCount(c){let n=0;for(const m of MONEY){if(lvl!=='cents'&&m[0]<100)continue;n+=Math.floor(c/m[0]);c%=m[0]}return n}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;tab==='shop'?newShop():newSale()});
$('lv').onchange=()=>{lvl=$('lv').value;Kit.set('vs-lvl',lvl);tab==='shop'?newShop():newSale()};
window.__v={sale:(tot,p)=>{sale={pick:[{e:'🍎',n:'Apple',c:tot}],tot};paid=p;tray=[];msg='';draw()}};
newShop();
</script>
</body></html>
