<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Password Security Demonstrator</title>
<style>
main{max-width:1500px}
.ps-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.ps-safe{text-align:center;color:#fff;font-weight:800;text-shadow:1px 1px 0 var(--ink);margin-bottom:10px}
.ps{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.ps{grid-template-columns:1fr}}
.ps-box{background:#fff;border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:14px;display:grid;gap:12px}
.ps-box{min-width:0;grid-template-columns:minmax(0,1fr);overflow-wrap:anywhere}.ps-box .btn{white-space:normal;max-width:100%}
.ps-in{display:flex;gap:6px}.ps-in input{flex:1;font-size:1.4rem;font-weight:800;font-family:ui-monospace,Menlo,monospace;min-width:0}
.ps-meter{height:30px;border:4px solid var(--ink);border-radius:99px;overflow:hidden;background:#E3E8F2}.ps-meter i{display:block;height:100%;transition:width .3s,background .3s}
.ps-lvl{font-size:1.6rem;font-weight:900;text-align:center}
.ps-time{background:#1D2B53;color:#fff;border-radius:16px;padding:12px;text-align:center}
.ps-time b{display:block;font-size:clamp(1.4rem,3.5vw,2.2rem);color:#FFD84D}
.ps-list{display:grid;gap:5px}.ps-list div{font-weight:700;border-radius:10px;padding:4px 8px;background:#F4FAFF}
.ps-list .ok{background:#E3F8E6}.ps-list .bad{background:#FFE7E3}
.ps-math{font-weight:700;color:#55607E;font-size:.9rem}
.ps-robot{font-size:4rem;text-align:center;line-height:1}
.ps-guess{font-family:ui-monospace,Menlo,monospace;font-size:clamp(2rem,6vw,3.4rem);font-weight:900;text-align:center;letter-spacing:.15em;background:#111a35;color:#8BFFB0;border-radius:16px;padding:10px}
.ps-guess.hit{color:#FFD84D;animation:pop .4s}@keyframes pop{0%{transform:scale(1.15)}}
.ps-race{display:grid;gap:8px}
.ps-row{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:8px;align-items:center;font-weight:800}
@media (max-width:600px){.ps-row{grid-template-columns:1fr}}
.ps-row .bar{height:22px;border:3px solid var(--ink);border-radius:99px;background:#E3E8F2;overflow:hidden}.ps-row .bar i{display:block;height:100%;background:var(--bc)}
.ps-words{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ps-words span{border:4px solid var(--ink);border-radius:14px;padding:8px 14px;font-weight:900;font-size:1.4rem;background:var(--wc);animation:pop .4s}
.ps-dice{font-size:2.6rem;text-align:center}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🔐", "Password Security Demonstrator");
const $=id=>document.getElementById(id);
const COMMON=['123456','password','123456789','12345678','12345','qwerty','abc123','111111','123123','1234567','password1','iloveyou','admin','welcome','monkey','dragon','football','baseball','letmein','sunshine','princess','qwerty123','1234','000000','superman','pokemon','minecraft','fortnite','starwars','hello','soccer','batman','shadow','master','michael','jordan','pass','test','login','computer','cookie','pizza','school','teacher','abcdef','password123','asdfgh','zxcvbn','1q2w3e','987654321'];
const WORDS='apple tiger rocket pencil cloud banana puppy river candle spoon dragon pizza window garden turtle jacket planet violin butter lemon marble castle rabbit forest pickle comet saddle walrus cactus muffin noodle orbit parrot quilt robot sock tulip unicorn waffle yogurt zebra anchor bubble cookie donut eagle feather goblin hammer igloo jelly kettle ladder mitten nugget otter pepper pumpkin raccoon sailor taco tractor umbrella velvet wizard yarn acorn beetle cherry dolphin engine fossil giraffe harbor island jungle koala lantern meadow nectar ocean pebble quartz ribbon spider thunder vanilla whistle canyon falcon glacier hippo lizard mango narwhal oyster panda rainbow scooter teapot volcano bagel cobra daisy ember fiddle gravy honey insect juice kitten llama magnet nacho pancake puzzle sprout tornado biscuit crayon dinosaur flamingo gumball helmet kayak lobster mushroom nutmeg octopus popcorn rooster sandal toaster'.split(' ');
let tab='check',show=false,crack=null;
document.querySelector('main').innerHTML=`<div class="ps-tabs"><button class="btn" data-t="check">🔎 Test a password</button><button class="btn white" data-t="crack">🤖 Robot guesser</button><button class="btn white" data-t="phrase">🎲 Passphrase maker</button></div>
<div class="ps-safe">🔒 This page never saves or sends anything you type. Still, never type a real password in front of the class!</div><div id="bd"></div>`;
function analyze(p){let cs=0;const has={lo:/[a-z]/.test(p),up:/[A-Z]/.test(p),di:/[0-9]/.test(p),sy:/[^a-zA-Z0-9]/.test(p)};cs=(has.lo?26:0)+(has.up?26:0)+(has.di?10:0)+(has.sy?33:0);
 let bits=p.length?p.length*Math.log2(cs||1):0;const low=p.toLowerCase(),issues=[];
 if(COMMON.includes(low)){bits=Math.min(bits,4);issues.push('It\'s one of the most common passwords in the world. Robots try these first!')}
 const word=WORDS.find(w=>w.length>=4&&low.includes(w))||COMMON.find(w=>w.length>=4&&/^[a-z]+$/.test(w)&&low.includes(w));if(word&&!COMMON.includes(low)){bits-=word.length*2.5;issues.push(`It contains the word "${word}". Robots try dictionary words early.`)}
 if(/(012|123|234|345|456|567|678|789|abc|bcd|cde|qwe|wer|asd|zxc)/i.test(p)){bits-=6;issues.push('It has a pattern like 123, abc or qwe.')}
 if(/(.)\1\1/.test(p)){bits-=6;issues.push('It repeats the same character 3 times in a row.')}
 if(/^[A-Z][a-z]+\d{1,4}[!?.]?$/.test(p)){bits-=8;issues.push('Capital letter + word + number at the end is a pattern robots know about.')}
 bits=Math.max(0,bits);return {has,cs,bits,issues,len:p.length}}
function human(sec){if(sec<1)return'less than a second';const u=[[60,'second'],[60,'minute'],[24,'hour'],[365,'day'],[1000,'year'],[1000,'thousand years'],[1000,'million years'],[1e9,'billion years']];let v=sec,i=0;for(;i<u.length-1&&v>=u[i][0];i++)v/=u[i][0];if(i>=6)return'longer than the universe has existed 🌌';v=Math.round(v);return `${v.toLocaleString()} ${u[i][1]}${v===1||u[i][1].includes('thousand')||u[i][1].includes('million')?'':'s'}`}
const GPS=1e10;// guesses per second for a fast computer
function check(){$('bd').innerHTML=`<div class="ps"><div class="ps-box"><div class="ps-in"><input id="pw" type="password" autocomplete="off" spellcheck="false" placeholder="Type a pretend password"><button class="btn white" id="sh">👁️</button></div><div class="ps-meter"><i id="mt"></i></div><div class="ps-lvl" id="lv">Start typing…</div><div class="ps-time">🤖 A fast computer guessing 10 billion times a second could crack it in about<b id="tm">—</b></div><div class="ps-math" id="mh"></div></div>
<div class="ps-box"><b>✅ Checklist</b><div class="ps-list" id="cl"></div><b>⚠️ Problems</b><div class="ps-list" id="is"></div><b>🧪 Try these</b><div class="row" style="gap:6px">${['password','Fluffy2015','tR7$','correct horse battery staple','pizza-rocket-violin-otter'].map(x=>`<button class="btn white small" data-try="${x}">${x}</button>`).join('')}</div></div></div>`;
 const upd=()=>{const p=$('pw').value,a=analyze(p),pct=Math.min(100,a.bits/80*100),L=a.bits<28?['😱 Very weak','#E5533F']:a.bits<40?['😟 Weak','#FF9F43']:a.bits<60?['🙂 OK','#FFC93C']:a.bits<80?['💪 Strong','#5DC66E']:['🏰 Super strong','#2E9E47'];
  $('mt').style.width=(p?Math.max(4,pct):0)+'%';$('mt').style.background=L[1];$('lv').textContent=p?L[0]:'Start typing…';const sec=Math.pow(2,a.bits)/2/GPS;$('tm').textContent=p?human(sec):'—';
  $('mh').textContent=p?`${a.len} characters, each one of about ${a.cs} choices = ${a.cs}^${a.len} combinations${a.issues.length?' (but the problems below make it much easier to guess)':''}.`:'';
  $('cl').innerHTML=[[a.len>=12,'12 or more characters'],[a.has.lo,'lowercase letters'],[a.has.up,'UPPERCASE letters'],[a.has.di,'numbers'],[a.has.sy,'symbols like ! $ -']].map(([ok,t])=>`<div class="${ok?'ok':''}">${ok?'✅':'⬜'} ${t}</div>`).join('');
  $('is').innerHTML=a.issues.map(t=>`<div class="bad">⚠️ ${t}</div>`).join('')||`<div class="ok">${p?'No common patterns found!':'—'}</div>`;window.__t={bits:a.bits,level:p?L[0]:'',time:$('tm').textContent}};
 $('pw').oninput=upd;$('sh').onclick=()=>{show=!show;$('pw').type=show?'text':'password'};document.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>{$('pw').value=b.dataset.try;$('pw').type='text';show=true;upd()});upd()}
function crackTab(){$('bd').innerHTML=`<div class="ps"><div class="ps-box"><b>🔢 Pick a secret PIN for the robot to crack</b><div class="row" style="gap:6px"><select id="ln" style="width:auto"><option value="2">2 digits</option><option value="3" selected>3 digits</option><option value="4">4 digits</option></select><input id="pin" type="password" inputmode="numeric" maxlength="4" style="width:110px;font-size:1.3rem;font-weight:900" placeholder="e.g. 427"><button class="btn green" id="go">🤖 Start guessing</button></div>
<div class="ps-robot" id="rb">🤖</div><div class="ps-guess" id="gs">---</div><div style="text-align:center;font-weight:800" id="gc">The robot tries 0, 1, 2, 3… every possible code, in order.</div></div>
<div class="ps-box"><b>📈 How many guesses would it need?</b><div class="ps-race" id="rc"></div><div class="ps-math">Every extra character multiplies the number of guesses. That's why longer is stronger!</div></div></div>`;
 const rows=[['3-digit PIN',1e3,'#FFB3AA'],['4-digit PIN',1e4,'#FFB3AA'],['6 lowercase letters',26**6,'#FFD27F'],['8 mixed characters',95**8,'#C9E58A'],['4 random words',WORDS.length**4,'#9FD8FF'],['12 mixed characters',95**12,'#8BE09A']];const mx=Math.log10(95**12);
 $('rc').innerHTML=rows.map(r=>`<div class="ps-row"><span>${r[0]}</span><div class="bar"><i style="--bc:${r[2]};width:${Math.max(2,Math.log10(r[1])/mx*100)}%"></i></div><span>${human(r[1]/2/GPS)}</span></div>`).join('');
 $('ln').onchange=()=>{$('pin').maxLength=+$('ln').value;$('pin').value='';$('gs').textContent='-'.repeat(+$('ln').value)};
 $('go').onclick=()=>{const n=+$('ln').value,p=$('pin').value.replace(/\D/g,'');if(p.length!==n){$('gc').textContent=`Type exactly ${n} digits first!`;return}clearInterval(crack);let g=0;const target=+p,start=Date.now(),per=n===2?1:n===3?7:61;$('gs').classList.remove('hit');$('rb').textContent='🤖';
  crack=setInterval(()=>{for(let k=0;k<per&&g<target;k++)g++;$('gs').textContent=String(g).padStart(n,'0');$('gc').textContent=`Guess #${(g+1).toLocaleString()} of ${(10**n).toLocaleString()} possible codes`;
   if(g>=target){clearInterval(crack);$('gs').classList.add('hit');$('rb').textContent='🤖🔓';Kit.tada();$('gc').textContent=`Cracked in ${(g+1).toLocaleString()} guesses! A real computer would take ${human((g+1)/GPS)}.`;window.__t={cracked:true,guesses:g+1}}},window.__fast?1:30);window.__t={cracked:false}}}
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function phrase(){const C=['#FFB3AA','#FFD27F','#C9E58A','#9FD8FF','#D6C2FF','#FF9FCB'];$('bd').innerHTML=`<div class="ps-box" style="max-width:860px;margin:0 auto;text-align:center"><div class="ps-dice" id="dc">🎲🎲🎲🎲</div><div class="row" style="justify-content:center;gap:6px"><select id="nw" style="width:auto"><option value="3">3 words</option><option value="4" selected>4 words</option><option value="5">5 words</option></select><select id="sp" style="width:auto"><option value="-">dash-between</option><option value=" ">space between</option><option value="">NoSpaces</option></select><button class="btn green big" id="rl">🎲 Roll</button></div>
<div class="ps-words" id="ws"></div><div class="ps-time">🤖 Even if the robot knows the ${WORDS.length}-word list, it would need about<b id="tm">—</b></div><div class="ps-math" id="mh"></div><div class="ps-math">Make up a silly picture in your head to remember it, like a pizza riding a rocket while playing violin to an otter. Long and random beats short and complicated!</div></div>`;
 const roll=()=>{const n=+$('nw').value,sp=$('sp').value;const ws=Array.from({length:n},()=>WORDS[rnd(WORDS.length)]);const shown=sp===''?ws.map(w=>w[0].toUpperCase()+w.slice(1)):ws;
  $('ws').innerHTML=shown.map((w,i)=>`<span style="--wc:${C[i%C.length]}">${w}</span>`).join(`<span style="border:0;background:none;padding:8px 0">${sp===' '?'␣':sp||''}</span>`);const comb=WORDS.length**n;$('tm').textContent=human(comb/2/GPS);
  $('mh').textContent=`${WORDS.length} words, picked ${n} times = ${WORDS.length}^${n} ≈ ${comb.toExponential(1).replace('e+',' × 10^')} combinations.`;$('dc').textContent='🎲'.repeat(n);Kit.tick();window.__t={words:ws,n}};
 $('rl').onclick=roll;$('nw').onchange=roll;$('sp').onchange=roll;roll()}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{clearInterval(crack);tab=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.className='btn '+(x.dataset.t===tab?'':'white'));({check,crack:crackTab,phrase})[tab]()});
window.__p={analyze,human};
check();
</script>
</body></html>
