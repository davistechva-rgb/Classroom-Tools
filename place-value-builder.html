<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Place Value Builder</title>
<style>
main{max-width:1600px}
.pv-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
.pv-goal{background:#fff;border:5px solid var(--ink);border-radius:20px;padding:10px 16px;text-align:center;font-weight:900;font-size:clamp(1.2rem,3vw,1.7rem);margin-bottom:12px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.pv-goal .big{font:900 clamp(2.2rem,7vw,3.4rem) Fredoka,sans-serif;background:#FFC93C;border:5px solid var(--ink);border-radius:16px;padding:0 16px;letter-spacing:.06em}
.pv-goal input{font:900 2rem Fredoka,sans-serif;width:150px;text-align:center;border:5px solid var(--ink);border-radius:14px}
.pv-mat{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.pv-col{background:var(--bg);border:5px solid var(--ink);border-radius:20px;display:grid;grid-template-rows:auto 1fr auto auto;min-height:420px;overflow:hidden}
.pv-col h3{margin:0;text-align:center;background:var(--hd);color:#fff;padding:6px;font-size:clamp(.85rem,2vw,1.1rem);text-shadow:1px 1px 0 var(--ink)}
.pv-blocks{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-end;justify-content:center;padding:8px}
.pv-blocks>*{cursor:pointer;animation:drop .3s}@keyframes drop{0%{transform:translateY(-30px);opacity:0}}
.pv-one{width:20px;height:20px;background:#FFC93C;border:2px solid var(--ink);border-radius:3px}
.pv-ten{width:20px;height:150px;background:repeating-linear-gradient(#5DC66E 0 13px,#2E7D4F 13px 15px);border:2px solid var(--ink);border-radius:3px}
.pv-hun{width:80px;height:80px;background:repeating-linear-gradient(90deg,transparent 0 6px,#1E5FA088 6px 8px),repeating-linear-gradient(#22C3E6 0 6px,#1E5FA0 6px 8px);border:2px solid var(--ink);border-radius:3px}
.pv-tho{width:70px;height:70px;font-size:3.4rem;line-height:70px;text-align:center;filter:hue-rotate(250deg)}
.pv-cnt{text-align:center;font:900 2rem Fredoka,sans-serif;background:#fff;border-top:4px solid var(--ink)}
.pv-cnt.over{background:#FFD3CC;color:#E5533F}
.pv-ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:6px;background:#fff;border-top:3px dashed #B8C2D6}
.pv-ctl button{font:inherit;font-weight:900;font-size:.85rem;border:3px solid var(--ink);border-radius:10px;padding:5px 2px;background:#fff;cursor:pointer;color:var(--ink)}
.pv-ctl .add{background:#C8F3D0}.pv-ctl .tr{grid-column:1/-1;background:#FFF1A8}
.pv-ctl button:disabled{opacity:.3;cursor:default}
.pv-sum{background:#fff;border:5px solid var(--ink);border-radius:20px;padding:10px 16px;margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-weight:900;font-size:clamp(1.1rem,2.6vw,1.5rem)}
.pv-sum .exp{font-family:ui-monospace,Menlo,monospace}
.pv-msg{font-weight:900;font-size:1.25rem;text-align:center;min-height:1.5em;margin-top:8px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
@media (max-width:700px){.pv-col{min-height:340px}.pv-ten{height:110px;width:14px}.pv-hun{width:56px;height:56px}.pv-one{width:15px;height:15px}.pv-tho{width:50px;height:50px;font-size:2.4rem;line-height:50px}}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🔢", "Place Value Builder");
const $=id=>document.getElementById(id);
const PL=[['Thousands','tho',1000,'#F3E8FF','#9B6BF2'],['Hundreds','hun',100,'#E3F6FF','#1E7FD0'],['Tens','ten',10,'#E6F8EA','#2E9E47'],['Ones','one',1,'#FFF8DB','#E8A317']];
let mode=Kit.get('pv-mode','build'),size=Kit.get('pv-size',3),C=[0,0,0,0],target=0,stars=Kit.get('pv-stars',0),done=false;
const cols=()=>PL.slice(4-size);const off=()=>4-size;
const val=()=>C.reduce((s,c,i)=>s+c*PL[i][2],0);
function newRound(){done=false;const lo=size===2?10:size===3?100:1000;target=Kit.rand(lo,lo*10-1);C=[0,0,0,0];
 if(mode==='read'){let t=target;PL.forEach((p,i)=>{if(i<off())return;C[i]=Math.floor(t/p[2]);t%=p[2]})}
 if(mode==='trade'){// start with the number made the "wrong" way: too many ones/tens
  let t=target;PL.forEach((p,i)=>{if(i<off())return;C[i]=Math.floor(t/p[2]);t%=p[2]});for(let k=0;k<3;k++){const i=Kit.rand(off(),2);if(C[i]>0){C[i]--;C[i+1]+=10}}}
 $('mg').textContent='';draw()}
document.querySelector('main').innerHTML=`<div class="pv-top"><select id="md" style="width:auto"><option value="build">🧱 Build the number</option><option value="read">👀 What number is this?</option><option value="trade">🔄 Trade to make it neat</option><option value="free">🎨 Free build</option></select><select id="sz" style="width:auto"><option value="2">2 digits</option><option value="3">3 digits</option><option value="4">4 digits</option></select><button class="btn green" id="nw">🎲 New number</button><span style="font-weight:900;color:#fff;text-shadow:2px 2px 0 var(--ink)" id="sr"></span></div>
<div class="pv-goal" id="gl"></div><div class="pv-mat" id="mt"></div><div class="pv-sum" id="sm"></div><div class="pv-msg" id="mg"></div>`;
function draw(){$('md').value=mode;$('sz').value=size;$('sr').textContent=`⭐ ${stars}`;const v=val(),neat=C.every(c=>c<10);
 $('gl').innerHTML=mode==='build'?`Build <span class="big">${target.toLocaleString()}</span> with blocks <button class="btn green" id="ck">✅ Check</button>`:mode==='read'?`What number do the blocks show? <input id="ra" type="number" inputmode="numeric"> <button class="btn green" id="ck">✅ Check</button>`:mode==='trade'?`These blocks show <span class="big">${target.toLocaleString()}</span> but it's messy! Trade so each column has 9 or fewer. <button class="btn green" id="ck">✅ Check</button>`:`🎨 Build any number you like!`;
 $('mt').style.setProperty('--n',size);
 $('mt').innerHTML=cols().map((p,j)=>{const i=j+off(),n=C[i];return `<div class="pv-col" style="--bg:${p[3]};--hd:${p[4]}"><h3>${p[0]}</h3><div class="pv-blocks" data-i="${i}">${Array(n).fill(p[1]==='tho'?'<div class="pv-tho" title="1000">🧊</div>':`<div class="pv-${p[1]}" title="${p[2]}"></div>`).join('')}</div><div class="pv-cnt ${n>9?'over':''}">${n}</div>${mode==='read'?'':`<div class="pv-ctl"><button class="add" data-a="${i}">+1</button><button data-m="${i}" ${n?'':'disabled'}>−1</button>${i>off()?`<button class="tr" data-u="${i}" ${n>=10?'':'disabled'}>⬅ Trade 10 for 1</button>`:''}${i<3?`<button class="tr" data-b="${i}" ${n?'':'disabled'}>➡ Break into 10</button>`:''}</div>`}</div>`}).join('');
 $('sm').innerHTML=mode==='read'&&!done?'<span>🤔 Count each column, then put it together!</span>':`<span>= ${v.toLocaleString()}</span><span class="exp">${cols().map((p,j)=>C[j+off()]*p[2]).filter(Boolean).join(' + ')||'0'}</span>`;
 const ck=$('ck');if(ck)ck.onclick=check;window.__t={mode,target,C:[...C],val:v,stars,done}}
function win(t){$('mg').textContent=t;if(!done){stars++;Kit.set('pv-stars',stars);done=true}Kit.tada();Kit.confetti(100);draw()}
function check(){const v=val(),neat=C.every(c=>c<10);
 if(mode==='build'){if(v===target&&neat)win(`🎉 That's ${target.toLocaleString()}!`);else if(v===target)$('mg').textContent='✅ Right amount! But a column has more than 9. Trade 10 for 1!';else $('mg').textContent=v<target?`You have ${v.toLocaleString()}. You need ${(target-v).toLocaleString()} more.`:`You have ${v.toLocaleString()}. That's ${(v-target).toLocaleString()} too many.`}
 if(mode==='read'){const a=+$('ra').value;if(a===target){done=false;win(`🎉 Yes, ${target.toLocaleString()}!`)}else{$('mg').textContent='❌ Count again. Each column is worth a different amount!';Kit.tone(200,.2,'triangle',.1)}}
 if(mode==='trade'){if(neat&&v===target)win('🎉 Neat and tidy! Every column has 9 or fewer.');else $('mg').textContent='Some columns still have 10 or more. Trade them!'}}
$('mt').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.a){C[+b.dataset.a]++;Kit.tone(500+(+b.dataset.a)*100,.05,'triangle',.08)}
 if(b.dataset.m){C[+b.dataset.m]--;Kit.tick()}
 if(b.dataset.u){const i=+b.dataset.u;C[i]-=10;C[i-1]++;Kit.ding();$('mg').textContent=`🔄 10 ${PL[i][0].toLowerCase()} = 1 ${PL[i-1][0].toLowerCase().replace(/s$/,'')}!`}
 if(b.dataset.b){const i=+b.dataset.b;C[i]--;C[i+1]+=10;Kit.ding();$('mg').textContent=`🔨 1 ${PL[i][0].toLowerCase().replace(/s$/,'')} = 10 ${PL[i+1][0].toLowerCase()}!`}
 draw()};
$('md').onchange=()=>{mode=$('md').value;Kit.set('pv-mode',mode);newRound()};$('sz').onchange=()=>{size=+$('sz').value;Kit.set('pv-size',size);newRound()};$('nw').onclick=newRound;
window.__pv={set:(t,c)=>{target=t;if(c)C=c;done=false;draw()}};
newRound();
</script>
</body></html>
