<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Mystery Reward System</title>
<style>
main{max-width:1500px}
.mr-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
.mr-stage{background:radial-gradient(circle at 50% 30%,#5B3B8F,#1D1440 75%);border:6px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--ink);padding:18px;min-height:470px;color:#fff;text-align:center;display:grid;gap:14px;align-content:start;position:relative;overflow:hidden}
.mr-stage h2{margin:0;text-shadow:3px 3px 0 #000}
.mr-boxes{display:flex;gap:clamp(10px,3vw,40px);justify-content:center;flex-wrap:wrap;margin-top:10px}
.mr-box{width:clamp(110px,22vw,200px);aspect-ratio:1;border:none;background:none;cursor:pointer;position:relative;perspective:600px}
.mr-box .ch{font-size:clamp(5rem,13vw,9rem);display:block;transition:transform .3s;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.mr-box:hover .ch{transform:translateY(-8px) rotate(-4deg)}
.mr-box.shake .ch{animation:sh .12s 8}@keyframes sh{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.mr-box.open .ch{opacity:.25}
.mr-box .prize{position:absolute;inset:0;display:grid;place-items:center;align-content:center;animation:up .7s;font-weight:900}
.mr-box .prize span{font-size:clamp(3.5rem,9vw,6rem)}
@keyframes up{0%{transform:translateY(40px) scale(.2);opacity:0}}
.mr-box .prize b{background:var(--rc);color:#1D2B53;border:3px solid #fff;border-radius:99px;padding:1px 10px;font-size:.85rem}
.mr-box.dim{opacity:.55}
.mr-glow{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,var(--rc),transparent 65%);animation:pulse 1s infinite alternate;z-index:-1}
@keyframes pulse{to{transform:scale(1.15)}}
.mr-win{font-size:clamp(1.4rem,3.5vw,2.2rem);font-weight:900;min-height:1.5em;text-shadow:2px 2px 0 #000}
.mr-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:860px){.mr-side{grid-template-columns:minmax(0,1fr)}}
.mr-p{background:#fff;border:5px solid var(--ink);border-radius:20px;padding:12px;display:grid;gap:8px}
.mr-odds{display:grid;gap:4px}.mr-odds div{display:flex;justify-content:space-between;border-radius:10px;padding:3px 10px;font-weight:800;background:var(--rc)}
.mr-log{max-height:220px;overflow:auto;display:grid;gap:3px;font-weight:700;font-size:.9rem}.mr-log div{background:#F4FAFF;border-radius:8px;padding:2px 8px}
.mr-tix{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:5px;max-height:240px;overflow:auto}
.mr-tix div{display:flex;justify-content:space-between;align-items:center;border:3px solid var(--ink);border-radius:10px;padding:2px 6px;font-weight:800;font-size:.9rem}
.mr-tix button{border:2px solid var(--ink);border-radius:8px;background:#C8F3D0;cursor:pointer;font-weight:900}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script><script src="rewards.js"></script>
<script>
Kit.mount("🎁", "Mystery Reward System");
const $=id=>document.getElementById(id);
const RAR={common:['⚪ Common','#E3E8F2',60],rare:['🔵 Rare','#9FD8FF',25],epic:['🟣 Epic','#D6C2FF',12],legend:['🟡 Legendary','#FFD84D',3]};
const P0=`common | ✏️ | A fun pencil
common | 🌟 | Sticker of your choice
common | 🎵 | Pick a song for clean-up
common | 👟 | Wear slippers in class
rare | 🪑 | Sit anywhere for the day
rare | 🎨 | 10 minutes of free drawing
rare | 🎲 | Choose the brain break
epic | 👑 | Teacher's helper for the day
epic | 🍿 | Snack party ticket
legend | 🏆 | Lunch with the teacher
legend | 🎉 | Class gets 10 extra recess minutes`;
Kit.editable({key:'mystery-prizes',title:'Mystery prizes',help:'(one per line: common, rare, epic or legend | emoji | prize)',def:P0});
const prizes=()=>Kit.lines(Kit.get('ed:mystery-prizes',P0)).map(l=>{const p=l.split('|').map(s=>s.trim());return {r:RAR[p[0]]?p[0]:'common',e:p[1]||'🎁',n:p[2]||'Mystery prize'}});
let tix=Kit.get('mr-tix',{}),log=Kit.get('mr-log',[]),who=null,busy=false,mode=Kit.get('mr-mode','ticket'),cost=Kit.get('mr-cost',10);
function save(){Kit.set('mr-tix',tix);Kit.set('mr-log',log);Kit.set('mr-mode',mode);Kit.set('mr-cost',cost)}
function roll(){const P=prizes(),w=Object.entries(RAR).filter(([k])=>P.some(p=>p.r===k));let t=Math.random()*w.reduce((s,x)=>s+x[1][2],0);let rr=w[0][0];for(const [k,v] of w){if((t-=v[2])<0){rr=k;break}}return Kit.pick(P.filter(p=>p.r===rr))}
document.querySelector('main').innerHTML=`<div class="mr-top"><b style="color:#fff;text-shadow:1px 1px 0 var(--ink)">🧒 Who's opening?</b><select id="who" style="width:auto"></select><select id="md" style="width:auto"><option value="ticket">🎟️ Uses a ticket</option><option value="coins">🪙 Costs coins</option><option value="free">🆓 Free</option></select><span id="cs"><input id="cost" type="number" min="1" max="200" style="width:70px"> 🪙</span></div>
<div class="mr-stage"><h2 id="hd">🎁 Pick a mystery box!</h2><div class="mr-boxes" id="bx"></div><div class="mr-win" id="wn"></div><button class="btn big" id="ag" style="background:var(--sun);justify-self:center" hidden>🔁 Next student</button></div>
<div class="mr-side"><div class="mr-p"><b>🎟️ Tickets</b><div class="mr-tix" id="tk"></div><div class="row" style="gap:6px"><button class="btn white small" id="ta">🎟️ +1 ticket for everyone</button></div><b>🎲 Chances</b><div class="mr-odds" id="od"></div></div><div class="mr-p"><b>📜 Prizes won</b><div class="mr-log" id="lg"></div><button class="btn white small" id="lc">🧽 Clear list</button></div></div>
<div id="ro" style="margin-top:12px;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px"></div>`;
Learn.rosterEditor($('ro'));$('ro').addEventListener('roster',()=>draw());
function can(){if(mode==='free')return true;if(mode==='ticket')return (tix[who]||0)>0;return RW.coins(who)>=cost}
function draw(){const K=RW.kids();who=who&&K.includes(who)?who:K[0];$('who').innerHTML=K.map(k=>`<option ${k===who?'selected':''}>${Kit.esc(k)}</option>`).join('');$('md').value=mode;$('cost').value=cost;$('cs').hidden=mode!=='coins';
 $('tk').innerHTML=K.map(k=>`<div><span>${Kit.esc(k)} 🎟️${tix[k]||0}</span><button data-t="${Kit.esc(k)}">+1</button></div>`).join('');
 const P=prizes(),tot=Object.entries(RAR).filter(([k])=>P.some(p=>p.r===k)).reduce((s,x)=>s+x[1][2],0);$('od').innerHTML=Object.entries(RAR).filter(([k])=>P.some(p=>p.r===k)).map(([k,v])=>`<div style="--rc:${v[1]}"><span>${v[0]}</span><span>${Math.round(v[2]/tot*100)}%</span></div>`).join('');
 $('lg').innerHTML=log.slice(0,40).map(l=>`<div>${l[1]} ${Kit.esc(l[0])}: ${Kit.esc(l[2])}</div>`).join('')||'<div>No prizes yet!</div>';
 if(!busy&&!$('bx').dataset.done)boxes();$('hd').textContent=can()?`🎁 ${who}, pick a mystery box!`:mode==='ticket'?`🎟️ ${who} needs a ticket first`:`🪙 ${who} needs ${cost} coins (has ${RW.coins(who)})`;
 window.__t={who,tix:tix[who]||0,log:log.length,mode}}
function boxes(){$('bx').innerHTML=['🎁','🧰','📦'].map((e,i)=>`<button class="mr-box" data-b="${i}"><span class="ch">${e}</span></button>`).join('');delete $('bx').dataset.done}
$('bx').onclick=async e=>{const b=e.target.closest('[data-b]');if(!b||busy||$('bx').dataset.done)return;if(!can()){Kit.tone(200,.2,'triangle',.15);draw();return}
 if(mode==='ticket'){tix[who]--;}else if(mode==='coins'){RW.addCoins(who,-cost,'Mystery box')}busy=true;
 const picks=[0,1,2].map(()=>roll()),i=+b.dataset.b;b.classList.add('shake');Kit.tone(300,.1,'square',.08);await Kit.sleep(window.__fast?1:1000);
 const show=(btn,p,mine)=>{btn.classList.add('open');btn.insertAdjacentHTML('beforeend',`${mine&&p.r!=='common'?`<div class="mr-glow" style="--rc:${RAR[p.r][1]}"></div>`:''}<div class="prize" style="--rc:${RAR[p.r][1]}"><span>${p.e}</span><b>${RAR[p.r][0]}</b></div>`)};
 show(b,picks[i],true);const p=picks[i];$('wn').textContent=`${who} won: ${p.e} ${p.n}!`;p.r==='legend'?(Kit.tada(),Kit.confetti(150)):p.r==='epic'?(Kit.tada(),Kit.confetti(70)):Kit.ding();
 log.unshift([who,p.e,p.n,Date.now()]);log=log.slice(0,100);save();await Kit.sleep(window.__fast?1:900);
 [...$('bx').children].forEach((x,k)=>{if(k!==i){x.classList.add('dim');show(x,picks[k],false)}});$('wn').insertAdjacentHTML('beforeend',`<div style="font-size:1rem;font-weight:700">The other boxes had: ${picks.filter((_,k)=>k!==i).map(q=>q.e+' '+q.n).join(' · ')}</div>`);
 $('bx').dataset.done=1;busy=false;$('ag').hidden=false;window.__t.won=p.n;draw()};
$('ag').onclick=()=>{const K=RW.kids();who=K[(K.indexOf(who)+1)%K.length];$('wn').textContent='';$('ag').hidden=true;delete $('bx').dataset.done;boxes();draw()};
$('who').onchange=()=>{who=$('who').value;$('wn').textContent='';$('ag').hidden=true;delete $('bx').dataset.done;boxes();draw()};
$('md').onchange=()=>{mode=$('md').value;save();draw()};$('cost').oninput=()=>{cost=Math.max(1,+$('cost').value||1);save();draw()};
$('tk').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tix[b.dataset.t]=(tix[b.dataset.t]||0)+1;save();Kit.tick();draw()}};
$('ta').onclick=()=>{RW.kids().forEach(k=>tix[k]=(tix[k]||0)+1);save();Kit.ding();draw()};$('lc').onclick=()=>{log=[];save();draw()};
window.__m={who:k=>{who=k;$('ag').hidden=true;boxes();draw()},roll};
draw();
</script>
</body></html>
