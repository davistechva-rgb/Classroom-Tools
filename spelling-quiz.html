<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Spelling Quiz</title>
<style>.speak{font-size:4.5rem;width:150px;height:150px;border-radius:50%;background:var(--sun);border:6px solid var(--ink);box-shadow:6px 6px 0 var(--ink);cursor:pointer;margin:18px 0 14px}
.speak:active{transform:translate(5px,5px);box-shadow:1px 1px 0 var(--ink)}.msg{font-size:1.7rem;font-weight:700;min-height:1.3em}</style></head>
<body>
<main>
<div class="grid2">
 <div class="card stack setup">
  <label for="list">Spelling words. One per line. Add a sentence after a | if you want.</label>
  <textarea id="list"></textarea>
  <label><input type="checkbox" id="shuf" checked> Mix up the order</label>
 </div>
 <div class="card center">
  <div class="row" style="justify-content:center"><span class="chip" id="prog">Ready</span><span class="chip">⭐ <b id="score">0</b></span></div>
  <button class="speak" id="say" aria-label="Hear the word">🔊</button>
  <div class="row" style="justify-content:center"><button class="btn small white" id="slow">🐢 Say it slowly</button><button class="btn small white" id="sent">Use it in a sentence</button></div>
  <input type="text" id="ans" placeholder="Type the word" autocomplete="off" autocapitalize="off" spellcheck="false" style="max-width:380px;font-size:1.8rem;text-align:center;margin-top:18px">
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn green big" id="check">Check</button></div>
  <p id="msg" class="msg"></p>
  <button class="btn grape" id="start">Start the quiz</button>
 </div>
</div></main>
<script src="kit.js"></script>
<script>
Kit.mount('📖', 'Spelling Quiz');

const $=id=>document.getElementById(id);
$('list').value=Kit.get('sp-list',`because | I stayed inside because it was raining.
friend | My friend sits next to me.
people | Many people came to the game.
school | We ride the bus to school.
favorite | Pizza is my favorite food.
different | Every snowflake is different.
beautiful | The sunset was beautiful.
enough | Do we have enough chairs?`);$('list').oninput=()=>Kit.set('sp-list',$('list').value);
let Q=[],i=-1,score=0,miss=[],busy=false;
function say(t,rate=.85){if(!('speechSynthesis' in window)){$('msg').textContent='This browser cannot read words out loud.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=rate;u.lang='en-US';speechSynthesis.speak(u)}
function next(){i++;busy=false;if(i>=Q.length)return done();$('prog').textContent=`Word ${i+1} of ${Q.length}`;$('ans').value='';$('msg').textContent='';$('ans').focus();setTimeout(()=>say(Q[i][0]),300)}
function done(){$('prog').textContent='Done';Kit.tada();if(score/Q.length>=.7)Kit.confetti();
 Kit.modal(`<h2 style="font-size:2.2rem;margin:0">${score} out of ${Q.length} spelled right</h2>${miss.length?`<p style="font-size:1.2rem">Words to practice:</p><p>${miss.map(w=>`<span class="chip">${Kit.esc(w)}</span>`).join('')}</p>`:'<p style="font-size:1.3rem">Perfect score! 🎉</p>'}`)}
$('start').onclick=()=>{Q=Kit.lines($('list').value).map(l=>l.split('|').map(s=>s.trim())).filter(p=>p[0]);if(!Q.length)return;if($('shuf').checked)Q=Kit.shuffle(Q);i=-1;score=0;miss=[];$('score').textContent=0;next()};
$('say').onclick=()=>Q[i]?say(Q[i][0]):$('start').click();$('slow').onclick=()=>Q[i]&&say(Q[i][0],.45);
$('sent').onclick=()=>Q[i]&&say(Q[i][1]?`${Q[i][0]}. ${Q[i][1]} ${Q[i][0]}.`:Q[i][0]);
$('check').onclick=()=>{if(!Q[i]||busy)return;busy=true;const w=Q[i][0];if($('ans').value.trim().toLowerCase()===w.toLowerCase()){score++;$('score').textContent=score;$('msg').textContent='Correct! 🎉';Kit.ding();setTimeout(next,1100)}
 else{miss.push(w);$('msg').innerHTML=`Almost! It's spelled <span style="color:var(--grape)">${Kit.esc(w)}</span>`;Kit.tone(170,.3,'sawtooth',.15);setTimeout(next,2600)}};
$('ans').onkeydown=e=>{if(e.key==='Enter')$('check').click()};

</script>
</body></html>
