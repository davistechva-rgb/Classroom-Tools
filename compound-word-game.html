<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Compound Word Game</title>
<style>
main{max-width:1300px}
.cw-hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.cw-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(14px,4vw,60px)}
.cw-col{display:grid;gap:10px;align-content:start}
.cw-col h3{margin:0;text-align:center;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.cw-w{font:inherit;font-weight:800;font-size:clamp(1.2rem,3vw,1.9rem);border:5px solid var(--ink);background:#fff;border-radius:18px;padding:10px;cursor:pointer;box-shadow:0 5px 0 var(--ink);color:var(--ink);transition:transform .15s}
.cw-col.a .cw-w{border-radius:18px 4px 4px 18px;background:#FFF1B8}.cw-col.b .cw-w{border-radius:4px 18px 18px 4px;background:#C9F1D2}
.cw-w.sel{transform:scale(1.06);outline:6px solid var(--grape)}
.cw-w.done{visibility:hidden}
.cw-made{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;min-height:70px}
.cw-chip{background:#fff;border:5px solid var(--ink);border-radius:18px;padding:6px 14px;font-weight:800;font-size:1.4rem;box-shadow:4px 4px 0 var(--ink);animation:cwIn .5s}
.cw-chip span{font-size:1.8rem;margin-right:6px}
@keyframes cwIn{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.cw-msg{text-align:center;font-weight:800;font-size:1.3rem;color:#fff;text-shadow:2px 2px 0 var(--ink);min-height:1.5em;margin:10px 0}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🧩", "Compound Word Game");
const $=id=>document.getElementById(id);
const P0=[['sun','flower','🌻'],['rain','bow','🌈'],['star','fish','⭐'],['butter','fly','🦋'],['snow','man','⛄'],['foot','ball','🏈'],['pan','cake','🥞'],['cup','cake','🧁'],['pop','corn','🍿'],['tooth','brush','🪥'],['fire','truck','🚒'],['bee','hive','🐝'],['sea','shell','🐚'],['lady','bug','🐞'],['rail','road','🛤️'],['air','plane','✈️'],['moon','light','🌙'],['tree','house','🏡'],['back','pack','🎒'],['water','melon','🍉'],['jelly','fish','🪼'],['snow','flake','❄️'],['gold','fish','🐠'],['basket','ball','🏀'],['sun','glasses','🕶️'],['light','house','🗼'],['hot','dog','🌭'],['book','worm','🐛'],['bed','room','🛏️'],['tea','pot','🫖'],['eye','ball','👁️'],['skate','board','🛹']];
let P=[];const parseP=t=>{const L=Kit.lines(t).map(l=>{const m=l.split('|').map(x=>x.trim());const [a,b]=(m[0]||'').split('+').map(x=>x.trim().toLowerCase());return a&&b?[a,b,m[1]||'✨']:null}).filter(Boolean);P=L.length>=3?L:P0};
parseP(Kit.editable({key:'compounds',title:'Compound words',help:'(one per line: first + second | picture emoji. At least 3.)',def:P0.map(p=>`${p[0]} + ${p[1]} | ${p[2]}`).join('\n'),onSave:t=>{parseP(t);deal()}}));
const SIZE=6;let round=[],A=[],B=[],sa=null,sc=0,miss=0,rn=0,t0=0;
document.querySelector('main').innerHTML=`<div class="cw-hud"><span class="ln-pill">Round <b id="rn">1</b></span><span class="ln-pill">⭐ <b id="sc">0</b></span><span class="ln-pill">❌ <b id="ms">0</b></span></div>
<div class="cw-msg" id="msg">Tap a word on the left, then the word on the right that sticks to it!</div>
<div class="cw-board"><div class="cw-col a"><h3>First half</h3><div class="cw-col" id="ca"></div></div><div class="cw-col b"><h3>Second half</h3><div class="cw-col" id="cb"></div></div></div><div class="cw-made" id="made"></div>`;
const isPair=(a,b)=>P.some(p=>p[0]===a&&p[1]===b);
function deal(){rn++;$('rn').textContent=rn;$('made').innerHTML='';sa=null;
 // pick pairs with unique halves so each left word has exactly one partner
 const pool=Kit.shuffle(P);round=[];for(const p of pool){if(round.length>=SIZE)break;if(round.some(r=>r[0]===p[0]||r[1]===p[1]))continue;if(round.some(r=>isPair(r[0],p[1])||isPair(p[0],r[1])))continue;round.push(p)}
 A=Kit.shuffle(round.map(r=>r[0]));B=Kit.shuffle(round.map(r=>r[1]));
 $('ca').innerHTML=A.map(w=>`<button class="cw-w" data-a="${w}">${w}</button>`).join('');$('cb').innerHTML=B.map(w=>`<button class="cw-w" data-b="${w}">${w}</button>`).join('');
 $('msg').textContent='Tap a word on the left, then the word on the right that sticks to it!';t0=Date.now();window.__t={round:round.map(r=>r.slice(0,2))}}
document.querySelector('.cw-board').onclick=e=>{const b=e.target.closest('.cw-w');if(!b||b.classList.contains('done'))return;
 if(b.dataset.a){document.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('sel',x===b));sa=b;Kit.tick();return}
 if(!sa){$('msg').textContent='👈 Pick a first half first.';return}
 const a=sa.dataset.a,w=b.dataset.b,p=round.find(r=>r[0]===a&&r[1]===w);
 if(p){sa.classList.add('done');b.classList.add('done');sa.classList.remove('sel');sa=null;sc++;Kit.ding();$('made').insertAdjacentHTML('beforeend',`<span class="cw-chip"><span>${p[2]}</span>${a}<b style="color:#9B6BF2">${w}</b></span>`);$('msg').textContent=`✨ ${a} + ${w} = ${a+w}!`;
  if(!document.querySelector('[data-a]:not(.done)')){const s=Math.round((Date.now()-t0)/1000);$("msg").textContent=`🎉 All ${round.length} built in ${s} seconds!`;Kit.tada();Kit.confetti(60);setTimeout(deal,2600)}}
 else{miss++;Learn.flash(b,false);$('msg').textContent=`🤔 "${a+w}" isn't a word. Try again!`}
 $('sc').textContent=sc;$('ms').textContent=miss};
deal();
</script>
</body></html>
