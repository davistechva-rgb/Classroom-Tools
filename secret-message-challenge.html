<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Secret Message Challenge</title>
<style>
.sm-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:860px){.sm-wrap{grid-template-columns:1fr}}
.sm-wheel{max-width:400px;margin:0 auto;position:relative}
.sm-wheel svg{width:100%;display:block;touch-action:none}
.sm-turn{display:flex;gap:10px;justify-content:center;margin-top:8px}
.sm-msg{background:#FFF6C9;border:5px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:16px}
.sm-w{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0}
.sm-word{display:flex;gap:3px}
.sm-word span{font:800 1.6rem/1 ui-monospace,Consolas,monospace;width:1.25em;text-align:center;border-bottom:3px solid var(--ink);padding:4px 0}
.sm-word.lock span{color:transparent;background:repeating-linear-gradient(45deg,#ddd 0 6px,#ccc 6px 12px);border-radius:4px}
.sm-key{background:#fff;border:4px solid var(--ink);border-radius:16px;padding:12px;margin-top:12px;font-weight:700}
.sm-key.lock{opacity:.6}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="escape.js"></script>
<script>
Kit.mount("✉️", "Secret Message Challenge");

Esc.setup({intro:'✉️🔡', minutes:15,
extra:`<label>Secret message (optional) <input type="text" id="smMsg" maxlength="60" placeholder="Leave empty for a random message" style="width:320px"></label>`,
read:()=>({msg:(document.getElementById('smMsg').value||'').toUpperCase().replace(/[^A-Z ]/g,'').replace(/\s+/g,' ').trim()}),
how:'A spy left a coded note! It uses a cipher wheel, where every letter is swapped for a letter further along the alphabet. Answer questions to uncover each coded word, and one more question to learn the KEY (which letter A turns into). Turn the inner wheel to match the key, decode the message, and type the LAST word to escape.',
start({room,extra}){
 const $=id=>document.getElementById(id);
 const MSGS=['THE DOOR CODE IS PIZZA','MEET ME BY THE OLD OAK TREE','THE PASSWORD IS BUTTERFLY','LOOK UNDER THE BLUE RUG','THE TREASURE IS IN THE CASTLE','SAY THE MAGIC WORD RAINBOW'];
 const plain=(extra.msg&&extra.msg.split(' ').length>=2?extra.msg:Kit.pick(MSGS));
 const shift=Kit.rand(3,22);const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 const enc=s=>s.replace(/[A-Z]/g,c=>A[(A.indexOf(c)+shift)%26]);
 const words=plain.split(' '),last=words[words.length-1];window.__sol={shift,last,plain};
 // group words into up to 4 coded chunks
 const chunks=[];const per=Math.ceil(words.length/Math.min(4,words.length));for(let i=0;i<words.length;i+=per)chunks.push(words.slice(i,i+per));
 const R1=150,R2=112;
 room.innerHTML=`<div class="sm-wrap"><div><div class="sm-wheel"><svg viewBox="-170 -170 340 340" id="svg" aria-label="Cipher wheel">
  <circle r="165" fill="#FFC93C" stroke="#1D2B53" stroke-width="6"/>${[...A].map((c,i)=>{const a=i*360/26;return `<g transform="rotate(${a})"><text y="-${R1-8}" text-anchor="middle" font-size="20" font-weight="800" fill="#1D2B53" font-family="sans-serif">${c}</text><line y1="-165" y2="-128" stroke="#1D2B53" stroke-opacity=".25" transform="rotate(${180/26})"/></g>`}).join('')}
  <g id="inner"><circle r="128" fill="#22C3E6" stroke="#1D2B53" stroke-width="5"/>${[...A].map((c,i)=>{const a=i*360/26;return `<g transform="rotate(${a})"><text y="-${R2-10}" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" stroke="#1D2B53" stroke-width="3" paint-order="stroke" font-family="sans-serif">${c}</text></g>`}).join('')}
  <circle r="70" fill="#fff" stroke="#1D2B53" stroke-width="4"/><text y="-10" text-anchor="middle" font-size="15" font-weight="700" fill="#1D2B53" font-family="sans-serif">Outer = real</text><text y="14" text-anchor="middle" font-size="15" font-weight="700" fill="#1D2B53" font-family="sans-serif">Inner = code</text></g></svg></div>
  <div class="sm-turn"><button class="btn white" id="ccw">⟲</button><span class="es-note" id="lin">A → A</span><button class="btn white" id="cw">⟳</button></div></div>
  <div><div class="sm-msg"><b>🕵️ Coded note</b><div id="words"></div></div>
  <div class="sm-key lock" id="key">🔑 Key: <span id="kv">locked</span> <button class="btn small grape" id="kq">Unlock the key</button></div>
  <div class="sm-key"><div>Type the LAST word of the real message:</div><form class="es-type" id="f" style="margin-top:8px"><input type="text" id="ans" autocomplete="off" aria-label="Last word"><button class="btn green">Escape</button></form></div></div></div>`;
 let rot=0;const drawW=()=>{$('inner').setAttribute('transform',`rotate(${rot*360/26})`);$('lin').textContent=`A → ${A[(26-rot%26)%26]}`};
 // rotating inner by +1 (clockwise) puts inner letter Z under outer A
 $('cw').onclick=()=>{rot=(rot+1)%26;Kit.tick();drawW()};$('ccw').onclick=()=>{rot=(rot+25)%26;Kit.tick();drawW()};drawW();
 const open=new Set();
 const drawWords=()=>$('words').innerHTML=chunks.map((ch,i)=>`<div class="sm-w">${ch.map(w=>`<div class="sm-word ${open.has(i)?'':'lock'}">${[...enc(w)].map(c=>`<span>${c}</span>`).join('')}</div>`).join('')}${open.has(i)?'':`<button class="btn small grape" data-q="${i}">Uncover</button>`}</div>`).join('');drawWords();
 let busy=false,n=0;const total=chunks.length+1;Esc.stat(`🔓 0 of ${total}`);Esc.msg('Uncover the coded words and the key.');
 $('words').onclick=async e=>{const b=e.target.closest('[data-q]');if(!b||busy)return;busy=true;const ok=await Esc.ask({icon:'✉️',title:'Uncover coded words'});busy=false;if(!ok)return;open.add(+b.dataset.q);n++;Esc.stat(`🔓 ${n} of ${total}`);drawWords()};
 $('kq').onclick=async()=>{if(busy)return;busy=true;const ok=await Esc.ask({icon:'🔑',title:'Unlock the key'});busy=false;if(!ok)return;n++;Esc.stat(`🔓 ${n} of ${total}`);
  $('key').classList.remove('lock');$('kv').innerHTML=`<b>A</b> is written as <b>${A[shift]}</b>. Turn the inner wheel until <b>${A[shift]}</b> sits under <b>A</b>, then read real letters on the outside.`;$('kq').remove()};
 $('f').onsubmit=e=>{e.preventDefault();if(Esc.same($('ans').value,last))Esc.win('✉️','Message decoded!',`It said: "${plain}"`);else{Esc.penalize();Kit.tone(150,.4,'sawtooth',.2);$('ans').select();Esc.msg('❌ That\'s not it. Check your wheel.')}};
}});
</script>
</body></html>
