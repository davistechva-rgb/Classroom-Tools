<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Volcano Simulator</title>
<style>
main{max-width:1500px}
.vo-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.vo-wrap{grid-template-columns:1fr}}
.vo-cv{width:100%;aspect-ratio:16/10;border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);background:#BFE6FA;display:block}
.vo-cv.shake{animation:voShake .12s linear 4}
@keyframes voShake{25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.vo-p{background:#fff;border:5px solid var(--ink);border-radius:20px;padding:12px;display:grid;gap:10px}
.vo-p label{font-weight:800}.vo-p input[type=range]{width:100%}
.vo-sc{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:#6B7695}
.vo-g{height:26px;border:4px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;position:relative}
.vo-g b{display:block;height:100%;background:linear-gradient(90deg,#FFC93C,#FF6B1A,#D61F1F);width:0}
.vo-g i{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink)}
.vo-log{display:grid;gap:6px;max-height:180px;overflow:auto}
.vo-log div{border:3px solid var(--ink);border-radius:12px;padding:4px 8px;font-weight:700;background:var(--lc)}
.vo-type{text-align:center;font-weight:800;font-size:1.3rem;color:#fff;text-shadow:2px 2px 0 var(--ink);min-height:1.5em;margin-top:8px}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🌋", "Volcano Simulator");
const $=id=>document.getElementById(id);
document.querySelector('main').innerHTML=`<div class="vo-wrap"><div><canvas class="vo-cv" id="cv" width="1000" height="625"></canvas><div class="vo-type" id="ty">Set up your magma, then pump it up!</div></div>
<div class="vo-p"><label>🍯 Magma thickness</label><input type="range" id="vi" min="0" max="100" value="20"><div class="vo-sc"><span>Runny (like syrup)</span><span>Sticky (like peanut butter)</span></div>
<label>💨 Gas in the magma</label><input type="range" id="ga" min="0" max="100" value="30"><div class="vo-sc"><span>A little</span><span>A lot</span></div>
<label>🌡️ Pressure</label><div class="vo-g"><b id="pg"></b><i id="th"></i></div>
<button class="btn big green" id="pu">🔥 Hold to pump magma</button><button class="btn white small" id="rs">🔄 New volcano</button>
<b>📜 Eruption log</b><div class="vo-log" id="log"><span class="muted">No eruptions yet.</span></div></div></div>`;
const cv=$('cv'),cx=cv.getContext('2d'),W=1000,H=625,G=520;
let vol={h:120,w:260,layers:[]},pr=0,pumping=false,parts=[],erupting=0,log=[],kind=null;
const thr=()=>.55+(+$('vi').value)/250;
function draw(){cx.clearRect(0,0,W,H);const sky=cx.createLinearGradient(0,0,0,G);sky.addColorStop(0,erupting&&kind===2?'#8C8C99':'#8FD3F5');sky.addColorStop(1,'#E3F5FF');cx.fillStyle=sky;cx.fillRect(0,0,W,G);
 // ground and magma chamber
 cx.fillStyle='#8B6B4A';cx.fillRect(0,G,W,H-G);cx.fillStyle='#6E5238';cx.fillRect(0,G+40,W,H-G-40);
 const heat=Math.min(1,pr/thr());cx.fillStyle=`rgb(${200+55*heat},${70+60*heat},20)`;cx.beginPath();cx.ellipse(500,G+70,130,36,0,0,7);cx.fill();
 cx.fillRect(492,G-vol.h+8,16,vol.h+40);
 // cone with layers
 const top=G-vol.h,hw=vol.w;const L=vol.layers.length?vol.layers:[{c:'#7A5C44'}];
 // cross-section: newest layer is the outer skin, oldest is deepest inside
 for(let i=L.length-1;i>=0;i--){const f=.35+.65*(i+1)/L.length;cx.fillStyle=L[i].c;cx.beginPath();cx.moveTo(500-hw*f,G);cx.lineTo(474,G-vol.h*f);cx.lineTo(526,G-vol.h*f);cx.lineTo(500+hw*f,G);cx.closePath();cx.fill()}
 cx.strokeStyle='#1D2B53';cx.lineWidth=5;cx.beginPath();cx.moveTo(500-hw,G);cx.lineTo(474,top);cx.lineTo(526,top);cx.lineTo(500+hw,G);cx.stroke();
 cx.fillStyle=`rgb(${200+55*heat},${70+60*heat},20)`;cx.fillRect(482,top,36,10);cx.fillRect(492,top,16,vol.h);
 parts.forEach(p=>{cx.globalAlpha=Math.max(0,Math.min(1,p.life));cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()});cx.globalAlpha=1;
 cx.fillStyle='#fff';cx.font='800 22px Fredoka,system-ui';cx.fillText('Magma chamber',420,G+125);
 $('pg').style.width=Math.min(100,pr*100)+'%';$('th').style.left=thr()*100+'%'}
function slope(x){const d=Math.abs(x-500);return d<26?G-vol.h:d>vol.w?G:G-vol.h*(1-(d-26)/(vol.w-26))}
function step(){if(pumping&&!erupting){pr=Math.min(1.2,pr+.004+(+$('ga').value)/20000);if(pr>thr()*.75&&Math.random()<.03){cv.classList.remove('shake');void cv.offsetWidth;cv.classList.add('shake');Kit.tone(70,.15,'sawtooth',.1)}if(pr>=thr())erupt()}
 if(!pumping&&!erupting)pr=Math.max(0,pr-.001);
 if(erupting){erupting--;const top=G-vol.h;const n=kind===0?3:kind===1?4:7;for(let k=0;k<n;k++){
  if(kind===0)parts.push({x:500+Kit.rand(-10,10),y:top,vx:(Math.random()-.5)*4,vy:-Math.random()*3,r:7,c:Math.random()<.5?'#FF6B1A':'#FFB020',life:3,lava:1});
  else if(kind===1)parts.push({x:500,y:top,vx:(Math.random()-.5)*7,vy:-6-Math.random()*8,r:Kit.rand(5,10),c:Math.random()<.6?'#FF4E1A':'#3A2A20',life:3,lava:1});
  else{parts.push({x:500+Kit.rand(-14,14),y:top,vx:(Math.random()-.5)*3,vy:-7-Math.random()*6,r:Kit.rand(10,22),c:['#5A5A66','#7A7A88','#44444F'][Kit.rand(0,2)],life:4,ash:1});if(Math.random()<.4)parts.push({x:500,y:top,vx:(Math.random()<.5?-1:1)*(3+Math.random()*4),vy:-2,r:12,c:'#9A8F86',life:2.5,flow:1})}}
  if(!erupting)pr=0}
 parts.forEach(p=>{if(p.ash){p.vy+=.06;if(p.vy>-.6){p.vy=-.6;p.vx+=.05}p.r+=.15;p.life-=.006}else if(p.flow){const s=slope(p.x);p.x+=p.vx;p.y=s-8;p.life-=.012}else{p.vy+=.3;p.x+=p.vx;p.y+=p.vy;const s=slope(p.x);if(p.y>s-p.r){p.y=s-p.r;p.vy=0;p.vx=(p.x<500?-1:1)*Math.max(.6,Math.abs(p.vx)*.9);p.c=p.lava?'#C2410C':p.c}p.life-=.008}if(p.ash){p.x+=p.vx;p.y+=p.vy}});
 parts=parts.filter(p=>p.life>0&&p.x>-40&&p.x<W+40&&p.y>-80);draw();requestAnimationFrame(step)}
function erupt(){const v=+$('vi').value,g=+$('ga').value,e=v*.6+g*.4;kind=e<35?0:e<62?1:2;erupting=kind===2?220:160;
 const K=[['🌊 Gentle lava flows','Runny magma lets gas escape easily, so lava pours out and spreads. This builds a wide, low SHIELD volcano (like Hawaii).','#FFD9B0',[0,70],'#B5472A'],
 ['🎆 Lava fountains','Medium magma traps some gas. Bursts of gas throw lava bombs into the air (like Stromboli).','#FFE9A8',[18,30],'#5E3B2A'],
 ['💥 Explosive eruption!','Sticky magma traps lots of gas until it blasts out. Ash shoots high into the sky and builds a tall, steep volcano (like Mount St. Helens).','#E0E0EA',[40,8],'#55555F']][kind];
 vol.h=Math.min(330,vol.h+K[3][0]);vol.w=Math.min(470,vol.w+K[3][1]);vol.layers.push({c:K[4]});vol.layers.push({c:kind===2?'#9A9AA8':'#7A5C44'});
 $('ty').textContent=K[0];log.unshift({t:K[0],d:K[1],c:K[2]});$('log').innerHTML=log.map(l=>`<div style="--lc:${l.c}">${l.t}<br><span style="font-weight:600;font-size:.9rem">${l.d}</span></div>`).join('');
 Kit.tone(60,1.2,'sawtooth',.3);if(kind===2){Kit.tone(40,1.8,'square',.2,.1)}window.__t={kind,h:vol.h,w:vol.w,n:log.length}}
const start=e=>{e.preventDefault();pumping=true;$('pu').textContent='🔥 Pumping…'},stop=()=>{pumping=false;$('pu').textContent='🔥 Hold to pump magma'};
$('pu').addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>$('pu').addEventListener(ev,stop));
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){pumping=true}});addEventListener('keyup',e=>{if(e.code==='Space')stop()});
$('rs').onclick=()=>{vol={h:120,w:260,layers:[]};parts=[];pr=0;log=[];$('log').innerHTML='<span class="muted">No eruptions yet.</span>';$('ty').textContent='Set up your magma, then pump it up!'};
window.__t={kind:null,n:0};window.__erupt=erupt;
step();
</script>
</body></html>
