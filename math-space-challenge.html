<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Math Space Challenge</title>
<style>
main{max-width:1300px}
.ms-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:10px}
.ms-wrap{position:relative;border:6px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;background:#0B1030}
.ms-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;touch-action:none}
.ms-hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;font-weight:900;font-size:clamp(1rem,2.4vw,1.4rem);text-shadow:2px 2px 0 #000;pointer-events:none}
.ms-over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,30,.7);color:#fff;text-align:center}
.ms-over h2{font-size:clamp(1.8rem,5vw,3rem);margin:0 0 8px;text-shadow:3px 3px 0 #000}
.ms-in{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
.ms-ans{font:900 2rem Fredoka,sans-serif;min-width:140px;height:58px;border:5px solid var(--ink);border-radius:16px;background:#fff;display:grid;place-items:center;color:var(--ink)}
.ms-pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:min(460px,100%)}
.ms-pad button{font:900 1.4rem Fredoka,sans-serif;height:50px;border:4px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink);touch-action:manipulation}
.ms-pad .go{background:#FF6B5B;color:#fff}.ms-pad .del{background:#FFD3CC}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🚀", "Math Space Challenge");
const $=id=>document.getElementById(id);
const OPS={add:'➕ Adding',sub:'➖ Subtracting',mul:'✖️ Times tables',div:'➗ Dividing',mix:'🔀 Mixed'};
let op=Kit.get('ms-op','add'),hi=Kit.get('ms-hi',10),rocks=[],shots=[],booms=[],stars=[],score=0,lives=3,level=1,ans='',run=false,last=0,spawn=0,hits=0,best=Kit.get('ms-best',0),shake=0;
const W=960,H=600;
function prob(){let o=op==='mix'?Kit.pick(['add','sub','mul','div']):op,a,b;
 if(o==='add'){a=Kit.rand(0,hi);b=Kit.rand(0,hi);return [`${a}+${b}`,a+b]}if(o==='sub'){a=Kit.rand(0,hi*2);b=Kit.rand(0,a);return [`${a}−${b}`,a-b]}
 if(o==='mul'){a=Kit.rand(1,Math.min(12,hi));b=Kit.rand(1,12);return [`${a}×${b}`,a*b]}b=Kit.rand(1,Math.min(12,hi));a=b*Kit.rand(1,12);return [`${a}÷${b}`,a/b]}
document.querySelector('main').innerHTML=`<div class="ms-top"><select id="op" style="width:auto">${Object.entries(OPS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="hi" style="width:auto">${[5,10,20].map(n=>`<option value="${n}">Numbers to ${n}</option>`).join('')}</select></div>
<div class="ms-wrap"><canvas id="cv" width="${W}" height="${H}"></canvas><div class="ms-hud"><span id="sc"></span><span id="lv"></span><span id="lf"></span></div><div class="ms-over" id="ov"><div><h2>🚀 Math Space Challenge</h2><p style="font-weight:800;font-size:1.2rem">Asteroids are heading for the planet!<br>Type the answer to blast an asteroid.</p><button class="btn big" style="background:var(--sun)" id="go">🚀 Launch!</button></div></div></div>
<div class="ms-in"><div class="ms-ans" id="an"></div><div class="ms-pad" id="pd">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="del" data-k="del">⌫</button><button class="go" data-k="go">🔥</button></div></div>`;
const cv=$('cv'),x=cv.getContext('2d');for(let i=0;i<90;i++)stars.push([Math.random()*W,Math.random()*H,Math.random()*2+.5]);
function addRock(){const [q,a]=prob();if(rocks.some(r=>r.a===a))return;const w=x.measureText?0:0;rocks.push({q,a,x:80+Math.random()*(W-160),y:-40,v:(18+level*5)*(0.85+Math.random()*.3),r:46+q.length*3,rot:Math.random()*6,spin:(Math.random()-.5)*.8})}
function start(){rocks=[];shots=[];booms=[];score=0;lives=3;level=1;hits=0;ans='';spawn=0;run=true;$('ov').hidden=true;last=performance.now();hud();requestAnimationFrame(loop)}
function hud(){$('sc').textContent=`⭐ ${score}`;$('lv').textContent=`Level ${level}`;$('lf').textContent='🛡️'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives));$('an').textContent=ans||' ';window.__t={run,score,lives,level,rocks:rocks.map(r=>r.a)}}
function fire(){if(!run||ans==='')return;const v=+ans;ans='';const t=rocks.filter(r=>r.a===v).sort((a,b)=>b.y-a.y)[0];
 if(t){shots.push({x:W/2,y:H-60,t,life:1});t.dead=true;score+=10*level;hits++;if(hits%8===0){level++;Kit.tada()}Kit.tone(900,.08,'square',.08)}else{Kit.tone(150,.2,'sawtooth',.08);shake=8}hud()}
function loop(ts){if(!run)return;const dt=Math.min(.05,(ts-last)/1000);last=ts;spawn-=dt;
 if(spawn<=0&&rocks.filter(r=>!r.dead).length<2+Math.min(4,level)){addRock();spawn=Math.max(1.2,3.6-level*.3)}
 rocks.forEach(r=>{if(!r.dead){r.y+=r.v*dt;r.rot+=r.spin*dt}if(!r.dead&&run&&r.y>H-110){r.dead=true;r.hitPlanet=true;lives--;shake=14;booms.push({x:r.x,y:H-110,t:0,big:1});Kit.tone(90,.4,'sawtooth',.12);hud();if(lives<=0)over()}});
 shots.forEach(s=>{s.life-=dt*3;if(s.life<=0&&!s.done){s.done=true;booms.push({x:s.t.x,y:s.t.y,t:0});rocks=rocks.filter(r=>r!==s.t)}});shots=shots.filter(s=>!s.done);rocks=rocks.filter(r=>!(r.hitPlanet));
 booms.forEach(b=>b.t+=dt);booms=booms.filter(b=>b.t<.6);
 paint();requestAnimationFrame(loop)}
function paint(){x.save();if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-.6)}
 x.fillStyle='#0B1030';x.fillRect(-20,-20,W+40,H+40);stars.forEach(s=>{s[1]+=s[2]*.3;if(s[1]>H)s[1]=0;x.fillStyle='#fff';x.globalAlpha=.4+s[2]/4;x.fillRect(s[0],s[1],s[2],s[2])});x.globalAlpha=1;
 // planet
 const g=x.createRadialGradient(W/2,H+260,200,W/2,H+260,420);g.addColorStop(0,'#5DC66E');g.addColorStop(1,'#1E7FD0');x.fillStyle=g;x.beginPath();x.arc(W/2,H+300,400,0,7);x.fill();
 x.font='54px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🚀',W/2,H-60);
 rocks.forEach(r=>{if(r.dead&&!shots.some(s=>s.t===r))return;x.save();x.translate(r.x,r.y);x.rotate(r.rot);x.fillStyle='#8B6B4A';x.strokeStyle='#3B2A1A';x.lineWidth=5;x.beginPath();for(let k=0;k<10;k++){const a=k/10*6.283,rr=r.r*(k%2?.86:1);x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill();x.stroke();x.fillStyle='#6B4F35';x.beginPath();x.arc(-r.r*.35,-r.r*.3,8,0,7);x.arc(r.r*.3,r.r*.35,6,0,7);x.fill();x.restore();
  x.font='900 30px Fredoka,sans-serif';x.lineWidth=6;x.strokeStyle='#1D2B53';x.strokeText(r.q,r.x,r.y);x.fillStyle='#fff';x.fillText(r.q,r.x,r.y)});
 shots.forEach(s=>{const p=1-s.life;x.strokeStyle='#FF6B5B';x.lineWidth=8;x.beginPath();x.moveTo(W/2,H-90);x.lineTo(W/2+(s.t.x-W/2)*Math.min(1,p*1.5),H-90+(s.t.y-H+90)*Math.min(1,p*1.5));x.stroke()});
 booms.forEach(b=>{x.globalAlpha=1-b.t/.6;x.font=`${(b.big?90:60)+b.t*80}px sans-serif`;x.fillText('💥',b.x,b.y);x.globalAlpha=1});
 x.restore()}
function over(){run=false;if(score>best){best=score;Kit.set('ms-best',best)}setTimeout(()=>{$('ov').hidden=false;$('ov').innerHTML=`<div><h2>🌍 Game over!</h2><p style="font-weight:900;font-size:1.4rem">⭐ ${score} points · Level ${level}<br>🏆 Best: ${best}</p><button class="btn big" style="background:var(--sun)" id="go">🔁 Play again</button></div>`;$('go').onclick=start;hud()},window.__fast?1:600)}
function key(k){if(k==='del')ans=ans.slice(0,-1);else if(k==='go')fire();else if(ans.length<4)ans+=k;hud()}
$('pd').onclick=e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Enter'||e.key===' '){e.preventDefault();key('go')}else if(e.key==='Backspace')key('del')});
$('go').onclick=start;$('op').value=op;$('hi').value=hi;
['op','hi'].forEach(id=>$(id).onchange=()=>{op=$('op').value;hi=+$('hi').value;Kit.set('ms-op',op);Kit.set('ms-hi',hi);$(id).blur()});
window.__s={add:()=>{addRock();hud()},key,dropAll:()=>rocks.forEach(r=>r.y=H)};
paint();hud();
</script>
</body></html>
