<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Random Number Generator</title>
<style>#out.multi{font-size:clamp(2.5rem,8vw,5rem);display:flex;flex-wrap:wrap;gap:12px;justify-content:center}#out.multi span{background:#FFF4CC;border:4px solid var(--ink);border-radius:18px;padding:4px 18px}</style></head>
<body>
<main>
<div class="grid2">
 <div class="card stack setup">
  <div class="row"><label>From<br><input type="number" id="min" value="1"></label>
  <label>To<br><input type="number" id="max" value="100"></label>
  <label>How many<br><input type="number" id="count" value="1" min="1" max="30"></label></div>
  <label><input type="checkbox" id="norep"> Don't repeat numbers</label>
  <div><b>Already picked</b> <span class="muted" id="left"></span><div id="hist" style="margin-top:6px"></div></div>
  <button class="btn white small" id="clear">Clear picked numbers</button>
 </div>
 <div class="card center">
  <div id="out" class="big-display">?</div>
  <button class="btn big" id="go">Pick a number</button>
 </div>
</div></main>
<script src="kit.js"></script>
<script>
Kit.mount('🎲', 'Random Number Generator');

const $=id=>document.getElementById(id);
let used=Kit.get('rng-used',[]);
function show(){ $('hist').innerHTML=used.slice(-60).map(n=>`<span class="chip">${n}</span>`).join('');
  const lo=+$('min').value,hi=+$('max').value; $('left').textContent=$('norep').checked?`(${Math.max(0,hi-lo+1-used.filter(n=>n>=lo&&n<=hi).length)} left)`:''; }
$('norep').checked=Kit.get('rng-norep',false);
$('norep').onchange=()=>{Kit.set('rng-norep',$('norep').checked);show()};
['min','max'].forEach(i=>$(i).oninput=show);
$('clear').onclick=()=>{used=[];Kit.set('rng-used',used);show()};
$('go').onclick=async()=>{
  let lo=Math.ceil(+$('min').value),hi=Math.floor(+$('max').value),n=Math.min(30,Math.max(1,+$('count').value||1));
  if(hi<lo)[lo,hi]=[hi,lo];
  let pool=[];for(let i=lo;i<=hi&&pool.length<100001;i++)pool.push(i);
  if($('norep').checked)pool=pool.filter(x=>!used.includes(x));
  if(!pool.length){$('out').className='big-display';$('out').style.fontSize='3rem';$('out').textContent='All numbers picked!';return}
  $('out').style.fontSize='';
  const res=[];const avail=[...pool];
  for(let i=0;i<n&&avail.length;i++){res.push(avail.splice(Math.floor(Math.random()*avail.length),1)[0])}
  $('go').disabled=true;$('out').className='big-display'+(res.length>1?' multi':'');
  for(let f=0;f<14;f++){$('out').innerHTML=res.map(()=>`<span>${Kit.rand(lo,hi)}</span>`).join('');Kit.tick();await Kit.sleep(40+f*6)}
  $('out').innerHTML=res.length>1?res.map(r=>`<span>${r}</span>`).join(''):res[0];
  Kit.ding();$('go').disabled=false;
  used.push(...res);Kit.set('rng-used',used);show();
};
show();

</script>
</body></html>
