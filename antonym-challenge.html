<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Antonym Challenge</title>
<style>
main{max-width:1100px}
.an-top{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.an-word{text-align:center;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:800;color:#fff;text-shadow:2px 2px 0 var(--ink);margin-bottom:8px}
.an-word b{background:#fff;color:var(--ink);text-shadow:none;border:5px solid var(--ink);border-radius:16px;padding:2px 16px;display:inline-block;margin-left:6px}
.an-sky{position:relative;height:min(62vh,560px);border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);background:linear-gradient(#1D2B53,#3B4E8C 60%,#7A8FD0);overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);touch-action:none}
.an-lane{border-right:3px dashed rgba(255,255,255,.2);cursor:pointer}.an-lane:last-child{border:0}
.an-f{position:absolute;transform:translateX(-50%);background:#fff;border:4px solid var(--ink);border-radius:14px;padding:6px 14px;font-weight:800;font-size:clamp(1rem,2.6vw,1.5rem);white-space:nowrap;pointer-events:none}
.an-f.ok{background:#8BE09A}.an-f.bad{background:#FFB3AA}
.an-bk{position:absolute;bottom:10px;transform:translateX(-50%);font-size:clamp(2.6rem,7vw,4rem);transition:left .12s;pointer-events:none}
.an-msg{text-align:center;font-weight:800;font-size:1.2rem;color:#fff;text-shadow:2px 2px 0 var(--ink);min-height:1.5em;margin-top:10px}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("↔️", "Antonym Challenge");
const $=id=>document.getElementById(id);
const A=[['hot','cold'],['up','down'],['big','small'],['happy','sad'],['fast','slow'],['open','closed'],['wet','dry'],['day','night'],['loud','quiet'],['full','empty'],['old','new'],['hard','soft'],['tall','short'],['light','dark'],['push','pull'],['win','lose'],['in','out'],['early','late'],['sweet','sour'],['strong','weak'],['heavy','light'],['clean','dirty'],['first','last'],['friend','enemy'],['give','take'],['above','below'],['laugh','cry'],['awake','asleep'],['brave','scared'],['rich','poor']];
const opp=w=>A.filter(p=>p.includes(w)).map(p=>p[0]===w?p[1]:p[0]);
const X=[16.7,50,83.3];let lane=1,items=[],cur,sc=0,lives=3,speed=.25,run=false,last=0,spawnT=0,caught=0;
document.querySelector('main').innerHTML=`<div class="an-top"><span class="ln-pill">⭐ <b id="sc">0</b></span><span class="ln-pill" id="lv">❤️❤️❤️</span><span class="ln-pill">Best <b id="bs">${Kit.get('an-best',0)}</b></span></div>
<div class="an-word">Catch the OPPOSITE of <b id="wd">…</b></div><div class="an-sky" id="sky"><div class="an-lane" data-l="0"></div><div class="an-lane" data-l="1"></div><div class="an-lane" data-l="2"></div><span class="an-bk" id="bk">🧺</span></div>
<div class="an-msg" id="msg">Use ⬅️ ➡️ arrow keys, or tap a lane to move the basket.</div><div class="row" style="justify-content:center"><button class="btn big green" id="go">▶ Play</button></div>`;
function newWord(){cur=Kit.pick(A)[Kit.rand(0,1)];$('wd').textContent=cur.toUpperCase()}
function moveTo(l){lane=Math.max(0,Math.min(2,l));$('bk').style.left=X[lane]+'%'}
function spawn(){const good=opp(cur),used=items.map(i=>i.lane);const free=[0,1,2].filter(l=>!items.some(i=>i.lane===l&&i.y<30));if(!free.length)return;const l=Kit.pick(free);
 const hasGood=items.some(i=>good.includes(i.w));const w=!hasGood||Math.random()<.35?Kit.pick(good):Kit.pick(A.flat().filter(x=>x!==cur&&!good.includes(x)));
 const el=document.createElement('span');el.className='an-f';el.textContent=w;el.style.left=X[l]+'%';$('sky').appendChild(el);items.push({w,lane:l,y:-8,el})}
function loop(ts){if(!run)return;const dt=Math.min(50,ts-(last||ts));last=ts;spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(700,1500-sc*15)}
 const good=opp(cur);for(const it of [...items]){it.y+=speed*dt/16;it.el.style.top=it.y+'%';
  if(it.y>78&&it.y<92&&it.lane===lane&&!it.done){it.done=1;if(good.includes(it.w)){sc++;caught++;it.el.classList.add('ok');Kit.ding();$('msg').textContent=`✅ ${cur} ↔ ${it.w}`;speed=Math.min(.5,.25+caught*.012);clearOld(it);newWord()}else{hurt(`❌ "${it.w}" isn't the opposite of ${cur}.`);it.el.classList.add('bad')}setTimeout(()=>it.el.remove(),300);items=items.filter(x=>x!==it)}
  else if(it.y>100){it.el.remove();items=items.filter(x=>x!==it);if(good.includes(it.w)&&!it.done)hurt(`😬 Missed it! The opposite of ${cur} is ${it.w}.`)}}
 $('sc').textContent=sc;if(run)requestAnimationFrame(loop)}
function clearOld(keep){items.forEach(i=>{if(i!==keep)i.el.remove()});items=[]}
function hurt(m){lives--;$('lv').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(3-Math.max(0,lives));$('msg').textContent=m;Kit.tone(160,.25,'sawtooth',.2);if(lives<=0)over()}
function over(){run=false;clearOld();const b=Math.max(sc,Kit.get('an-best',0));Kit.set('an-best',b);$('bs').textContent=b;Learn.finish('↔️','Game over!',`You caught ${sc} opposites.`,start)}
function start(){sc=0;lives=3;caught=0;speed=.25;clearOld();$('lv').textContent='❤️❤️❤️';newWord();moveTo(1);run=true;last=0;spawnT=0;$('go').hidden=true;$('msg').textContent='Catch the opposite!';requestAnimationFrame(loop)}
$('go').onclick=start;
addEventListener('keydown',e=>{if(!run)return;if(e.key==='ArrowLeft'){moveTo(lane-1);e.preventDefault()}if(e.key==='ArrowRight'){moveTo(lane+1);e.preventDefault()}});
$('sky').addEventListener('pointerdown',e=>{const l=e.target.closest('.an-lane');if(l&&run)moveTo(+l.dataset.l)});
moveTo(1);window.__t={get cur(){return cur},get opp(){return opp(cur)},get items(){return items.map(i=>[i.w,i.lane,Math.round(i.y)])},moveTo,get sc(){return sc},get lives(){return lives}};
</script>
</body></html>
