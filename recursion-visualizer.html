<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Recursion Visualizer</title>
<style>
main{max-width:1600px}
.rv-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.rv{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.rv{grid-template-columns:1fr}}
.rv-box{background:#fff;border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:12px;display:grid;gap:10px}
.rv-code{background:#1D2B53;border-radius:14px;padding:10px;font-family:ui-monospace,Menlo,monospace;color:#E8F0FF;white-space:pre;font-size:1rem;overflow-x:auto;line-height:1.5}
.rv-code .hl{background:#6B5A1D;display:inline-block;width:100%}
.rv-stack{display:flex;flex-direction:column-reverse;gap:6px;min-height:300px;justify-content:flex-start}
.rv-fr{border:4px solid var(--ink);border-radius:14px;padding:6px 10px;font-family:ui-monospace,Menlo,monospace;font-weight:800;background:var(--fc);display:flex;justify-content:space-between;align-items:center;animation:push .3s;margin-left:calc(var(--d)*14px)}
.rv-fr.top{outline:4px solid #E5533F;outline-offset:2px}
.rv-fr .rt{background:#fff;border:3px solid var(--ink);border-radius:8px;padding:0 8px}
@keyframes push{0%{transform:translateY(-30px);opacity:0}}
.rv-msg{font-weight:800;font-size:1.05rem;min-height:2.6em}
.rv-tree svg{width:100%;display:block}
.rv-tree .nd circle{stroke:#1D2B53;stroke-width:3;fill:#E3E8F2}.rv-tree .nd.act circle{fill:#FFD84D}.rv-tree .nd.dn circle{fill:#8BE09A}.rv-tree .nd.memo circle{fill:#9FD8FF}
.rv-tree .nd text{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:13px;text-anchor:middle;dominant-baseline:central}
.rv-tree line{stroke:#5B6B95;stroke-width:2.5}
.rv-hanoi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:260px;background:linear-gradient(transparent 92%,#C99A63 92%);border-radius:12px}
.rv-peg{position:relative;display:flex;flex-direction:column-reverse;align-items:center;cursor:pointer;padding-bottom:22px;border-radius:12px}
.rv-peg::before{content:"";position:absolute;bottom:20px;top:20px;width:12px;background:#8A6B4A;border-radius:6px;left:50%;transform:translateX(-50%)}
.rv-peg.sel{background:rgba(255,216,77,.35)}
.rv-peg b{position:absolute;bottom:0;font-weight:900}
.rv-disk{height:26px;border:3px solid var(--ink);border-radius:13px;position:relative;z-index:1;margin-top:2px;transition:.2s}
.rv-disk.lift{transform:translateY(-20px)}
.rv-stat{display:flex;gap:8px;flex-wrap:wrap}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script>
<script>
Kit.mount("🧠", "Recursion Visualizer");
const $=id=>document.getElementById(id);
const COL=['#FFB3AA','#FFD27F','#C9E58A','#9FD8FF','#D6C2FF','#FF9FCB','#8BE09A','#FFC98B'];
let mode='fact',steps=[],si=-1,timer=0;
document.querySelector('main').innerHTML=`<div class="rv-tabs"><button class="btn" data-m="fact">🪆 Factorial</button><button class="btn white" data-m="fib">🌳 Fibonacci tree</button><button class="btn white" data-m="hanoi">🗼 Tower of Hanoi</button></div><div id="bd"></div>`;
const sleep=ms=>Kit.sleep(window.__fast?1:ms);
// ---------- factorial: a list of steps, each with the call stack ----------
function factSteps(n){const out=[],st=[];function f(k){st.push({k,r:null});out.push({st:st.map(x=>({...x})),line:0,msg:`Call factorial(${k}). A new box goes on the stack.`});
  if(k<=1){st[st.length-1].r=1;out.push({st:st.map(x=>({...x})),line:2,msg:`factorial(${k}) is the base case: it just returns 1. No more calls!`});st.pop();return 1}
  out.push({st:st.map(x=>({...x})),line:3,msg:`factorial(${k}) needs factorial(${k-1}) first, so it waits…`});const sub=f(k-1);const r=k*sub;st[st.length-1].r=r;
  out.push({st:st.map(x=>({...x})),line:3,msg:`factorial(${k-1}) came back with ${sub}. So factorial(${k}) = ${k} × ${sub} = ${r}.`});st.pop();return r}
 const r=f(n);out.push({st:[],line:-1,msg:`🎉 Done! factorial(${n}) = ${r}. The stack is empty again.`,res:r});return out}
function fact(){$('bd').innerHTML=`<div class="rv"><div class="rv-box"><div class="row" style="gap:6px"><b>n =</b><select id="n" style="width:auto">${[2,3,4,5,6,7].map(v=>`<option ${v===4?'selected':''}>${v}</option>`).join('')}</select><button class="btn white small" id="bk">⬅</button><button class="btn green small" id="st">Step ➜</button><button class="btn white small" id="pl">▶ Play</button></div><div class="rv-code" id="cd"></div><div class="rv-msg" id="msg"></div></div>
<div class="rv-box"><b>📚 The call stack (newest on top)</b><div class="rv-stack" id="sk"></div></div></div>`;
 const code=['def factorial(n):','    if n <= 1:','        return 1','    return n * factorial(n - 1)'];const go=()=>{steps=factSteps(+$('n').value);si=0;show()};
 const show=()=>{const s=steps[si];$('cd').innerHTML=code.map((l,i)=>`<span class="${s.line===i?'hl':''}">${l}</span>`).join('\n');$('msg').textContent=s.msg;
  $('sk').innerHTML=s.st.map((f,i)=>`<div class="rv-fr ${i===s.st.length-1?'top':''}" style="--fc:${COL[i%COL.length]};--d:${i}">factorial(${f.k})<span class="rt">${f.r===null?'waiting…':'= '+f.r}</span></div>`).join('')||'<div class="muted" style="font-weight:700;margin:auto">Empty</div>';window.__t={si,len:steps.length,depth:s.st.length,res:s.res}};
 $('n').onchange=go;$('st').onclick=()=>{if(si<steps.length-1){si++;show();Kit.tick()}};$('bk').onclick=()=>{if(si>0){si--;show()}};
 $('pl').onclick=()=>{clearInterval(timer);timer=setInterval(()=>{if(si>=steps.length-1){clearInterval(timer);Kit.ding();return}si++;show();Kit.tick()},window.__fast?5:900)};go()}
// ---------- fibonacci: draw the whole call tree, light it up in order ----------
function fib(){$('bd').innerHTML=`<div class="rv-box"><div class="row" style="gap:6px"><b>fib(</b><select id="n" style="width:auto">${[3,4,5,6].map(v=>`<option ${v===5?'selected':''}>${v}</option>`).join('')}</select><b>)</b><label style="font-weight:800"><input type="checkbox" id="mm"> 🧠 Remember answers (memoization)</label><button class="btn green small" id="pl">▶ Play</button></div>
<div class="rv-code">def fib(n):\n    if n &lt;= 1: return n\n    return fib(n - 1) + fib(n - 2)</div><div class="rv-stat"><span class="ln-pill">📞 Calls: <b id="cc">0</b></span><span class="ln-pill">🧠 Remembered: <b id="mc">0</b></span><span class="ln-pill">✅ Answer: <b id="an">?</b></span></div><div class="rv-tree"><svg id="sv"></svg></div><div class="rv-msg" id="msg">Every fib call makes two more calls. Watch how many times the same question gets asked!</div></div>`;
 let nodes=[],order=[];const build=()=>{nodes=[];order=[];const memo=$('mm').checked,seen=new Map();
  (function f(n,depth,parent){const id=nodes.length,node={n,depth,parent,kids:[],memo:false};nodes.push(node);if(parent!=null)nodes[parent].kids.push(id);order.push(['call',id]);
   if(memo&&seen.has(n)){node.memo=true;node.v=seen.get(n);order.push(['done',id]);return node.v}
   if(n<=1){node.v=n}else{node.v=f(n-1,depth+1,id)+f(n-2,depth+1,id)}if(memo)seen.set(n,node.v);order.push(['done',id]);return node.v})(+$('n').value,0,null);
  // lay out leaves left to right
  let x=0;const place=i=>{const nd=nodes[i];if(!nd.kids.length){nd.x=x++;return}nd.kids.forEach(place);nd.x=(nodes[nd.kids[0]].x+nodes[nd.kids[nd.kids.length-1]].x)/2};place(0);
  const W=Math.max(x,1),D=Math.max(...nodes.map(n=>n.depth))+1;nodes.forEach(n=>{n.px=30+n.x/(W-1||1)*(Math.max(600,W*46)-60);n.py=26+n.depth*58});$('sv').setAttribute('viewBox',`0 0 ${Math.max(600,W*46)} ${D*58+10}`);draw(new Set(),new Set(),null)};
 const draw=(on,dn,act)=>{let h='';nodes.forEach(n=>{if(n.parent!=null&&on.has(nodes.indexOf(n))){const p=nodes[n.parent];h+=`<line x1="${p.px}" y1="${p.py}" x2="${n.px}" y2="${n.py}"/>`}});
  nodes.forEach((n,i)=>{if(!on.has(i))return;h+=`<g class="nd ${i===act?'act':dn.has(i)?(n.memo?'memo':'dn'):''}"><circle cx="${n.px}" cy="${n.py}" r="19"/><text x="${n.px}" y="${n.py}">${dn.has(i)?n.v:'f'+n.n}</text></g>`});$('sv').innerHTML=h};
 $('pl').onclick=async()=>{if(window.__fb)return;window.__fb=1;build();const on=new Set(),dn=new Set();let calls=0,mem=0;for(const [k,id] of order){if(!$('sv')){window.__fb=0;return}if(k==='call'){on.add(id);calls++;if(nodes[id].memo)mem++}else dn.add(id);$('cc').textContent=calls;$('mc').textContent=mem;draw(on,dn,k==='call'?id:null);Kit.tone(300+nodes[id].n*60,.05,'triangle',.1);await sleep(260)}
  window.__fb=0;if(!$('an'))return;$('an').textContent=nodes[0].v;$('msg').textContent=$('mm').checked?`With memoization: only ${calls} calls! Blue circles were remembered instead of worked out again.`:`fib(${nodes[0].n}) took ${calls} calls! Notice how often the same fib numbers appear. Try turning on "Remember answers".`;Kit.ding();window.__t={calls,ans:nodes[0].v,mem}};
 $('n').onchange=build;$('mm').onchange=build;build()}
// ---------- tower of hanoi: play it yourself, or watch the recursive solution ----------
function hanoi(){$('bd').innerHTML=`<div class="rv"><div class="rv-box"><div class="row" style="gap:6px"><select id="n" style="width:auto">${[3,4,5,6].map(v=>`<option ${v===3?'selected':''} value="${v}">${v} disks</option>`).join('')}</select><button class="btn white small" id="rs">↺ Reset</button><button class="btn green small" id="sv2">🤖 Watch recursion solve it</button></div>
<div class="rv-hanoi" id="hn"></div><div class="rv-stat"><span class="ln-pill">👣 Moves: <b id="mv">0</b></span><span class="ln-pill">🏆 Best possible: <b id="bp">7</b></span></div><div class="rv-msg" id="msg">Move the whole tower to the right peg. Only move one disk at a time, and never put a big disk on a smaller one. Tap a peg to pick up its top disk, then tap where it goes.</div></div>
<div class="rv-box"><b>🧠 How recursion solves it</b><div class="rv-code">def move(n, from, to, spare):\n    if n == 0: return\n    move(n-1, from, spare, to)\n    move disk n: from ➜ to\n    move(n-1, spare, to, from)</div><b>📚 Call stack</b><div class="rv-stack" id="sk" style="min-height:160px"></div></div></div>`;
 let P,sel=null,moves=0,busy=false;const N=()=>+$('n').value;
 const reset=()=>{if(busy)return;P=[Array.from({length:N()},(_,i)=>N()-i),[],[]];sel=null;moves=0;$('bp').textContent=2**N()-1;$('sk').innerHTML='';draw()};
 const draw=()=>{if(!$('hn'))throw 'gone';$('hn').innerHTML=P.map((p,i)=>`<div class="rv-peg ${sel===i?'sel':''}" data-p="${i}"><b>${'ABC'[i]}</b>${p.map((d,k)=>`<div class="rv-disk ${sel===i&&k===p.length-1?'lift':''}" style="width:${20+d/N()*75}%;background:${COL[d-1]}"></div>`).join('')}</div>`).join('');$('mv').textContent=moves;
  window.__t={pegs:P.map(p=>p.length),moves,won:P[2].length===N()}};
 const move=(a,b)=>{const d=P[a][P[a].length-1];if(d===undefined)return false;const t=P[b][P[b].length-1];if(t!==undefined&&t<d)return false;P[b].push(P[a].pop());moves++;Kit.tick();return true};
 const won=()=>{if(P[2].length===N()){Kit.tada();Kit.confetti(60);$('msg').textContent=moves===2**N()-1?`🎉 Solved in ${moves} moves, the best possible!`:`🎉 Solved in ${moves} moves! The best possible is ${2**N()-1}.`}};
 $('hn').onclick=e=>{const p=e.target.closest('[data-p]');if(!p||busy)return;const i=+p.dataset.p;if(sel===null){if(P[i].length)sel=i}else{if(i!==sel&&!move(sel,i)){Kit.tone(200,.2,'triangle',.15);$('msg').textContent='A bigger disk can\'t go on a smaller one!'}sel=null}draw();won()};
 $('sv2').onclick=async()=>{if(busy)return;reset();busy=true;const st=[];const show=()=>$('sk').innerHTML=st.map((f,i)=>`<div class="rv-fr ${i===st.length-1?'top':''}" style="--fc:${COL[(f[0]-1)%COL.length]};--d:${i}">move(${f[0]}, ${'ABC'[f[1]]} ➜ ${'ABC'[f[2]]})</div>`).join('');
  async function mv(n,a,b,c){if(!n)return;st.push([n,a,b]);show();await sleep(200);await mv(n-1,a,c,b);move(a,b);draw();$('msg').textContent=`Move disk ${n} from ${'ABC'[a]} to ${'ABC'[b]}`;await sleep(450);await mv(n-1,c,b,a);st.pop();show()}
  try{await mv(N(),0,2,1)}catch(e){return}busy=false;won()};
 $('rs').onclick=reset;$('n').onchange=reset;reset()}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{clearInterval(timer);mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.className='btn '+(x.dataset.m===mode?'':'white'));({fact,fib,hanoi})[mode]()});
fact();
</script>
</body></html>
