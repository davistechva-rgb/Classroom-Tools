<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Space Station Escape</title>
<style>
.ss{background:#0B1026;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff .7px,transparent 1px);background-size:90px 90px,37px 37px;background-position:0 0,15px 22px;border:6px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:16px;color:#fff}
.ss-o2{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:14px}
.ss-o2 .bar{flex:1;height:26px;border:4px solid #fff;border-radius:99px;overflow:hidden;background:#1A2244}.ss-o2 .bar i{display:block;height:100%;background:linear-gradient(90deg,#3FD3FF,#7CFFB2);transition:width .5s}
.ss-o2.low .bar i{background:linear-gradient(90deg,#FF5148,#FF9F1C)}.ss-o2.low{animation:esbeat 1s infinite}
.ss-mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ss-mod{background:#1B2450;border:4px solid #7F8CC8;border-radius:20px;padding:14px;text-align:center;position:relative}
.ss-mod .ic{font-size:2.8rem}
.ss-mod h3{margin:4px 0}
.ss-mod .st{font-weight:800;border-radius:99px;display:inline-block;padding:0 10px;background:#FF5148;margin-bottom:8px}
.ss-mod.ok{border-color:#7CFFB2}.ss-mod.ok .st{background:#2FB86A}
.ss-mod .btn{color:var(--ink)}
.ss-pod{text-align:center;margin-top:16px}
.ss-pod .ship{font-size:4rem;display:inline-block;transition:transform 2.2s cubic-bezier(.6,0,.9,.5)}
.ss-pod .ship.go{transform:translate(0,-140vh) rotate(-45deg)}
.wire-box{display:flex;justify-content:space-between;gap:20px;position:relative;margin:10px auto;max-width:360px}
.wire-col{display:flex;flex-direction:column;gap:12px;z-index:2}
.wire-col button{width:64px;height:40px;border:4px solid var(--ink);border-radius:10px;cursor:pointer}
.wire-col button.sel{outline:4px solid #fff;outline-offset:2px}
.wire-col button.done{opacity:.5}
.wire-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.freq{font:800 2rem ui-monospace,Consolas,monospace;color:#7CFF9B;background:#0E1A12;border:4px solid var(--ink);border-radius:12px;padding:6px 14px;display:inline-block}
.wave{width:100%;max-width:360px;height:90px;display:block;margin:8px auto;background:#0E1A12;border:4px solid var(--ink);border-radius:12px}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="escape.js"></script>
<script>
Kit.mount("🚀", "Space Station Escape");

Esc.setup({intro:'🚀🛰️', minutes:20,
how:'Alarms are ringing on the space station and the oxygen is leaking! Fix all four systems to launch the escape pod: ⚡ Power (connect the wires), 📡 Radio (tune to the right frequency), 🧭 Navigation (enter the coordinates), and 🛡️ Shields (solve the code). Each system needs a question answered first. Wrong answers make the oxygen leak faster!',
start({room}){
 const $=id=>document.getElementById(id);
 let o2=100;const drain=()=>{if(Esc.over||document.querySelector('.es-pause'))return;o2=Math.max(0,o2-(Esc.total?100/(Esc.total*1.15):0.12));drawO2();if(o2<=0){Esc.lose('The oxygen ran out!')}};
 const drawO2=()=>{$('o2b').style.width=o2+'%';$('o2n').textContent=Math.ceil(o2)+'%';$('o2').classList.toggle('low',o2<25)};
 const W=[['#FF5148','red'],['#3B8CFF','blue'],['#FFD43B','yellow'],['#40C057','green']];const rightOrder=Kit.shuffle([0,1,2,3]);
 const freq=(Kit.rand(880,1080)/10).toFixed(1);const coords=[Kit.rand(10,89),Kit.rand(10,89)];const sh=[Kit.rand(2,9),Kit.rand(2,9)];const shAns=sh[0]*sh[1];
 window.__sol={freq,coords,shield:shAns};
 const M=[{id:'pow',ic:'⚡',nm:'Power'},{id:'rad',ic:'📡',nm:'Radio'},{id:'nav',ic:'🧭',nm:'Navigation'},{id:'shd',ic:'🛡️',nm:'Shields'}];
 room.innerHTML=`<div class="ss"><div class="ss-o2" id="o2">🫁 Oxygen <div class="bar"><i id="o2b"></i></div><span id="o2n"></span></div>
  <div class="ss-mods">${M.map(m=>`<div class="ss-mod" id="m${m.id}"><div class="ic">${m.ic}</div><h3>${m.nm}</h3><span class="st">BROKEN</span><div><button class="btn small" data-fix="${m.id}">Repair</button></div></div>`).join('')}</div>
  <div class="ss-pod"><div class="ship" id="ship">🚀</div><div><button class="btn big red" id="launch" disabled>Launch the escape pod</button></div></div></div>`;
 drawO2();const iv=setInterval(()=>{if(Esc.over){clearInterval(iv);return}drain()},1000);
 const fixed=new Set();let busy=false;
 const done=id=>{fixed.add(id);const el=$('m'+id);el.classList.add('ok');el.querySelector('.st').textContent='ONLINE';el.querySelector('button')?.remove();Kit.ding();Esc.stat(`🔧 ${fixed.size} of 4 systems`);if(fixed.size===4){$('launch').disabled=false;Esc.msg('All systems online! LAUNCH! 🚀')}};
 const panel=(html)=>{const ov=document.createElement('div');ov.className='es-ov';ov.innerHTML=`<div class="es-q" style="background:#1B2450;color:#fff">${html}<div class="fb" id="pfb"></div><button class="btn white small" data-x style="margin-top:10px">Close</button></div>`;document.body.appendChild(ov);ov.querySelector('[data-x]').onclick=()=>ov.remove();return ov};
 const bad=(ov,t)=>{ov.querySelector('#pfb').textContent='❌ '+t;o2=Math.max(0,o2-4);drawO2();Esc.penalize();Kit.tone(150,.4,'sawtooth',.2)};
 const games={
  pow(){const ov=panel(`<div class="ic">⚡</div><h2 style="color:#FFC93C">Reconnect the power</h2><p>Connect each wire on the left to the plug that matches its color.</p>
    <div class="wire-box" id="wb"><svg class="wire-svg" id="ws"></svg><div class="wire-col">${W.map((w,i)=>`<button data-l="${i}" style="background:${w[0]}" aria-label="${w[1]} wire"></button>`).join('')}</div><div class="wire-col">${rightOrder.map(i=>`<button data-r="${i}" style="background:${W[i][0]}" aria-label="${W[i][1]} plug"></button>`).join('')}</div></div>`);
   let sel=null;const links=[];
   const draw=()=>{const box=ov.querySelector('#wb').getBoundingClientRect();ov.querySelector('#ws').innerHTML=links.map(([l,r])=>{const a=ov.querySelector(`[data-l="${l}"]`).getBoundingClientRect(),b=ov.querySelector(`[data-r="${r}"]`).getBoundingClientRect();
    const x1=a.right-box.left,y1=a.top+a.height/2-box.top,x2=b.left-box.left,y2=b.top+b.height/2-box.top;return `<path d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}" stroke="${W[l][0]}" stroke-width="8" fill="none" stroke-linecap="round"/>`}).join('')};
   ov.querySelector('#wb').onclick=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('done'))return;
    if(b.dataset.l!=null){ov.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.l;Kit.tick();return}
    if(b.dataset.r!=null&&sel!=null){if(+b.dataset.r===sel){links.push([sel,sel]);ov.querySelector(`[data-l="${sel}"]`).classList.add('done');b.classList.add('done');sel=null;draw();Kit.tone(700,.1,'square',.1);
      if(links.length===4){setTimeout(()=>{ov.remove();done('pow')},500)}}else{bad(ov,'Sparks! Wrong plug.')}}}},
  rad(){const ov=panel(`<div class="ic">📡</div><h2 style="color:#FFC93C">Tune the radio</h2><p>Mission Control is on <b>${freq} MHz</b>. Tune until the wave is smooth, then lock it in.</p>
    <div class="freq" id="fv">88.0</div><canvas class="wave" id="wv" width="360" height="90"></canvas><input type="range" id="fr" min="880" max="1080" value="880" style="width:100%;max-width:360px" aria-label="Frequency">
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn small white" id="fm">−0.1</button><button class="btn small white" id="fp">+0.1</button><button class="btn green" id="lock">Lock in</button></div>`);
   const fr=ov.querySelector('#fr'),cv=ov.querySelector('#wv').getContext('2d');let t=0,raf;
   const wave=()=>{if(!ov.isConnected)return cancelAnimationFrame(raf);const off=Math.abs(+fr.value-freq*10);cv.clearRect(0,0,360,90);cv.strokeStyle='#7CFF9B';cv.lineWidth=3;cv.beginPath();
    for(let x=0;x<360;x++){const y=45+Math.sin(x/14+t)*22+(off?Math.sin(x*1.7+t*9)*Math.min(30,off/2)*(Math.random()*.6+.4):0);x?cv.lineTo(x,y):cv.moveTo(x,y)}cv.stroke();t+=.15;raf=requestAnimationFrame(wave)};wave();
   const show=()=>ov.querySelector('#fv').textContent=(fr.value/10).toFixed(1);fr.oninput=show;ov.querySelector('#fm').onclick=()=>{fr.value=+fr.value-1;show()};ov.querySelector('#fp').onclick=()=>{fr.value=+fr.value+1;show()};
   ov.querySelector('#lock').onclick=()=>{if((fr.value/10).toFixed(1)===freq){ov.remove();done('rad')}else bad(ov,'Just static. Keep tuning.')}},
  nav(){const ov=panel(`<div class="ic">🧭</div><h2 style="color:#FFC93C">Set the course</h2><p>The safe landing spot is where the star is. Read its coordinates and enter them.</p>
    <svg viewBox="0 0 110 110" style="width:260px;background:#0E1A3A;border:4px solid #fff;border-radius:10px">${Array.from({length:11},(_,i)=>`<line x1="${5+i*10}" y1="5" x2="${5+i*10}" y2="105" stroke="#334" stroke-width=".6"/><line x1="5" y1="${5+i*10}" x2="105" y2="${5+i*10}" stroke="#334" stroke-width=".6"/>${i%2===0?`<text x="${5+i*10}" y="109.5" font-size="3.6" fill="#9ab" text-anchor="middle">${i*10}</text><text x="2.6" y="${106-i*10}" font-size="3.6" fill="#9ab" text-anchor="middle">${i*10}</text>`:''}`).join('')}
    <text x="${5+coords[0]}" y="${105-coords[1]+2.5}" font-size="8" text-anchor="middle">⭐</text></svg>
    <form class="es-type" id="nf" style="margin-top:8px"><input type="number" id="nx" placeholder="Across (x)" style="max-width:150px"><input type="number" id="ny" placeholder="Up (y)" style="max-width:150px"><button class="btn green">Set course</button></form>`);
   ov.querySelector('#nf').onsubmit=e=>{e.preventDefault();const x=+ov.querySelector('#nx').value,y=+ov.querySelector('#ny').value;if(Math.abs(x-coords[0])<=2&&Math.abs(y-coords[1])<=2){ov.remove();done('nav')}else bad(ov,'That course flies into an asteroid field!')}},
  shd(){const ov=panel(`<div class="ic">🛡️</div><h2 style="color:#FFC93C">Restart the shields</h2><p>The shield code is <b>${sh[0]} rows</b> of <b>${sh[1]}</b> power cells. How many cells is that?</p>
    <div style="display:grid;grid-template-columns:repeat(${sh[1]},22px);gap:4px;justify-content:center;margin:8px 0">${Array.from({length:shAns},()=>'<span style="width:22px;height:22px;border-radius:5px;background:#3FD3FF;border:2px solid #fff"></span>').join('')}</div><div id="kp"></div>`);
   (async()=>{for(;;){const r=await Esc.keypad(ov.querySelector('#kp'),String(shAns).length);if(!ov.isConnected)return;if(+r.value===shAns){r.screen.classList.add('good');await Kit.sleep(500);ov.remove();done('shd');return}r.screen.classList.add('bad');bad(ov,'Shields failed to start.');await Kit.sleep(800)}})()}};
 room.onclick=async e=>{const b=e.target.closest('[data-fix]');if(!b||busy)return;busy=true;const id=b.dataset.fix;const m=M.find(x=>x.id===id);
  const ok=await Esc.ask({icon:m.ic,title:`Unlock the ${m.nm} panel`});busy=false;if(ok)games[id]()};
 $('launch').onclick=async()=>{$('launch').disabled=true;for(let i=3;i>0;i--){Esc.msg(`T-minus ${i}…`);Kit.tone(440,.15,'square',.2);await Kit.sleep(800)}Kit.tone(880,.5,'square',.2);$('ship').classList.add('go');await Kit.sleep(2000);
  Esc.win('🚀','Escape pod launched!',`You fixed every system with ${Math.ceil(o2)}% oxygen left.`)};
 Esc.stat('🔧 0 of 4 systems');Esc.msg('Pick a system to repair.');
}});
</script>
</body></html>
