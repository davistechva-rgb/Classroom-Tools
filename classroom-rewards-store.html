<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Classroom Rewards Store</title>
<style>
main{max-width:1700px}
.st{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.st{grid-template-columns:minmax(0,1fr)}}
.st-awn{background:repeating-linear-gradient(90deg,#E5533F 0 50px,#fff 50px 100px);height:34px;border:5px solid var(--ink);border-radius:18px 18px 0 0;border-bottom:0}
.st-shelf{background:#FFF6E5;border:5px solid var(--ink);border-radius:0 0 22px 22px;box-shadow:7px 7px 0 var(--ink);padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.st-item{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px;text-align:center;cursor:pointer;position:relative;box-shadow:0 5px 0 #C99A63;transition:transform .1s}
.st-item:hover{transform:translateY(-3px)}
.st-item .e{font-size:3rem}.st-item b{display:block;font-size:1.05rem}
.st-item .tag{display:inline-block;margin-top:6px;background:#FFD84D;border:3px solid var(--ink);border-radius:99px;padding:0 10px;font-weight:900}
.st-item .tag s{color:#9FA9C4;margin-right:4px}
.st-item small{display:block;font-weight:700;color:#55607E;margin-top:3px}
.st-item.out{opacity:.55;cursor:not-allowed}.st-item.out::after{content:"SOLD OUT";position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);border:4px solid #E5533F;color:#E5533F;font-weight:900;padding:2px 8px;border-radius:8px;background:#fff;font-size:1.1rem}
.st-item.poor .tag{background:#E3E8F2}
.st-p{background:#fff;border:5px solid var(--ink);border-radius:20px;padding:12px;display:grid;gap:10px;position:sticky;top:10px}
.st-p select{font:inherit;font-weight:800;padding:6px;border:3px solid var(--ink);border-radius:10px;width:100%}
.st-wal{font-size:1.5rem;font-weight:900;text-align:center}
.st-cart{display:grid;gap:4px;min-height:40px}
.st-cart div{display:flex;justify-content:space-between;gap:6px;font-weight:800;background:#F4FAFF;border-radius:10px;padding:3px 8px;align-items:center}
.st-cart button{border:0;background:none;cursor:pointer;font-size:1rem}
.st-tot{display:flex;justify-content:space-between;font-weight:900;font-size:1.2rem;border-top:3px dashed #C3CBDB;padding-top:6px}
.st-orders{max-height:220px;overflow:auto;display:grid;gap:3px;font-size:.9rem;font-weight:700}
.st-orders label{display:flex;gap:6px;align-items:center;background:#F4FAFF;border-radius:8px;padding:3px 8px}
.st-orders label.done{opacity:.5;text-decoration:line-through}
.st-rc{position:fixed;inset:0;background:rgba(15,22,45,.6);display:grid;place-items:center;z-index:50;padding:14px}
.st-rc div.pap{background:#FFFDF6;border:4px dashed var(--ink);border-radius:8px;padding:18px;font-family:ui-monospace,Menlo,monospace;font-weight:700;max-width:360px;width:100%;display:grid;gap:4px;animation:print .6s}@keyframes print{from{transform:translateY(-40px);opacity:0}}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="learn.js"></script><script src="rewards.js"></script>
<script>
Kit.mount("🛍️", "Classroom Rewards Store");
const $=id=>document.getElementById(id);
const I0=`🎧 | Listen to music while working | 15 |
🪑 | Sit at the teacher's desk | 25 | 1
👟 | Shoes off for the day | 10 |
🎨 | Extra art time | 20 |
🍿 | Popcorn party ticket | 30 | 3
✏️ | Fancy pencil | 8 | 10
🎲 | Pick the class game | 20 | 1
🐾 | Bring a stuffed animal | 12 |
📚 | First pick at the library | 15 | 2
⏰ | 5 extra minutes of recess | 40 | 1`;
Kit.editable({key:'store-items',title:'Store items',help:'(one per line: emoji | item | price | how many in stock. Leave stock empty for unlimited.)',def:I0,onSave:()=>{stock=null;draw()}});
const items=()=>Kit.lines(Kit.get('ed:store-items',I0)).map(l=>{const p=l.split('|').map(s=>s.trim());return {e:p[0],n:p[1]||'Item',p:Math.max(0,parseInt(p[2])||0),s:p[3]===''||p[3]==null?null:parseInt(p[3])}}).filter(i=>i.n);
let sold=Kit.get('st-sold',{}),orders=Kit.get('st-orders',[]),shopper=null,cart=[],sale=Kit.get('st-sale',0),stock=null;
const ce=()=>RW.coinName().split(' ')[0];
const price=it=>Math.max(0,Math.round(it.p*(100-sale)/100));
const left=it=>it.s==null?Infinity:it.s-(sold[it.n]||0);
function save(){Kit.set('st-sold',sold);Kit.set('st-orders',orders);Kit.set('st-sale',sale)}
document.querySelector('main').innerHTML=`<div class="st"><div><div class="st-awn"></div><div class="st-shelf" id="sh"></div></div><div class="st-p"><b>🧒 Who is shopping?</b><select id="who"></select><div class="st-wal" id="wl"></div><b>🛒 Cart</b><div class="st-cart" id="ct"></div><div class="st-tot"><span>Total</span><span id="tt"></span></div><button class="btn green big" id="buy">💳 Buy it!</button>
<div class="row" style="gap:6px"><select id="sl" style="width:auto">${[0,10,25,50].map(s=>`<option value="${s}">${s?`🏷️ ${s}% off sale`:'No sale'}</option>`).join('')}</select><button class="btn white small" id="rs">📦 Restock all</button></div><b>📋 Orders to hand out</b><div class="st-orders" id="od"></div><div class="muted" style="font-weight:700;font-size:.85rem">Coins come from the 🪙 Classroom Currency System.</div></div></div>
<div id="ro" style="margin-top:12px;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px"></div>`;
Learn.rosterEditor($('ro'));$('ro').addEventListener('roster',()=>draw());
function draw(){const K=RW.kids(),c=ce();shopper=shopper&&K.includes(shopper)?shopper:K[0];const tot=cart.reduce((s,it)=>s+price(it),0),money=RW.coins(shopper);
 $('who').innerHTML=K.map(k=>`<option ${k===shopper?'selected':''}>${Kit.esc(k)}</option>`).join('');$('wl').textContent=`👛 ${c} ${money}`;$('sl').value=sale;
 $('sh').innerHTML=items().map((it,i)=>{const l=left(it)-cart.filter(x=>x.n===it.n).length;return `<div class="st-item ${l<=0?'out':''} ${price(it)>money-tot?'poor':''}" data-i="${i}"><div class="e">${it.e}</div><b>${Kit.esc(it.n)}</b><span class="tag">${sale?`<s>${it.p}</s>`:''}${c} ${price(it)}</span>${it.s!=null?`<small>${Math.max(0,l)} left</small>`:''}</div>`}).join('');
 $('ct').innerHTML=cart.map((it,i)=>`<div><span>${it.e} ${Kit.esc(it.n)}</span><span>${c} ${price(it)} <button data-x="${i}">✖</button></span></div>`).join('')||'<span class="muted" style="font-weight:700">Tap items to add them.</span>';
 $('tt').textContent=`${c} ${tot}`;$('buy').disabled=!cart.length;
 $('od').innerHTML=orders.slice(0,60).map((o,i)=>`<label class="${o.d?'done':''}"><input type="checkbox" data-o="${i}" ${o.d?'checked':''}> ${Kit.esc(o.k)}: ${o.e} ${Kit.esc(o.n)}</label>`).join('')||'<span class="muted">No orders yet.</span>';
 window.__t={shopper,money,cart:cart.length,tot,orders:orders.length}}
$('sh').onclick=e=>{const t=e.target.closest('[data-i]');if(!t)return;const it=items()[+t.dataset.i],tot=cart.reduce((s,x)=>s+price(x),0);if(left(it)-cart.filter(x=>x.n===it.n).length<=0)return;
 if(price(it)>RW.coins(shopper)-tot){Kit.tone(200,.2,'triangle',.15);$('wl').textContent=`😬 Not enough ${RW.coinName().split(' ').slice(1).join(' ')} for that!`;setTimeout(draw,1200);return}cart.push(it);Kit.tick();draw()};
$('ct').onclick=e=>{const b=e.target.closest('[data-x]');if(b){cart.splice(+b.dataset.x,1);draw()}};
$('who').onchange=()=>{shopper=$('who').value;cart=[];draw()};$('sl').onchange=()=>{sale=+$('sl').value;save();draw()};
$('rs').onclick=()=>{if(confirm('Put every item back in stock?')){sold={};save();draw()}};
$('od').onchange=e=>{const i=e.target.dataset.o;if(i!=null){orders[+i].d=e.target.checked;save();draw()}};
$('buy').onclick=()=>{const tot=cart.reduce((s,it)=>s+price(it),0);if(!cart.length||!RW.addCoins(shopper,-tot,`Store: ${cart.map(i=>i.n).join(', ')}`))return;
 cart.forEach(it=>{sold[it.n]=(sold[it.n]||0)+1;orders.unshift({k:shopper,e:it.e,n:it.n,d:false,t:Date.now()})});orders=orders.slice(0,200);save();Kit.tada();Kit.confetti(50);
 const c=ce(),rc=document.createElement('div');rc.className='st-rc';rc.innerHTML=`<div class="pap"><div style="text-align:center;font-size:1.2rem">🛍️ CLASS STORE</div><div style="text-align:center">${new Date().toLocaleString()}</div><div>Shopper: ${Kit.esc(shopper)}</div><hr>${cart.map(it=>`<div style="display:flex;justify-content:space-between"><span>${it.e} ${Kit.esc(it.n)}</span><span>${price(it)}</span></div>`).join('')}<hr><div style="display:flex;justify-content:space-between"><b>TOTAL</b><b>${c} ${tot}</b></div><div style="display:flex;justify-content:space-between"><span>Left in wallet</span><span>${c} ${RW.coins(shopper)}</span></div><div style="text-align:center;margin-top:6px">Thank you! 😊</div><button class="btn green" style="margin-top:8px">OK</button></div>`;document.body.appendChild(rc);rc.onclick=()=>rc.remove();cart=[];draw()};
window.__s={who:k=>{shopper=k;cart=[];draw()},add:i=>$('sh').querySelector(`[data-i="${i}"]`).click()};
draw();
</script>
</body></html>
