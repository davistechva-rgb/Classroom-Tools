<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Digital Escape Room</title>
<style>
.dr-scene{position:relative;border:5px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);overflow:hidden;aspect-ratio:16/9;max-height:62vh;margin:0 auto;
 background:linear-gradient(#FCE9C8 0 70%,#B9875A 70% 100%)}
.dr-scene::before{content:"";position:absolute;left:0;right:0;top:70%;height:8px;background:#7A5230}
.dr-scene::after{content:"";position:absolute;inset:0 0 30% 0;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(0,0,0,.03) 60px 62px);pointer-events:none}
.dr-scene{container-type:inline-size;isolation:isolate}
.dr-spot{position:absolute;background:none;border:0;cursor:pointer;padding:0;transform:translate(-50%,-100%);transition:transform .15s;z-index:2}
.dr-spot img{display:block;width:100%;filter:drop-shadow(0 .4cqw .3cqw rgba(0,0,0,.2))}
.dr-spot.fl::after{content:"";position:absolute;left:12%;right:12%;bottom:-5%;height:12%;background:radial-gradient(rgba(60,35,10,.4),transparent 70%);z-index:-1}
.dr-spot:hover,.dr-spot:focus-visible{transform:translate(-50%,-100%) scale(1.1);outline:none;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 4px #FFC93C)}
.dr-shelf{position:absolute;left:34%;top:48%;width:10%;height:1.6%;background:#A26A35;border:3px solid #4A2C12;border-radius:3px}
.dr-rug{position:absolute;left:30%;top:80%;width:34%;height:14%;background:radial-gradient(ellipse,#E5533F 0 55%,#C2410C 56% 62%,#E5533F 63%);border-radius:50%;opacity:.85}
.dr-desk{position:absolute;left:18%;top:74%;width:20%;height:4%;background:#A26A35;border:3px solid #4A2C12;border-radius:4px;z-index:1}
.dr-desk::before,.dr-desk::after{content:"";position:absolute;top:100%;width:8%;height:220%;background:#7A5230}.dr-desk::before{left:6%}.dr-desk::after{right:6%}
.dr-spot.done{filter:grayscale(.6);opacity:.65;cursor:default}
.dr-spot.done::after{content:"✓";position:absolute;right:-4px;top:-4px;font-size:1.1rem;background:var(--grass);color:#fff;border:3px solid var(--ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.dr-door{position:absolute;right:6%;top:16%;width:18%;height:54%;background:linear-gradient(90deg,#8B5A2B,#A26A35);border:5px solid #4A2C12;border-radius:8px 8px 0 0;cursor:pointer;z-index:2;transition:transform .8s;transform-origin:left center}
.dr-door::before{content:"";position:absolute;inset:10% 14% 52% 14%;border:4px solid #6B4220;border-radius:4px}
.dr-door::after{content:"";position:absolute;inset:56% 14% 8% 14%;border:4px solid #6B4220;border-radius:4px}
.dr-door .pad{position:absolute;right:-30%;top:40%;background:#2B2D42;border:3px solid var(--ink);border-radius:6px;font-size:clamp(.7rem,1.6vh,1rem);color:#7CFF9B;padding:4px 6px;font-weight:800;z-index:3}
.dr-door.open{transform:perspective(600px) rotateY(-75deg)}
.dr-exit{position:absolute;right:6%;top:16%;width:18%;height:54%;background:radial-gradient(#FFF7C9,#FFC93C);display:grid;place-items:center;font-size:5cqw;z-index:1}
.dr-window{position:absolute;left:30%;top:10%;width:16%;height:26%;background:linear-gradient(#9ED8FF,#D9F1FF);border:6px solid #fff;outline:4px solid var(--ink);border-radius:6px}
.dr-board{position:absolute;left:4%;top:12%;width:22%;height:30%;background:#2F5D50;border:6px solid #8B5A2B;border-radius:6px;color:#fff;font-weight:700;display:grid;place-items:center;text-align:center;font-size:clamp(.55rem,2.2cqw,1.2rem);padding:6px}
.dr-inv{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.dr-inv .es-note{min-width:120px;text-align:center}
.dr-inv .slot{border:3px dashed rgba(29,43,83,.35);border-radius:8px;padding:6px 12px;min-width:120px;text-align:center;color:rgba(29,43,83,.5);font-weight:700}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="escape.js"></script>
<script>
Kit.mount("🚪", "Digital Escape Room");

Esc.setup({intro:'🚪🔢', minutes:15,
how:'You are locked in the classroom! Click things around the room to search them. Each object asks a question, and answering it reveals a sticky note with one digit of the door code and its position. Not every object hides a digit. When you have all four digits, click the door and enter the code.',
start({room}){
 const $=id=>document.getElementById(id);
 const code=Array.from({length:4},()=>Kit.rand(0,9));window.__sol={code:code.join('')};
 // [emoji, name, [x%, bottom y%, width%]] - things on the floor (y over 70) get a shadow
 const SPOTS=[['🖼️','painting',[56,40,10]],['📚','bookshelf',[9,92,11]],['🕰️','clock',[39,48,6]],['🪴','plant',[66,90,9]],['🗄️','filing cabinet',[54,84,10]],['💻','computer',[28,74.5,9]],['🎒','backpack',[45,96,8]],['🧸','teddy bear',[20,97,8]]];
 const spots=Kit.shuffle(SPOTS).slice(0,7);
 const hide=Kit.shuffle(spots.map((_,i)=>i)); const holds={};hide.slice(0,4).forEach((s,k)=>holds[s]=k); // spot index -> digit position
 const found=[];const ORD=['1st','2nd','3rd','4th'];
 room.innerHTML=`<div class="dr-scene" id="scene"><div class="dr-board">Find the code<br>____</div><div class="dr-window"></div><div class="dr-exit">🌞</div>
  <div class="dr-shelf"></div><div class="dr-rug"></div><div class="dr-desk"></div>
  <div class="dr-door" id="door" role="button" tabindex="0" aria-label="Door"><span class="pad">####</span></div>
  ${spots.map((s,i)=>`<button class="dr-spot ${s[2][1]>70?'fl':''}" data-i="${i}" style="left:${s[2][0]}%;top:${s[2][1]}%;width:${s[2][2]}%;z-index:${s[2][1]>70?3+Math.round(s[2][1]):2}" aria-label="Search the ${s[1]}"><img src="${E3D.url(s[0])}" alt="${s[1]}" draggable="false"></button>`).join('')}</div>
  <div class="dr-inv" id="inv"></div>`;
 const inv=()=>$('inv').innerHTML=ORD.map((o,k)=>found.includes(k)?`<span class="es-note">${o} digit: <b style="font-size:1.4em">${code[k]}</b></span>`:`<span class="slot">${o} digit: ?</span>`).join('');inv();
 Esc.stat(`📝 0 of 4 digits`);Esc.msg('Click something in the room to search it.');
 let busy=false;
 $('scene').addEventListener('click',async e=>{const b=e.target.closest('.dr-spot');if(!b||busy||b.classList.contains('done'))return;busy=true;const i=+b.dataset.i;
  const ok=await Esc.ask({icon:spots[i][0],title:`Search the ${spots[i][1]}`});busy=false;if(!ok)return;
  b.classList.add('done');b.disabled=true;
  if(holds[i]!=null){const k=holds[i];found.push(k);inv();Esc.stat(`📝 ${found.length} of 4 digits`);
   await Esc.reward('📝',`A sticky note!<br>The <b>${ORD[k]}</b> digit is <b>${code[k]}</b>`);
   Esc.msg(found.length===4?'You have every digit. Click the door! 🚪':`${4-found.length} more digit${found.length===3?'':'s'} to find.`);}
  else{await Esc.reward('🕸️','Just dust and an old pencil.<br>Nothing here!');}
 });
 const tryDoor=async()=>{if(busy)return;busy=true;
  const ov=document.createElement('div');ov.className='es-ov';ov.innerHTML=`<div class="es-q"><div class="ic">🚪</div><h2>Door keypad</h2><div id="kp"></div><button class="btn white small" id="kx" style="margin-top:8px">Step back</button></div>`;document.body.appendChild(ov);
  $('kx').onclick=()=>{ov.remove();busy=false};
  for(;;){const r=await Esc.keypad($('kp'),4);if(!ov.isConnected)return;
   if(r.value===code.join('')){r.screen.classList.add('good');r.screen.textContent='OPEN';Kit.ding();await Kit.sleep(700);ov.remove();$('door').classList.add('open');await Kit.sleep(900);
    Esc.win('🎉','You escaped!',`The code was ${code.join('')}. The class is free!`);return}
   r.screen.classList.add('bad');r.screen.textContent='DENIED';Esc.penalize();Kit.tone(150,.4,'sawtooth',.2);await Kit.sleep(900)}};
 $('door').onclick=tryDoor;$('door').onkeydown=e=>{if(e.key==='Enter')tryDoor()};
}});
</script>
</body></html>
