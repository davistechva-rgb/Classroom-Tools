<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56B8EA">
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<title>Virtual Lockbox</title>
<style>
.lb-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:820px){.lb-wrap{grid-template-columns:1fr}}
.lb-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lb-card{aspect-ratio:3/4;perspective:900px;cursor:pointer;border:0;background:none;padding:0;font:inherit}
.lb-card .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.lb-card.flip .in{transform:rotateY(180deg)}
.lb-card .f,.lb-card .b{position:absolute;inset:0;backface-visibility:hidden;border:5px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);display:grid;place-items:center;text-align:center;padding:10px}
.lb-card .f{background:repeating-linear-gradient(45deg,#9B6BF2 0 14px,#8A5AE0 14px 28px);color:#fff;font-size:clamp(2.6rem,6vh,4rem)}
.lb-card .f small{display:block;font-size:1rem;font-weight:700}
.lb-card .b{background:#FFF6C9;transform:rotateY(180deg);font-weight:700;font-size:clamp(1.05rem,2.4vh,1.4rem);color:var(--ink)}
.lb-card .b .pos{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:0 12px;font-size:.85em;margin-bottom:6px}
.lb-card .b .eq{font-size:1.55em;display:block;margin-top:6px}
.lb-box{background:linear-gradient(#5A6C8A,#3E4D68);border:6px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink);padding:24px 16px 20px;position:relative;text-align:center;color:#fff}
.lb-lid{height:46px;background:linear-gradient(#6E83A8,#52648A);border:6px solid var(--ink);border-radius:18px 18px 6px 6px;margin:-6px -6px 14px;transform-origin:bottom left;transition:transform 1s cubic-bezier(.3,1.4,.5,1)}
.lb-box.open .lb-lid{transform:rotate(-38deg) translateY(-20px)}
.lb-wheels{display:flex;gap:10px;justify-content:center}
.lb-wheel{display:flex;flex-direction:column;align-items:center;gap:6px}
.lb-wheel button{font:inherit;font-size:1.3rem;width:62px;border:4px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.lb-wheel button:active{transform:translateY(4px);box-shadow:none}
.lb-dig{width:62px;height:84px;border:4px solid var(--ink);border-radius:12px;background:linear-gradient(#ddd,#fff 30%,#fff 70%,#ccc);color:var(--ink);font:800 3rem/76px ui-monospace,Consolas,monospace;overflow:hidden;position:relative}
.lb-dig.spin{animation:lbspin .18s}@keyframes lbspin{0%{transform:translateY(-14px);opacity:.4}}
.lb-try{margin-top:16px}
.lb-box.bad{animation:esshake .45s}
.lb-gold{font-size:4rem;display:none}.lb-box.open .lb-gold{display:block;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
</style></head>
<body>
<main></main>
<script src="kit.js"></script>
<script src="escape.js"></script>
<script>
Kit.mount("🧰", "Virtual Lockbox");

Esc.setup({intro:'🧰🃏', minutes:10,
how:'A locked box sits on the desk with four clue cards beside it. Click a card and answer its question to flip it over. Each card has a little math puzzle, and its answer is one digit of the code. Spin the four wheels on the box to the right digits and press Open.',
start({room}){
 const $=id=>document.getElementById(id);
 const code=Array.from({length:4},()=>Kit.rand(0,9));window.__sol={code:code.join('')};
 const clue=d=>{const k=Kit.rand(0,5);
  if(k===0){const a=Kit.rand(d,d+9),b=a-d;return `${a} − ${b}`}
  if(k===1){const a=Kit.rand(0,d);return `${a} + ${d-a}`}
  if(k===2){const m=Kit.rand(2,5);return `${d*m} ÷ ${m}`}
  if(k===3){return `half of ${d*2}`}
  if(k===4&&d>0){const a=Kit.rand(1,3);return `${d+a*2} − ${a} − ${a}`}
  return `(${d} × 10) ÷ 10`};
 const ORD=['1st','2nd','3rd','4th'];const order=Kit.shuffle([0,1,2,3]);
 room.innerHTML=`<div class="lb-wrap"><div class="lb-cards">${order.map((k,i)=>`<button class="lb-card" data-k="${k}" aria-label="Clue card ${i+1}"><div class="in"><div class="f">🃏<small>Clue ${i+1}</small></div>
  <div class="b"><div><span class="pos">${ORD[k]} digit</span><span class="eq">${clue(code[k])}</span></div></div></div></button>`).join('')}</div>
  <div class="lb-box" id="box"><div class="lb-lid"></div><div class="lb-gold">💰</div><div style="font-weight:700;margin-bottom:10px">🔒 Lockbox</div>
  <div class="lb-wheels">${[0,1,2,3].map(i=>`<div class="lb-wheel"><button data-u="${i}" aria-label="Wheel ${i+1} up">▲</button><div class="lb-dig" id="d${i}">0</div><button data-dn="${i}" aria-label="Wheel ${i+1} down">▼</button></div>`).join('')}</div>
  <button class="btn big green lb-try" id="open">Open</button></div></div>`;
 const v=[0,0,0,0],draw=i=>{const e=$('d'+i);e.textContent=v[i];e.classList.remove('spin');void e.offsetWidth;e.classList.add('spin')};
 $('box').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.u!=null){const i=+b.dataset.u;v[i]=(v[i]+1)%10;draw(i);Kit.tick()}
  if(b.dataset.dn!=null){const i=+b.dataset.dn;v[i]=(v[i]+9)%10;draw(i);Kit.tick()}
  if(b.id==='open'){if(v.join('')===code.join('')){$('box').classList.add('open');Kit.ding();await Kit.sleep(900);Esc.win('💰','The box is open!',`The code was ${code.join('')}. You found the treasure!`)}
   else{$('box').classList.remove('bad');void $('box').offsetWidth;$('box').classList.add('bad');Esc.penalize();Kit.tone(150,.4,'sawtooth',.2);Esc.msg('🔒 Still locked. Check your math!')}}};
 let flipped=0,busy=false;Esc.stat('🃏 0 of 4 clues');Esc.msg('Click a clue card to earn it.');
 room.querySelector('.lb-cards').onclick=async e=>{const c=e.target.closest('.lb-card');if(!c||busy||c.classList.contains('flip'))return;busy=true;
  const ok=await Esc.ask({icon:'🃏',title:'Answer to flip this card'});busy=false;if(!ok)return;c.classList.add('flip');flipped++;Esc.stat(`🃏 ${flipped} of 4 clues`);
  Esc.msg(flipped===4?'All four clues are face up. Solve them and set the wheels!':'Solve the puzzle on the card to get that digit.')};
}});
</script>
</body></html>
